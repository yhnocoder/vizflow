<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>vizflow scene3d：模块大括号与相机跟随</title>
<style>
h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0 0 12px; }
#stage { height: var(--vf-stage-height); min-height: 360px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.bar button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); cursor: pointer; }
.bar .step { font-family: var(--serif); color: var(--muted); }
</style>
</head>
<body>
<main class="vf-page">
  <h1>模块大括号与相机跟随（scene3d）</h1>
  <div id="stage"></div>
  <div class="bar">
    <button id="prev" type="button">← 上一步</button>
    <button id="next" type="button">下一步 →</button>
    <span class="step" id="step"></span>
    <button id="toggleTheme" type="button">切换深色</button>
  </div>
</main>
<script type="module">
import { graph } from '@yhnocoder/vizflow/core';
import { createSteps } from '@yhnocoder/vizflow/steps';
import { mountScene, board, stack } from '@yhnocoder/vizflow/scene3d';

const params = new URLSearchParams(location.search);
const follow = params.get('follow') !== '0';

const g = graph({ dims: { d: 4, V: 5 } });
const h = g.input('h', [1, 'd'], [0.8, -1.1, 0.5, 1.4]);
const W = g.param('W', ['V', 'd'], [
  [0.9, -0.6, 0.3, 0.6],
  [0.2, -0.8, 0.6, 0.2],
  [-0.4, 0.2, 0.9, 0.3],
  [0.5, 0.7, -0.6, -0.2],
  [-0.7, 0.4, -0.3, -0.5],
], { tex: 'W', elem: 'W' });
const t = g.label('t', [0], { tokens: [' mat', ' floor', ' sofa', ' dog', ' sat'] });
const z = g.matmul(h, W.T, { name: 'z' });
const L = g.logsumexp(z, -1, { keepdim: true, name: 'LSE' });
const logp = g.sub(z, L, { name: 'log p', tex: '\\log\\mathbf{p}', elem: '\\log p' });
const loss = g.nll_loss(logp, t, { name: 'loss', tex: '\\ell', elem: '\\ell' });

const steps = createSteps(g, {
  overview: { title: '整张图', text: '损失 {{loss:3}}。' },
  forward: [
    { show: [h, W.T], label: 'h, Wᵀ', title: '输入', text: '输入 h 和权重 Wᵀ。' },
    { show: z, label: 'z', title: 'lm_head', text: '$$z = hW^{\\top}$$' },
    { show: L, label: 'LSE', title: 'log-sum-exp', text: '$$\\mathrm{LSE} = {{LSE}}$$' },
    { show: logp, label: 'log p', title: 'log_softmax', text: '$$\\log p_{ {{t+1}} } = {{log p[t]}}$$' },
    { show: loss, label: 'ℓ', title: 'nll_loss', text: '$$\\ell = {{loss:3}}$$' },
  ],
  backward: 'auto',
});

const scene = mountScene('#stage', g, {
  steps,
  layout: [
    board(h, W.T, z, { scales: { h: { forward: 0.45, backward: 1.2 }, 'W.T': { forward: 0.6, backward: 0.8 }, z: { forward: 0.3, backward: 1.6 } } }),
    stack(z, L, logp, loss, { scales: { 'log p': { forward: 0.32, backward: 1.6 } } }),
  ],
  modules: [
    { title: 'lm_head', subtitle: 'model.lm_head', nodes: [h, W.T, z] },
    { title: 'logits', subtitle: 'z = h @ W.T', nodes: [z] },
    { title: 'log_softmax', subtitle: 'F.log_softmax', nodes: [L, logp], side: 'right' },
    { title: 'NLL Loss', subtitle: 'F.nll_loss', nodes: [L, logp, loss], side: 'right' },
    { title: 'ℓ', nodes: [loss], side: 'right' },
  ],
  camera: { follow },
  hint: '拖动旋转 · 右键拖动平移 · 滚轮按光标缩放 · 换步骤时相机跟随当前步骤',
});

const stepLabel = document.getElementById('step');
const showStep = () => {
  const info = steps.list[steps.current];
  stepLabel.textContent = `${info.dir === 'forward' ? '前向' : '反向'} ${info.index}：${steps.text().title}`;
};
steps.subscribe(showStep);
showStep();
document.getElementById('prev').addEventListener('click', () => steps.prev());
document.getElementById('next').addEventListener('click', () => steps.next());
document.getElementById('toggleTheme').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
});

window.vizflow = { g, steps, scene, nodes: { h, W, t, z, L, logp, loss } };
document.body.dataset.ready = 'true';
</script>
</body>
</html>
