module: Qwen3_5MoeSparseMoeBlock
subtitle: Qwen3_5MoeSparseMoeBlock
import:
  SparseMoE: vizflow/nn/moe
  GLU: vizflow/nn/glu
  Sigmoid: vizflow/nn/sigmoid
params:
  E:  { type: dim }
  K:  { type: dim }
  mf: { type: dim }
  sf: { type: dim }
  mlp_class: { type: text, default: Qwen3_5MoeMLP }
  router_note: { type: text, default: '<code>Qwen3_5MoeTopKRouter</code> 没有 norm_topk_prob 这个开关，总是执行这一行，所以这里传 true。' }
inputs:
  x: { shape: [T, d] }
outputs: [out]
weights:
  Wsg: { shape: [1, d], tex: 'W_{sg}' }
fold:
  label: '$\of{out}=\mathrm{mlp}(\of{x})$'
  title: mlp（已折叠）
  text: |
    路由、\of{E} 个路由专家、共享专家和它的门都收进了盒子，对应 HF 里 <code>self.mlp(hidden_states)</code>。每个位置只经过 $K=\of{K}$ 个路由专家和 1 个共享专家，位置之间互不影响。
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 mlp（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - shared_expert:
      use: GLU
      subtitle: \of{mlp_class}，共享专家
      suffix: s
      params: { act: SiLU, f: sf, name: shared_expert }
      inputs: { x: x }
      outputs: { down: ys }
      tex: { down: '\mathbf{y}^{\mathrm{s}}', a: '\mathrm{SiLU}(\mathbf{gate}_{s})' }
  - routed:
      use: SparseMoE
      inline: true
      params: { E: E, K: K, mf: mf, norm_topk_prob: true }
      inputs: { x: x }
      outputs: { out: yr }
      tex: { out: '\mathbf{y}^{\mathrm{r}}' }
      steps:
        topsum:
          append: |
            \of{router_note}
  - gl: { op: x @ Wsg.T, tex: '\mathbf{g}^{\mathrm{s}}' }
  - gate_sigmoid:
      use: Sigmoid
      inputs: { x: gl }
      outputs: { out: gs }
      tex: { out: '\sigma(\mathbf{g}^{\mathrm{s}})' }
      steps:
        neg:
          append: 这里算的是共享专家的门 <code>shared_expert_output = F.sigmoid(self.shared_expert_gate(hidden_states_reshaped)) * shared_expert_output</code> 里的 <code>F.sigmoid(self.shared_expert_gate(hidden_states_reshaped))</code>：每个位置一个 0 到 1 之间的系数，决定这个位置用多少共享专家的输出。
  - shared: { op: gs * ys, tex: '\sigma(\mathbf{g}^{\mathrm{s}})\odot\mathbf{y}^{\mathrm{s}}' }
  - out: { op: yr + shared, tex: '\mathbf{moe}' }
steps:
  - id: shared_gate
    brace: { title: shared_expert_gate, subtitle: nn.Linear }
    show: [Wsg.T, gl]
    label: '$\of{gl}=\of{x}W_{sg}^{\top}$'
    title: 共享专家的门：shared_expert_gate
    text: |
      <code>shared_expert_gate</code> 是一个输出只有 1 维的 Linear，没有 bias，每个位置得到一个分数，下面经过 sigmoid 变成门的系数。
      $$\of{gl}={{ gl | matrix:3 }}$$
    backward:
      label: '$\partial W_{sg},\ \partial\of{x}$'
      title: 传到共享专家的门
      text: |
        $$\frac{\partial\ell}{\partial\of{gl}}={{ gl.grad | matrix:3 }}$$
  - id: shared_scale
    show: shared
    label: '$\of{shared}$'
    title: 共享专家乘上门
    text: |
      共享专家每个位置都要经过，它的输出按位置乘上门的系数。路由专家的权重在 top-k 里归一化，共享专家的系数单独由 sigmoid 给出，两者互不影响。
      $$\of{shared}={{ shared | matrix:2 }}$$
    backward:
      label: '$\partial\of{gs},\ \partial\of{ys}$'
      title: 梯度分给门和共享专家
  - id: add
    show: out
    label: '$\of{out}=\of{yr}+\of{shared}$'
    title: 加上共享专家
    text: |
      路由专家的加权和加上带门的共享专家，得到 MoE 的输出。
      $$\of{out}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\of{yr},\ \partial\of{shared}$'
      title: 梯度分给路由专家和共享专家
