title: DeepSeek V3 训练与推理
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  DeepseekV3ForCausalLM: vizflow/models/deepseek_v3/for-causal-lm

model: DeepseekV3ForCausalLM

generate: { steps: 3 }

config:
  V: 5
  d_model: 4
  d_ff: 6
  d_moe: 2
  num_heads: 2
  q_lora_rank: 3
  kv_lora_rank: 3
  qk_nope_head_dim: 2
  qk_rope_head_dim: 4
  v_head_dim: 2
  n_routed_experts: 6
  num_experts_per_tok: 2
  n_group: 2
  topk_group: 1
  n_shared_experts: 1
  routed_scaling_factor: 2.5
  norm_topk_prob: True
  num_layers: 2
  first_k_dense_replace: 1
  rope_theta: 10
  rope_type: yarn
  factor: 40
  original_max_position_embeddings: 16
  beta_fast: 32
  beta_slow: 1
  mscale: 1
  mscale_all_dim: 1
  dtype: bf16
  seed: 20261014
  tokenizer:
    vocab: [on, mat, the, sat, cat]
  real:
    deepseek-v3: { name: DeepSeek-V3, T: 4096, V: 129280, d_model: 7168, d_ff: 18432, d_moe: 2048, num_heads: 128, q_lora_rank: 1536, kv_lora_rank: 512, qk_nope_head_dim: 128, qk_rope_head_dim: 64, v_head_dim: 128, n_routed_experts: 256, num_experts_per_tok: 8, n_group: 8, topk_group: 4, n_shared_experts: 1, num_layers: 61, first_k_dense_replace: 3, rope_theta: 10000, original_max_position_embeddings: 4096 }

data:
  tokens: [the, cat]
  ids: { expr: 'tokens_to_ids(tokens[:-1])' }
  y: { expr: 'tokens_to_ids(tokens[1:])' }

panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
    mode: train
  - { cost: true, mode: train }
  - generation: true
    mode: infer
    title: 生成过程
  - sequence: true
    mode: train
    tokens: tokens
    input: ids
    label: y
    title: Sequence
    sgd: { params: all, lr: 0.5, label: Update }
    random: true
    reset: true
  - title: 对应的 PyTorch 计算
    mode: infer
    code: |-
      ids = tok("the cat", return_tensors="pt").input_ids
      out = model.generate(ids, max_new_tokens=3, do_sample=False)
      # generate 内部：
      # prefill：一次前向算 prompt 的全部位置，写满 past_key_values，
      #          lm_head 只算最后一个位置（logits_to_keep=1）
      # decode：每步只送上一步选出的 1 个 token，
      #          读缓存、只算这一个位置、更新缓存
