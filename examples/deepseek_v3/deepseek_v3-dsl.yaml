title: DeepSeek V3：MLA 与 MoE
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  DeepseekV3ForCausalLM: vizflow/models/deepseek_v3/for-causal-lm

model: DeepseekV3ForCausalLM

config:
  V: 5
  d_model: 4
  d_ff: 6
  d_moe: 2
  num_heads: 2
  q_lora_rank: 3
  kv_lora_rank: 3
  qk_nope_head_dim: 2
  qk_rope_head_dim: 4
  v_head_dim: 2
  n_routed_experts: 6
  num_experts_per_tok: 2
  n_group: 2
  topk_group: 1
  n_shared_experts: 1
  routed_scaling_factor: 2.5
  num_layers: 2
  first_k_dense_replace: 1
  rope_theta: 10
  dtype: bf16
  seed: 20261014
  tokenizer:
    vocab: [on, mat, the, sat, cat]
  real:
    deepseek-v3: { name: DeepSeek-V3, T: 4096, V: 129280, d_model: 7168, d_ff: 18432, d_moe: 2048, num_heads: 128, q_lora_rank: 1536, kv_lora_rank: 512, qk_nope_head_dim: 128, qk_rope_head_dim: 64, v_head_dim: 128, n_routed_experts: 256, num_experts_per_tok: 8, n_group: 8, topk_group: 4, n_shared_experts: 1, num_layers: 61, first_k_dense_replace: 3, rope_theta: 10000 }

data:
  tokens: [the, cat, sat, on]
  ids: { expr: 'tokens_to_ids(tokens[:-1])' }
  y: { expr: 'tokens_to_ids(tokens[1:])' }

panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
  - cost
  - sequence: true
    tokens: tokens
    input: ids
    label: y
    title: Sequence
    sgd: { params: all, lr: 0.5, label: Update }
    random: true
    reset: true
