module: DeepseekV3MoE
subtitle: DeepseekV3MoE
import:
  GLU: vizflow/nn/glu
  Sigmoid: vizflow/nn/sigmoid
params:
  E:   { type: dim }
  G:   { type: dim }
  TG:  { type: dim }
  K:   { type: dim }
  mf:  { type: dim }
  Sh:  { type: dim }
  rsf: { type: float, default: 2.5 }
inputs:
  x: { shape: [T, d] }
outputs: [out]
weights:
  Wr: { shape: [E, d], tex: 'W_{r}' }
buffers:
  bias: { value: zeros(E), tex: '\mathbf{b}', dtype: fp32 }
fold:
  label: '$\of{out}=\mathrm{mlp}(\of{x})$'
  title: mlp（已折叠）
  text: |
    路由、\of{E} 个路由专家和共享专家都收进了盒子，对应 HF 里 <code>self.mlp(hidden_states)</code>。每个位置只经过 $K=\of{K}$ 个路由专家和 1 个共享专家，位置之间互不影响。
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 mlp（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - gate:
      title: gate
      subtitle: DeepseekV3TopkRouter
      body:
        - logits: { op: x @ Wr.T, tex: '\mathbf{r}', dtype: fp32 }
        - scores:
            use: Sigmoid
            inputs: { x: logits }
            outputs: { out: s }
            tex: { out: '\mathbf{s}' }
            steps:
              neg:
                append: 这里算的是 <code>scores = router_logits.sigmoid()</code>。DeepSeek V3 用 sigmoid 把分数变成 0 到 1 之间的亲和度 $\of{s}$，各个专家互不影响；V2 和很多别的 MoE 用的是 softmax。
              recip:
                backward:
                  text: |
                    只有被选中的专家把梯度传回 $\of{s}$，没选中的那几列梯度是 0。取倒数的局部导数是 $-\of{s}^{2}$。
                    $$\frac{\partial\ell}{\partial\of{s}}={{ s.grad | matrix:3 }}$$
        - sc: { op: s + bias, tex: '\tilde{\mathbf{s}}' }
        - sg: { op: 'view(sc, T, G, E // G)', tex: '\tilde{\mathbf{s}}^{\mathrm{grp}}' }
        - top2: { op: 'sg * topk_mask(sg, 2, -1)', tex: '\tilde{\mathbf{s}}^{\mathrm{top2}}' }
        - gs: { op: 'sum(top2, -1)', tex: '\mathbf{g}' }
        - gm: { op: 'topk_mask(gs, TG, -1)', tex: '\mathbf{m}^{\mathrm{grp}}' }
        - em: { op: 'repeat_interleave(gm, E // G, -1)', tex: '\mathbf{m}^{\mathrm{exp}}' }
        - choice: { op: 'where(em, sc, -inf)', tex: '\tilde{\mathbf{s}}^{\mathrm{cand}}' }
        - sel: { op: 'topk_mask(choice, K, -1)', tex: '\mathbf{m}^{\mathrm{sel}}' }
        - w: { op: s * sel, tex: '\mathbf{w}' }
        - den: { op: 'sum(w, -1, keepdim=true) + 1e-20', tex: '\textstyle\sum\mathbf{w}' }
        - wn: { op: w / den, tex: '\bar{\mathbf{w}}' }
        - rw: { op: wn * rsf, tex: '\mathbf{p}' }
  - for: e
    in: 1..E
    body:
      - expert[e]:
          use: GLU
          subtitle: DeepseekV3Experts，路由专家
          folded: true
          params: { act: SiLU, f: mf, name: expert }
          inputs: { x: x }
          outputs: { down: 'y[e]' }
      - yv[e]: { op: 'view(y[e], T, 1, d)', tex: 'Y_{:,\of{e},:}' }
  - Y: { op: 'cat(yv[1..E], dim=1)', tex: 'Y' }
  - Yw: { op: 'Y * view(rw, T, E, 1)', tex: '\mathbf{p}\odot Y' }
  - routed: { op: 'sum(Yw, 1)', tex: '\mathbf{y}^{\mathrm{r}}' }
  - shared_experts:
      use: GLU
      subtitle: DeepseekV3MLP，共享专家
      suffix: s
      folded: true
      params: { act: SiLU, f: mf*Sh, name: shared }
      inputs: { x: x }
      outputs: { down: shared }
      tex: { down: '\mathbf{y}^{\mathrm{s}}' }
  - out: { op: routed + shared, tex: '\mathbf{moe}' }
steps:
  - id: router
    show: [Wr.T, logits]
    label: '$\of{logits}=\of{x}W_r^{\top}$'
    title: 每个专家一个分数
    text: |
      gate 的权重 $W_r$ 每行对应一个路由专家，$\of{x}W_r^{\top}$ 给每个位置、每个专家一个分数，HF 把输入和权重都转成 float32 再乘。
      $$\of{logits}={{ logits | matrix:3 }}$$
    backward:
      label: '$\partial W_r,\ \partial\of{x}$'
      title: 传到 gate 的权重和 $\of{x}$
      text: |
        $$\frac{\partial\ell}{\partial\of{logits}}={{ logits.grad | matrix:3 }}$$
  - id: bias
    show: [bias, sc]
    label: '$\of{sc}=\of{s}+\of{bias}$'
    title: 加上负载均衡的偏置
    text: |
      <code>e_score_correction_bias</code> 是每个专家一个的偏置，只用来挑专家，不进入专家输出的权重。它是 buffer，不靠梯度更新：训练时哪个专家接的 token 太多就把它的偏置调低，太少就调高。DeepSeek V3 用它代替辅助的负载均衡损失。
      $$\of{bias}={{ bias | matrix:3 }},\qquad \of{sc}={{ sc | matrix:3 }}$$
  - id: group
    show: [sg, top2, gs]
    label: '$\of{gs}$'
    title: 每组专家的得分
    text: |
      \of{E} 个专家按编号分成 $G=\of{G}$ 组，每组 \of{E//G} 个。每组取最大的两个 $\of{sc}$ 相加，作为这一组的得分。真实模型里 256 个专家分成 8 组，每组 32 个。
      $$\of{gs}={{ gs | matrix:3 }}$$
  - id: group_pick
    show: [gm, em]
    label: '$\of{em}$'
    title: 每个位置只看得分最高的 \of{TG} 组
    text: |
      每个位置挑出得分最高的 $\of{TG}$ 组，其余组里的专家这一次都不能选。真实模型里每个 token 最多用 8 组里的 4 组，部署时专家按组放在不同的节点上，这样每个 token 最多发往 4 个节点，通信量有上限。挑选只决定 0 和 1，没有梯度。
      $$\of{em}={{ em | matrix:2 }}$$
  - id: topk
    show: [choice, sel]
    label: '$\of{sel}$'
    title: 'top-$\of{K}$：选出 $K$ 个专家'
    text: |
      不能选的专家记成 $-\infty$，再在剩下的专家里按 $\of{sc}$ 选最大的 $K=\of{K}$ 个。真实模型里每个 token 从 256 个路由专家里选 8 个。
      $$\of{sel}={{ sel | matrix:2 }}$$
  - id: weights
    show: [w, den, wn, rw]
    label: '$\of{rw}$'
    title: 专家的权重
    text: |
      权重用不带偏置的 $\of{s}$：选中的那几个亲和度除以它们的和，再乘 routed_scaling_factor $=\of{rsf}$。没选中的专家权重是 0。
      $$\of{rw}=\of{rsf}\cdot\frac{\of{s}\odot\of{sel}}{\sum\of{s}\odot\of{sel}}={{ rw | matrix:3 }}$$
    backward:
      label: '$\partial\of{s}$'
      title: 穿过归一化，传到亲和度
      text: |
        归一化让被选中的几个亲和度互相影响：一个专家的亲和度变大，其他被选中的专家的权重就变小。
        $$\frac{\partial\ell}{\partial\of{w}}={{ w.grad | matrix:3 }}$$
  - id: combine
    show: ['yv[1..E]', Y, Yw, routed]
    label: '$\of{routed}$'
    title: 按权重加起来
    text: |
      每个专家的输出乘上自己的权重，再按专家加起来。这里为了画图，每个专家对所有位置都算了一遍，权重是 0 的那些行不起作用；HF 的实现只把每个专家被选中的那些 token 送进去算。
      $$\of{routed}=\sum_e p_{e}\,\mathbf{y}^{(e)}={{ routed | matrix:2 }}$$
    backward:
      label: '$\partial\mathbf{y}^{(e)},\ \partial\of{rw}$'
      title: 传到各个专家的输出和权重
      text: |
        专家 $e$ 的输出收到的梯度是 $p_e\,\partial\ell/\partial\of{routed}$，没选中这个专家的位置梯度是 0，所以这个专家的参数只从选中它的 token 学习。
  - id: add
    show: out
    label: '$\of{out}=\of{routed}+\of{shared}$'
    title: 加上共享专家
    text: |
      共享专家每个位置都要经过，权重固定是 1，学所有 token 共有的部分；路由专家可以更专门。
      $$\of{out}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\of{routed},\ \partial\of{shared}$'
      title: 梯度分给路由专家和共享专家
