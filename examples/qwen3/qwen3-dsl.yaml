title: Qwen3 Basic
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  LogSoftmax: vizflow/nn/log-softmax
  NLLLoss: vizflow/nn/nll-loss
  RMSNorm: vizflow/nn/rmsnorm
  GLU: vizflow/nn/glu
  RotaryEmbedding: vizflow/nn/rotary-embedding
  Qwen3DecoderLayer: ./decoder.yaml

preamble: ../preamble.sty

model: Qwen3ForCausalLM

config:
  V: 5
  d_model: 4
  d_head: 4
  d_ff: 6
  num_heads: 2
  num_kv_heads: 1
  num_layers: 2
  rope_theta: 10
  dtype: bf16
  seed: 20261010
  tokenizer:
    vocab: [on, mat, the, sat, cat]
  real:
    qwen3-8b: { name: Qwen3-8B, T: 8192, V: 151936, d_model: 4096, d_head: 128, d_ff: 12288, num_heads: 32, num_kv_heads: 8, num_layers: 36, rope_theta: 1000000 }

data:
  tokens: [the, cat, sat, on]
  ids: { expr: 'tokens_to_ids(tokens[:-1])' }
  y: { expr: 'tokens_to_ids(tokens[1:])' }

modules:
  Qwen3ForCausalLM:
    args:
      V: dim
      d_model: dim
      d_head: dim
      d_ff: dim
      num_heads: dim
      num_kv_heads: dim
      num_layers: int
      rope_theta: float
      dtype: dtype
    inputs:
      tokens: { type: list, dtype: str }
      ids: { type: tensor, shape: [T], dtype: int64 }
      y: { type: tensor, shape: [T], dtype: int64 }
    outputs:
      z: { type: tensor, shape: [T, V], dtype: dtype }
      loss: { type: tensor, shape: [], dtype: fp32 }

    init:
      embed_tokens:
        use: Embedding
        args: { num_embeddings: V, embedding_dim: d_model }
      layers:
        use: list[Qwen3DecoderLayer]
        count: num_layers
        args: [d_model, d_head, d_ff, num_heads, num_kv_heads]
      rotary_emb:
        use: RotaryEmbedding
        args: [d_head, rope_theta]
      norm:
        use: RMSNorm
        args: { hidden_size: d_model }
      lm_head:
        use: Linear
        args: { in_features: d_model, out_features: V, bias: false }
      log_softmax: LogSoftmax
      nll_loss: NLLLoss

    forward:
      - e: embed_tokens(ids)
      - position_ids: arange(T)
      - position_embeddings: rotary_emb(e, position_ids)
      - cos: position_embeddings.cos
      - sin: position_embeddings.sin
      - M: causal_mask(T)
      - h_last: layers(e, mask=M, cos=cos, sin=sin)
      - h_norm: norm(h_last)
      - z: lm_head(h_norm)
      - zf: z.float()
      - logp: log_softmax(zf)
      - result: nll_loss(logp=logp, y=y)
      - loss: result.loss
      - lt: result.lt

    tex:
      ids: 'x'
      e: '\mathbf{e}'
      h_last: '\mathbf{h}_{\mathrm{last}}'
      h_norm: '\mathbf{h}_{\mathrm{norm}}'
      z: '\mathbf{z}'
      zf: '\mathbf{z}_{\mathrm{fp32}}'
      loss: '\ell'
      lt: '\ell_t'
      position_ids: 't'
      cos: '\cos'
      sin: '\sin'
      M: 'M'
      embed_tokens.weight: 'E'
      lm_head.weight: 'W'

    steps:
      - id: overview
        label: 总览
        title: 模型如何预测下一个词
        show: { all: true }
        text: |
          输入是 <code>{{ tokens[:-1] | join: " " }}</code>，模型要在每个位置 $t$ 给出下一个 token 的概率分布 $p(\,\cdot\mid x_0,\dots,x_t)$。训练时，每个位置的目标是真实的下一个 token，损失是目标 token 的负对数概率的平均。

          计算分三段。第一段把 token 编号变成向量，并准备位置编码表和 causal mask。第二段是 {{ num_layers }} 个 decoder 层，每层先用注意力从前面的位置取信息，再用 MLP 对每个位置单独变换，两部分的结果都加回输入。第三段把最后的向量投影成词表上的 logits，算出损失。

          这里的规模是缩小的：隐藏维度 $d_{\mathrm{model}}={{ d_model }}$，词表 {{ V }} 个 token，{{ num_layers }} 层，每层参数各自按 seed 随机初始化。Qwen3-8B 的结构相同，隐藏维度是 4096，有 36 层。
        backward:
          label: 结束
          title: 从损失到每个参数的梯度
          text: |
            反向传播按前向的逆序，对每一步应用链式法则：一个张量的梯度，等于它的每条出边上「下游梯度乘局部导数」之和。每一步只做两件事：乘局部导数，以及在张量被多处使用时把各路梯度相加。

            现在每个参数都有了 $\pfl{\theta}$。参数沿它的反方向微小变化时损失下降最快，所以优化器沿这个方向更新参数，例如 SGD 的 $\theta\leftarrow\theta-\eta\,\pfl{\theta}$。
      - id: input_and_params
        label: 输入和参数
        title: 输入和参数
        show: { inputs: true, parameters: true }
        text: |
          文字先由 tokenizer 切成 token，每个 token 对应词表里的一个编号。输入是前 $T={{ T }}$ 个 token 的编号 $\viz{ids}$，目标 $\viz{y}$ 是同一句话错开一个位置的编号，$y_t=x_{t+1}$：
          $$\viz{ids}=({{ ids | join: ", " }}),\qquad \viz{y}=({{ y | join: ", " }})$$

          HF 的 <code>ForCausalLMLoss</code> 收到的标签和输入相同，在函数里做这次错位；这里直接给出错位后的 $\viz{y}$，结果一样。

          参数决定每一步计算的结果，所以训练通过调整参数来降低损失。
      - id: embed
        label: '$\viz{e}=\viz{embed_tokens.weight}[\viz{ids}]$'
        title: embedding：按编号取行
        brace: { title: embed_tokens, subtitle: nn.Embedding }
        show: [ids, e, embed_tokens.weight]
        text: |
          <code>inputs_embeds = self.embed_tokens(input_ids)</code>。编号本身只是类别，大小没有意义，所以每个编号对应 embedding 表 $\viz{embed_tokens.weight}$ 的一行，取出这一行作为这个位置的向量：
          $${\viz{e}}_t=\viz{embed_tokens.weight}[x_t],\qquad \viz{e}={{ e | matrix:2 }}$$
          取行可以写成矩阵乘法：令 $O_{t,v}=[x_t=v]$ 是 one-hot 矩阵，则 $\viz{e}=O\,\viz{embed_tokens.weight}$。这个写法在反向时用得到。
        backward:
          label: '$\pfl{\viz{embed_tokens.weight}}$'
          text: |
            由 $\viz{e}=O\,\viz{embed_tokens.weight}$ 得 $\pfl{\viz{embed_tokens.weight}}=O^{\top}\pfl{\viz{e}}$。$O^{\top}$ 的第 $v$ 行只在 $x_t=v$ 的位置为 1，所以：
            $$\pfl{\viz{embed_tokens.weight}[v]}=\sum_{t:\,x_t=v}\pfl{{\viz{e}}_t},\qquad \pfl{\viz{embed_tokens.weight}}={{ embed_tokens.weight.grad | matrix:3 }}$$
            也就是说，梯度加回被取到的行（scatter-add），于是没出现的 token 那一行是 0，出现几次就累加几次。实际实现不构造 $O$，直接按编号累加。
      - id: rotary_emb
        title: 位置编码表
        subtitle: Qwen3RotaryEmbedding
        steps:
          cos_sin:
            append: |
              HF 在 <code>Qwen3Model.forward</code> 里调用一次 <code>self.rotary_emb(hidden_states, position_ids)</code>，把同一组 cos、sin 传给所有 {{ num_layers }} 层。

              第 $c$ 列的周期是 $2\pi/\omega_c$ 个位置。Qwen3-8B 的 $d_h$ 是 128，有 64 组频率，$\theta=10^{6}$。这一页 $d_h={{ d_head }}$，只有 {{ d_head // 2 }} 组，如果也用这个 $\theta$，最慢一组的频率是 $\theta^{-(d_h-2)/d_h}={{ 1000000 ** (-(d_head - 2) / d_head) }}$，在 {{ T }} 个位置内几乎不转，表上看不出变化。所以这一页取 $\theta={{ rope_theta }}$。下面把位置延长到 24，阴影是这一页用到的前 {{ T }} 个位置。

              {{ cos(arange(24)[:, None] * rotary_emb.inv_freq) | lines:shade=T }}

              {{ sin(arange(24)[:, None] * rotary_emb.inv_freq) | lines:shade=T }}
      - id: mask
        show: M
        label: '$\viz{M}$'
        title: causal mask
        text: |
          训练时 $T$ 个位置同时预测，位置 $t$ 的目标是 $x_{t+1}$。如果位置 $t$ 的注意力能看到位置 $t+1$，模型可以直接读出答案。这就像把答案印在试卷上，模型只要学会抄就能把损失降到很低，却什么也没学到。所以位置 $t$ 只能看 $s\le t$。

          做法是在 softmax 之前给分数加上 $\viz{M}$，$s>t$ 的格子加一个很大的负数，取 exp 以后是 0：
          $$P_{t,s}=\frac{e^{\bar S_{t,s}}}{\sum_{s'}e^{\bar S_{t,s'}}}=\frac{e^{S_{t,s}}\,[s\le t]}{\sum_{s'\le t}e^{S_{t,s'}}},\qquad \viz{M}={{ M | matrix:2 }}$$
          HF 在 <code>Qwen3Model.forward</code> 里用 <code>create_causal_mask</code> 生成一次，传给每一层。填的是 dtype 能表示的最小值 <code>torch.finfo(dtype).min</code>。causal mask 下每一行至少能看到自己，但和 padding mask 合并后，padding 位置的一整行可能全部被 mask。考虑到这种情况，填 $-\infty$ 时 softmax 减去行最大值会算出 $-\infty-(-\infty)$，这一行变成 NaN，所以用有限值来避免这种情况。mask 是常量，没有梯度。
      - id: layers
        loop: layer = layers[i]

        defaults:
          show: layer
          title: Qwen3DecoderLayer
          subtitle: 第 {{ i }} 层（layers[{{ i }}]）

        rules:
          - at: 0
            subtitle: 第 0 层，输入是 embedding
          - at: -1
            subtitle: 最后一层，输出交给 model.norm
      - id: norm
        title: model.norm
        subtitle: Qwen3RMSNorm
        text: |-
          <code>hidden_states = self.norm(hidden_states)</code>，在全部 decoder 层之后、lm_head 之前。Pre-Norm 结构里残差路径从不归一化，$\viz{h_last}$ 是 embedding 加上 {{ num_layers }} 层全部增量的和，尺度没有约束，所以要再做一次 RMSNorm，归一化后才交给 lm_head。
        fold:
          backward:
            text: |
              $$\pfl{\viz{h_last}}={{ h_last.grad | matrix:3 }}$$
      - id: logits
        label: '$\viz{z}$'
        title: lm_head
        show: lm_head
        text: |
          <code>logits = self.lm_head(hidden_states)</code>。$\viz{lm_head.weight}$ 的每一行对应词表里的一个 token，$z_{t,v}=\mathbf{h}_t\cdot W_v$ 是位置 $t$ 的向量与 token $v$ 的那一行的点积，下一步经过 softmax 成为概率。
          $$\viz{z}=\viz{h_norm}{\viz{lm_head.weight}}^{\top}={{ z | matrix:2 }}$$
          这一页词表只有 {{ V }} 个 token；Qwen3-8B 的词表是 151936，lm_head 有 $151936\times4096$ 个参数，logits 是 $T\times151936$。
        backward:
          label: '$\pfl{\viz{lm_head.weight}},\ \pfl{\viz{h_norm}}$'
          text: |
            $$\pf{\ell}{{\viz{lm_head.weight}}^{\top}}={\viz{h_norm}}^{\top}\pfl{\viz{z}},\qquad \pfl{\viz{h_norm}}=\pfl{\viz{z}}\viz{lm_head.weight}={{ h_norm.grad | matrix:3 }}$$
            代入后面算出的 $\pfl{z_{t,v}}=(p_{t,v}-[v=y_t])/T$，第 $v$ 行的梯度是 $\frac1T\sum_t(p_{t,v}-[v=y_t])\,\mathbf{h}_t$。按梯度下降更新时，目标 token 那一行沿 $\mathbf{h}_t$ 方向增加，其他行沿 $\mathbf{h}_t$ 方向按概率 $p_{t,v}$ 减少。
      - id: float
        show: zf
        segment: lm_head
        label: '$\viz{zf}$'
        title: 转成 float32
        text: |
          HF 的 <code>ForCausalLMLoss</code> 第一行是 <code>logits = logits.float()</code>，然后调用 <code>F.cross_entropy</code>。cross_entropy 就是 log_softmax 接 nll_loss。转成 float32 是因为 log_softmax 要对整行求 exp 之和，词表很大时低精度的累加误差明显。{{ dtype }} 的每个值都能在 float32 里精确表示，所以这一步不改变数值。
        backward:
          label: '$\pfl{\viz{z}}$'
          title: '$\pfl{\viz{z}}$'
          text: |
            局部导数是 1。梯度从 float32 转回 {{ dtype }}，这一步会舍入。
            $$\pfl{\viz{z}}={{ z.grad | matrix:3 }}$$
      - id: log_softmax
        subtitle: F.cross_entropy 的第一部分：log_softmax
        fold:
          backward:
            append: |
              这里 $g$ 只在标签那一格为 $-1/T$，代入得 $\pfl{z_{t,v}}=\big(p_{t,v}-[v=y_t]\big)/T$：预测概率减去 one-hot 目标，再除以位置数。
      - id: nll_loss
        subtitle: "F.cross_entropy 的第二部分：F.nll_loss(logp, labels)"
        steps:
          pick:
            append: |
              这里 $N=T={{ T }}$，目标序列是 <code>{{ tokens[1:] | join: " " }}</code>。HF 在 <code>ForCausalLMLoss</code> 里给标签末尾补一个 <code>-100</code> 再错位，所以最后一个位置没有目标、不计入平均；这一页直接给出错位后的 $T$ 个目标，没有需要忽略的位置。

panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
  - cost
  - sequence: true
    tokens: tokens
    input: ids
    label: y
    title: Sequence
    sgd: { params: all, lr: 0.5, label: Update }
    random: true
    reset: true
  - title: 对应的 PyTorch 计算
    code: |-
      e = embed_tokens(ids)
      h_last = e
      for layer in layers:
          h_last = layer(h_last)
      h_norm = norm(h_last)
      z = lm_head(h_norm)
      zf = z.float()
      logp = F.log_softmax(zf, dim=-1)
      lt = F.nll_loss(logp, y, reduction='none')
      loss = lt.mean()
    note: |
      这里的 ids 和 y 已经按相邻位置对齐，形状都是 (T,)，没有额外的 batch 维。layers 中的各层依次执行，使用各自的参数。
      示例使用 {{ num_layers }} 层，隐藏维度 {{ d_model }}，query head 数 {{ num_heads }}，kv head 数 {{ num_kv_heads }}，每个 head 的维度 {{ d_head }}，MLP 中间维度 {{ d_ff }}，词表大小 {{ V }}，输入长度 {{ T }}。

sections:
  - title: RoPE：用旋转来编码位置
    src: ./rope.md
    rope:
      q: layers[0].self_attn.qn
      k: layers[0].self_attn.kn
      rows: [-1, 0]
      head: 0
      theta: rope_theta
      d_head: d_head
      positions: 24
