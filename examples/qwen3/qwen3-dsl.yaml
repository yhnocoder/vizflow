title: Qwen3 Basic
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  LogSoftmax: vizflow/nn/log-softmax
  NLLLoss: vizflow/nn/nll-loss
  RMSNorm: vizflow/nn/rmsnorm
  GLU: vizflow/nn/glu
  RotaryEmbedding: vizflow/nn/rotary-embedding
  Qwen3DecoderLayer: ./decoder.yaml

preamble: ../preamble.sty

model: Qwen3ForCausalLM

config:
  V: 5
  d_model: 4
  d_head: 4
  d_ff: 6
  num_heads: 2
  num_kv_heads: 1
  num_layers: 2
  rope_theta: 10
  dtype: bf16
  seed: 20261010
  tokenizer:
    vocab: [on, mat, the, sat, cat]
  real:
    qwen3-8b: { name: Qwen3-8B, T: 8192, V: 151936, d_model: 4096, d_head: 128, d_ff: 12288, num_heads: 32, num_kv_heads: 8, num_layers: 36, rope_theta: 1000000 }

data:
  tokens: [the, cat, sat, on]
  ids: { expr: 'tokens_to_ids(tokens[:-1])' }
  y: { expr: 'tokens_to_ids(tokens[1:])' }

modules:
  Qwen3ForCausalLM:
    args:
      V: dim
      d_model: dim
      d_head: dim
      d_ff: dim
      num_heads: dim
      num_kv_heads: dim
      num_layers: int
      rope_theta: float
      dtype: dtype
    inputs:
      tokens: { type: list, dtype: str }
      ids: { type: tensor, shape: [T], dtype: int64 }
      y: { type: tensor, shape: [T], dtype: int64 }
    outputs:
      z: { type: tensor, shape: [T, V], dtype: dtype }
      loss: { type: tensor, shape: [], dtype: fp32 }

    init:
      embed_tokens:
        use: Embedding
        args: { num_embeddings: V, embedding_dim: d_model }
      layers:
        use: list[Qwen3DecoderLayer]
        count: num_layers
        args: [d_model, d_head, d_ff, num_heads, num_kv_heads]
      rotary_emb:
        use: RotaryEmbedding
        args: [d_head, rope_theta]
      norm:
        use: RMSNorm
        args: { hidden_size: d_model }
      lm_head:
        use: Linear
        args: { in_features: d_model, out_features: V, bias: false }
      log_softmax: LogSoftmax
      nll_loss: NLLLoss

    forward:
      - e: embed_tokens(ids)
      - position_ids: arange(T)
      - position_embeddings: rotary_emb(e, position_ids)
      - cos: position_embeddings.cos
      - sin: position_embeddings.sin
      - M: causal_mask(T)
      - h_last: layers(e, mask=M, cos=cos, sin=sin)
      - h_norm: norm(h_last)
      - z: lm_head(h_norm)
      - zf: z.float()
      - logp: log_softmax(zf)
      - result: nll_loss(logp=logp, y=y)
      - loss: result.loss
      - lt: result.lt

    tex:
      ids: 'x'
      e: '\mathbf{e}'
      h_last: '\mathbf{h}_{\mathrm{last}}'
      h_norm: '\mathbf{h}_{\mathrm{norm}}'
      z: '\mathbf{z}'
      zf: '\mathbf{z}_{\mathrm{fp32}}'
      loss: '\ell'
      lt: '\ell_t'
      position_ids: 't'
      cos: '\cos'
      sin: '\sin'
      M: 'M'
      embed_tokens.weight: 'E'
      lm_head.weight: 'W'

    steps:
      - id: overview
        label: 总览
        title: 模型如何预测下一个词
        show: { all: true }
        text: |
          当输入是 <code>{{ tokens[:-1] | join: " " }}</code> 时，模型如何预测接下来出现的词？训练时，它又如何根据预测的误差调整参数？

          接下来，我们会从输入开始，逐步看文字如何变成向量，注意力如何利用前文，以及模型如何给出预测。随后再看反向传播，了解预测的误差如何影响各处的参数。

          这里用一个缩小的 Qwen3 示例，展开其中一层，让每一步计算都能看清。点击下一步，从输入和参数开始。
        backward:
          label: 结束
          title: 从预测到参数更新
          text: |
            到这里，我们已经看过这个示例的前向计算和反向传播：模型根据输入给出预测，损失衡量预测与目标的差距，反向传播算出损失对各个参数的梯度。

            梯度描述参数的微小变化会怎样影响损失。算出梯度后，还需要更新参数，模型的预测才会改变。
      - id: input_and_params
        label: 输入和参数
        title: 输入和参数
        show: { inputs: true, parameters: true }
        text: |
          模型接收的文字会先被切分成 token，每个 token 都有一个编号。这个示例已经准备好了这些编号，接下来的计算就从它们开始。训练时，我们还会给出每个位置实际的下一个 token，作为预测的目标。
          $$\viz{ids}=({{ ids | join: ", " }}),\qquad \viz{y}=({{ y | join: ", " }})$$

          图中也展示了计算要用到的参数。它们决定模型如何处理输入，训练会根据梯度调整这些参数。这里使用小尺寸的示例参数，方便观察每个数值。

          下一步，我们先看 embedding 如何把 token 编号转换成向量。
      - id: embed
        label: '$\viz{e}=\viz{embed_tokens.weight}[\viz{ids}]$'
        title: embedding：按编号取行
        brace: { title: embed_tokens, subtitle: nn.Embedding }
        show: [ids, e, embed_tokens.weight]
        text: |
          embedding 表 $E$ 的每一行是一个 token 的向量。用输入编号 $x_t$ 取出对应的行，就得到这个位置的向量 $\mathbf{e}_t$。
          $$\viz{e}_t=\viz{embed_tokens.weight}[x_t],\qquad \viz{e}={{ e | matrix:2 }}$$
        backward:
          label: '$\pfl{\viz{embed_tokens.weight}}$'
          text: |
            取行的反向是把梯度加回被取到的那一行（scatter-add）。没有出现在输入里的 token，那一行的梯度是 0；同一个 token 出现几次，它那一行就累加几次。
            $$\pfl{\viz{embed_tokens.weight}[v]}=\sum_{t:\,x_t=v}\pfl{\viz{e}_t},\qquad \pfl{\viz{embed_tokens.weight}}={{ embed_tokens.weight.grad | matrix:3 }}$$
      - id: rotary_emb
        title: 位置编码表
        subtitle: Qwen3RotaryEmbedding
        steps:
          cos_sin:
            text: |
              RoPE 用的 cos、sin 表在进入 decoder 层之前只算一次，之后传给每一层。表的第 $t$ 行对应位置 $t$（position_id，行和列都从 0 数），第 $i$ 列和第 $i+d_h/2$ 列的角度都是 $t\,\omega_i$，$\omega_i=\theta^{-2i/d_h}$。Qwen3 的 rope_theta 是 $\theta=10^6$；这里只有 $d_h={{ d_head }}$ 和 {{ T }} 个位置，用 $10^6$ 的话 $\omega_1$ 太小，看不出循环，所以改用 $\theta={{ rope_theta }}$，频率是 $\omega_0=1$、$\omega_1=0.316$。第 0 行 $t=0$，角度为 0，cos 全是 1；第 1 行 $t=1$：$\cos 1=0.540$、$\cos 0.316=0.950$；第 2 行 $t=2$：$\cos 2=-0.416$、$\cos 0.632=0.807$。HF 用 <code>torch.cat((freqs, freqs), dim=-1)</code> 生成这张表，所以第 $c$ 列和第 $c+d_h/2$ 列频率相同、数值也相同，它们是 rotate_half 配成的一对。

              下面两张图把位置延长到 24 个，横轴是位置 $t$。每条曲线是一个频率的 $\cos t\,\omega_i$（第二张图是 $\sin t\,\omega_i$），图例里的列 $i$ 对应表里的第 $i$ 列和第 $i+d_h/2$ 列，所以每条曲线代表两列。阴影是这里用到的前 {{ T }} 个位置。$\omega_0$ 的周期约 6.3 个位置，$\omega_1$ 约 20 个位置。

              {{ cos(arange(24)[:, None] * rotary_emb.inv_freq) | lines:shade=T }}

              {{ sin(arange(24)[:, None] * rotary_emb.inv_freq) | lines:shade=T }}

              $$\cos={{ cos | matrix:3 }},\qquad \sin={{ sin | matrix:3 }}$$
      - id: mask
        show: M
        label: '$\viz{M}$'
        title: causal mask
        text: |
          HF 在 <code>Qwen3Model.forward</code> 里用 <code>create_causal_mask</code> 生成一次 mask，传给每一层。$s>t$ 的格子是这个 dtype 能表示的最小值，这里画成 $-\infty$；其余是 0。mask 是常量，不需要梯度。
          $$\viz{M}={{ M | matrix:2 }}$$
      - id: layers
        loop: layer = layers[i]

        defaults:
          show: layer
          title: Qwen3DecoderLayer
          subtitle: 第 {{i + 1}} 层

        rules:
          - at: -1
            subtitle: 最后一层
      - id: norm
        title: model.norm
        subtitle: Qwen3RMSNorm
        text: |-
          从这里开始是 final norm（<code>model.norm</code>），在所有 decoder 层之后、lm_head 之前。

          $\viz{h_norm}$ 是 lm_head 的输入。
        fold:
          backward:
            text: |
              $$\pfl{\viz{h_last}}={{ h_last.grad | matrix:3 }}$$
      - id: logits
        label: '$\viz{z}$'
        title: lm_head
        show: lm_head
        text: |
          每个位置的 ${\viz{h_norm}}_t$ 都乘同一块 ${\viz{lm_head.weight}}^{\top}$，得到这个位置对下一个 token 的 logits。${\viz{h_norm}}_{t,k}$ 沿第 $k$ 行经过每个方块，每一列累加后落到 $z_{t,i}$。
          $$\viz{z}=\viz{h_norm}{\viz{lm_head.weight}}^{\top}={{ z | matrix:2 }}$$
        backward:
          label: '$\pfl{\viz{lm_head.weight}},\ \pfl{\viz{h_norm}}$'
          text: |
            $\pf{\ell}{{\viz{lm_head.weight}}^{\top}}={\viz{h_norm}}^{\top}\pfl{\viz{z}}$，各个位置的外积加在一起。
            $$\pfl{\viz{h_norm}}=\pfl{\viz{z}}\viz{lm_head.weight}={{ h_norm.grad | matrix:3 }}$$
      - id: float
        show: zf
        segment: lm_head
        label: '$\viz{zf}$'
        title: 转成 float32
        text: |
          HF 计算损失前先做 <code>logits.float()</code>，后面的 log_softmax 和 nll_loss 都在 float32 里算。类型转换不改变这一页的数值，局部导数是 1。
        backward:
          label: '$\pfl{\viz{z}}$'
          title: 穿过类型转换
      - id: log_softmax
        subtitle: F.log_softmax(z.float(), -1)
      - id: nll_loss
        subtitle: "F.nll_loss(logp, labels)，reduction='mean'"
        steps:
          pick:
            append: |
              这里直接提供与输入错开一个位置的目标 token，不包含需要忽略的位置。目标序列是 <code>{{ tokens[1:] | join: " " }}</code>。

panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
  - cost
  - sequence: true
    tokens: tokens
    input: ids
    label: y
    title: Sequence
    sgd: { params: all, lr: 0.5, label: Update }
    random: true
    reset: true
  - title: 对应的 PyTorch 计算
    code: |-
      e = embed_tokens(ids)
      h_last = e
      for layer in layers:
          h_last = layer(h_last)
      h_norm = norm(h_last)
      z = lm_head(h_norm)
      zf = z.float()
      logp = F.log_softmax(zf, dim=-1)
      lt = F.nll_loss(logp, y, reduction='none')
      loss = lt.mean()
    note: |
      这里的 ids 和 y 已经按相邻位置对齐，形状都是 (T,)，没有额外的 batch 维。layers 中的各层依次执行，使用各自的参数。
      示例使用 {{ num_layers }} 层，隐藏维度 {{ d_model }}，query head 数 {{ num_heads }}，kv head 数 {{ num_kv_heads }}，每个 head 的维度 {{ d_head }}，MLP 中间维度 {{ d_ff }}，词表大小 {{ V }}，输入长度 {{ T }}。

sections:
  - title: RoPE：用旋转来编码位置
    src: ./rope.md
    rope:
      q: layers[0].self_attn.qn
      k: layers[0].self_attn.kn
      rows: [-1, 0]
      head: 0
      theta: rope_theta
      d_head: d_head
      positions: 24
