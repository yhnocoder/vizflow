title: Qwen3 训练与推理
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  Qwen3ForCausalLM: vizflow/models/qwen3/for-causal-lm

model: Qwen3ForCausalLM

generate: { steps: 3, temperature: 0.6, top_k: 20, top_p: 0.95, seed: 4, note: "τ、k、p 取 Qwen3-8B 的 generation_config.json 里的默认值。" }
optimizer: { type: adamw, lr: 0.02 }

config:
  V: 5
  d_model: 4
  d_head: 4
  d_ff: 6
  num_heads: 2
  num_kv_heads: 1
  num_layers: 2
  rope_theta: 10
  dtype: bf16
  seed: 20261010
  tokenizer:
    vocab: [on, mat, the, sat, cat]
  real:
    qwen3-8b: { name: Qwen3-8B, T: 8192, V: 151936, d_model: 4096, d_head: 128, d_ff: 12288, num_heads: 32, num_kv_heads: 8, num_layers: 36, rope_theta: 1000000 }

data:
  tokens: [the, cat]
  ids: { expr: 'tokens_to_ids(tokens[:-1])' }
  y: { expr: 'tokens_to_ids(tokens[1:])' }

panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
    mode: train
  - { cost: true, mode: train }
  - generation: true
    mode: infer
    title: 生成过程
  - sequence: true
    mode: train
    tokens: tokens
    input: ids
    label: y
    title: Sequence
    sgd: { params: all, lr: 0.5, label: Update }
    random: true
    reset: true
  - title: 对应的 PyTorch 计算
    mode: train
    code: |-
      e = embed_tokens(ids)
      h_last = e
      for layer in layers:
          h_last = layer(h_last)
      h_norm = norm(h_last)
      hidden_states = h_norm
      z = lm_head(hidden_states)
      zf = z.float()
      logp = F.log_softmax(zf, dim=-1)
      lt = F.nll_loss(logp, y, reduction='none')
      loss = lt.mean()
    note: |
      这里的 ids 和 y 已经按相邻位置对齐，形状都是 (T,)，没有额外的 batch 维。layers 中的各层依次执行，使用各自的参数。
      示例使用 {{ num_layers }} 层，隐藏维度 {{ d_model }}，query head 数 {{ num_heads }}，kv head 数 {{ num_kv_heads }}，每个 head 的维度 {{ d_head }}，MLP 中间维度 {{ d_ff }}，词表大小 {{ V }}，输入长度 {{ T }}。

  - title: 对应的 PyTorch 计算
    mode: infer
    code: |-
      ids = tok("the cat", return_tensors="pt").input_ids
      out = model.generate(ids, max_new_tokens=3, do_sample=True, temperature=0.6, top_k=20, top_p=0.95)
      # generate 内部：
      # prefill：一次前向算 prompt 的全部位置，写满 past_key_values，
      #          lm_head 只算最后一个位置（logits_to_keep=1）
      # decode：每步只送上一步采样的 1 个 token，
      #          读缓存、只算这一个位置、更新缓存
