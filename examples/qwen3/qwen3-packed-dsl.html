<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3 两条序列打包训练</title>
<link rel="icon" href="data:,">
<style>
main { --vf-stage-height: clamp(480px, calc((100vh - 100px) * 0.85), 1190px); }
@media (max-width: 980px) { main { --vf-stage-height: clamp(400px, 66vh, 940px); } }
</style>
</head>
<body>
<a class="vf-settings-link" href="../settings.html">设置</a>
<main class="vf-page">
  <vizflow-page src="qwen3-packed-dsl.yaml"></vizflow-page>
</main>
<script type="module">
import '@yhnocoder/vizflow/element';

const page = document.querySelector('vizflow-page');
page.addEventListener('load', () => {
  window.vizflow = { page, g: page.compiled.graph, nodes: page.compiled.nodes, steps: page.createdSteps };
  document.body.dataset.ready = 'true';
});
</script>
</body>
</html>
