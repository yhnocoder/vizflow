module: Qwen3_5GatedDeltaNet
subtitle: Qwen3_5GatedDeltaNet
import:
  GatedDeltaRuleChunk: vizflow/nn/gated-delta-rule-chunk
  GatedRMSNorm:        vizflow/nn/rmsnorm-gated
  Sigmoid:             vizflow/nn/sigmoid
  SiLU:                vizflow/nn/silu
  Softplus:            vizflow/nn/softplus
params:
  Hk: { type: dim }
  Hv: { type: dim }
  dk: { type: dim }
  dv: { type: dim }
  K:  { type: dim }
  chunk: { type: dim, default: 64 }
  norm_act: { type: module, values: [SiLU, Sigmoid], default: SiLU }
inputs:
  x: { shape: [T, d] }
outputs: [out]
weights:
  Wqkv:    { shape: [2*Hk*dk + Hv*dv, d] }
  Wz:      { shape: [Hv*dv, d] }
  Wb:      { shape: [Hv, d] }
  Wa:      { shape: [Hv, d] }
  Wconv:   { shape: [2*Hk*dk + Hv*dv, K], tex: 'W_{\mathrm{conv}}' }
  dt_bias: { shape: [Hv], init: ones, tex: '\mathbf{b}_{\Delta}' }
  A_log:   { shape: [Hv], tex: '\mathbf{a}_{\log}' }
  Wout:    { shape: [d, Hv*dv], tex: 'W_{\mathrm{out}}' }
fold:
  label: '$\of{out}=\mathrm{linear\_attn}(\of{x})$'
  title: linear_attn（已折叠）
  text: |
    投影、短卷积、gated delta rule、门控 RMSNorm 和 out_proj 都收进了盒子，对应 HF 里 <code>self.linear_attn(hidden_states)</code> 这一次调用。位置 $t$ 的输出只依赖 $s\le t$ 的输入，和 softmax 注意力一样是块下三角，但每一步只需要一个固定大小的状态。
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 linear_attn（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - mixed_qkv: { op: x @ Wqkv.T, tex: '\mathbf{u}' }
  - z: { op: 'view(x @ Wz.T, T, Hv, dv)', tex: '\mathbf{z}_{o}' }
  - b: x @ Wb.T
  - a: { op: x @ Wa.T, tex: '\mathbf{a}_{\Delta}' }
  - conv: { op: 'causal_conv1d(mixed_qkv, Wconv)', tex: '\mathbf{c}' }
  - act:
      use: SiLU
      inputs: { x: conv }
      outputs: { out: cs }
      tex: { out: '\mathrm{SiLU}(\mathbf{c})' }
      steps:
        sigmoid.neg:
          append: 卷积的输出逐元素经过 SiLU，HF 把它作为卷积的 activation 参数传进去（<code>self.act</code>，<code>config.hidden_act</code> 是 <code>"silu"</code>）。
  - q: 'view(narrow(cs, -1, 0, Hk*dk), T, Hk, dk)'
  - k: 'view(narrow(cs, -1, Hk*dk, Hk*dk), T, Hk, dk)'
  - v: 'view(narrow(cs, -1, 2*Hk*dk, Hv*dv), T, Hv, dv)'
  - beta_sigmoid:
      use: Sigmoid
      inputs: { x: b }
      outputs: { out: beta }
      tex: { out: '\boldsymbol{\beta}' }
      steps:
        neg:
          append: 这里算的是 <code>beta = b.sigmoid()</code>：$\beta=\sigma(\mathbf{b})$ 在 0 和 1 之间，是每个位置、每个 value head 写入状态的强度。
  - ab: { op: a + dt_bias, tex: '\mathbf{a}_{\Delta}+\mathbf{b}_{\Delta}', dtype: fp32 }
  - dt_softplus:
      use: Softplus
      inputs: { x: ab }
      outputs: { out: dt }
      tex: { out: '\Delta' }
  - eA: { op: exp(A_log), tex: 'e^{\mathbf{a}_{\log}}', dtype: fp32 }
  - nA: { op: -eA, tex: '-e^{\mathbf{a}_{\log}}' }
  - g: { op: nA * dt, tex: '\mathbf{g}' }
  - qr: { op: 'repeat_interleave(q, Hv // Hk, 1)', tex: '\mathrm{rep}(\mathbf{q})' }
  - kr: { op: 'repeat_interleave(k, Hv // Hk, 1)', tex: '\mathrm{rep}(\mathbf{k})' }
  - chunk_gated_delta_rule:
      use: GatedDeltaRuleChunk
      inline: true
      params: { chunk: chunk }
      inputs: { q: qr, k: kr, v: v, g: g, beta: beta }
      outputs: { o: core }
      tex: { o: '\mathbf{o}' }
  - norm:
      use: GatedRMSNorm
      subtitle: Qwen3_5RMSNormGated
      suffix: o
      params: { act: norm_act }
      inputs: { x: core, gate: z }
      outputs: { out: cn }
      tex: { out: '\bar{\mathbf{o}}' }
  - out: { op: 'view(cn, T, Hv*dv) @ Wout.T', tex: '\mathbf{att}' }
steps:
  - id: proj_qkv
    brace: { title: in_proj_qkv, subtitle: nn.Linear }
    show: [Wqkv.T, mixed_qkv]
    label: '$\of{mixed_qkv}$'
    title: in_proj_qkv
    text: |
      forward 的第一行是 <code>apply_mask_to_padding_states(hidden_states, attention_mask)</code>，它把 padding 位置的输入乘 0；这一页没有 padding，attention_mask 是 None，这一行不改变输入。in_proj_qkv 一次算出 q、k、v 三段，宽 $2H_k d_k+H_v d_v=\of{2*Hk*dk+Hv*dv}$，没有 bias。
      $$\mathbf{u}=\of{x}W_{qkv}^{\top}={{ mixed_qkv | matrix:2 }}$$
    backward:
      label: '$\partial W_{qkv},\ \partial\of{x}$'
      title: 传到 in_proj_qkv 的权重和 $\of{x}$
      text: |
        权重的梯度是「输入的转置乘输出的梯度」。$\of{x}$ 还从 in_proj_z、in_proj_b、in_proj_a 收到梯度，四路相加。
        $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
  - id: proj_z
    brace: { title: in_proj_z, subtitle: nn.Linear }
    show: [Wz.T, z]
    label: '$\of{z}$'
    title: in_proj_z，按 value head 分组
    text: |
      <code>z = self.in_proj_z(hidden_states)</code>，再 <code>z.reshape(batch_size, seq_len, -1, self.head_v_dim)</code> 分成 $H_v=\of{Hv}$ 个 value head，每个宽 $d_v=\of{dv}$。$\mathbf{z}_{o}$ 是最后门控 RMSNorm 用的输出门。
      $$\mathbf{z}_{o}={{ z | matrix:2 }}$$
    backward:
      label: '$\partial W_{z}$'
      title: 传到 in_proj_z 的权重
  - id: proj_b
    brace: { title: in_proj_b, subtitle: nn.Linear }
    show: [Wb.T, b]
    label: '$\of{b}$'
    title: in_proj_b
    text: |
      <code>b = self.in_proj_b(hidden_states)</code>：每个位置、每个 value head 出一个数，$\mathbf{b}$ 决定写入强度。没有 bias。
      $$\mathbf{b}={{ b | matrix:3 }}$$
    backward:
      label: '$\partial W_{b}$'
      title: 传到 in_proj_b 的权重
  - id: proj_a
    brace: { title: in_proj_a, subtitle: nn.Linear }
    show: [Wa.T, a]
    label: '$\of{a}$'
    title: in_proj_a
    text: |
      <code>a = self.in_proj_a(hidden_states)</code>：每个位置、每个 value head 出一个数，$\mathbf{a}_{\Delta}$ 决定衰减。没有 bias。
      $$\mathbf{a}_{\Delta}={{ a | matrix:3 }}$$
    backward:
      label: '$\partial W_{a}$'
      title: 传到 in_proj_a 的权重
  - id: conv
    brace: { title: conv1d, subtitle: '因果深度卷积，核长 $\of{K}$' }
    show: [Wconv, conv]
    label: '$\of{conv}$'
    title: 因果短卷积
    text: |
      q、k、v 三段在进入 gated delta rule 之前先过一个深度卷积：每个通道 $c$ 有自己的 $\of{K}$ 个系数，输出 $c_{t,c}=\sum_{j}W_{c,j}\,u_{t-\of{K}+1+j,\,c}$，只看当前和之前的 $\of{K}-1$ 个位置。HF 的 <code>causal_conv1d_fn</code> 先把 $\mathbf{u}$ 转成 $(B, C, T)$，用 <code>F.conv1d(..., padding=K-1, groups=C)</code> 在两端各补 $\of{K}-1$ 个 0，再用 <code>[..., :seq_len]</code> 只留前 $T$ 个输出，结果是只在左边补了 $\of{K}-1$ 个 0，最后转回 $(B, T, C)$。图里的 <code>causal_conv1d</code> 直接按 $(T, C)$ 算，数值相同。连线只在同一列之内。
      $$\mathbf{c}={{ conv | matrix:2 }}$$
    backward:
      label: '$\partial W_{\mathrm{conv}},\ \partial\mathbf{u}$'
      title: 穿过短卷积
      text: |
        $u_{s,c}$ 的梯度来自它之后 $\of{K}$ 个位置的输出，各乘对应的系数；$W_{c,j}$ 的梯度是这一列所有位置的贡献之和。$T=\of{T}$、$K=\of{K}$ 时，每个通道的第 1 个系数 $W_{c,1}$ 只会乘到左边补的 0，从来碰不到真实输入，它的梯度是 0。
        $$\frac{\partial\ell}{\partial\mathbf{u}}={{ mixed_qkv.grad | matrix:3 }},\qquad \frac{\partial\ell}{\partial W_{\mathrm{conv}}}={{ Wconv.grad | matrix:3 }}$$
  - id: split
    show: [q, k, v]
    label: '$\of{q},\ \of{k},\ \of{v}$'
    title: 切成 q、k、v，按 head 分组
    text: |
      <code>torch.split</code> 按列切成三段，再 reshape 成 head：q 和 k 各有 $H_k=\of{Hk}$ 个 key head，每个宽 $d_k=\of{dk}$；v 有 $H_v=\of{Hv}$ 个 value head，每个宽 $d_v=\of{dv}$。
      $$\mathbf{v}={{ v | matrix:2 }}$$
    backward:
      label: '$\partial\,\mathrm{SiLU}(\mathbf{c})$'
      title: 拼回卷积的输出
  - id: dtin
    show: [dt_bias, ab]
    label: '$\of{ab}$'
    title: 衰减：加上 $\mathbf{b}_{\Delta}$
    text: |
      衰减的对数是 $g=-e^{\mathbf{a}_{\log}}\cdot\mathrm{softplus}(\mathbf{a}_{\Delta}+\mathbf{b}_{\Delta})$，对应 <code>g = -self.A_log.float().exp() * F.softplus(a.float() + self.dt_bias)</code>，在 float32 里计算。这和 Mamba2 的离散化相同：$\mathbf{b}_{\Delta}$ 和 $\mathbf{a}_{\log}$ 是每个 value head 一个的参数，$\mathbf{a}_{\Delta}$ 由输入决定，所以忘多少因位置而异。第一步给 $\mathbf{a}_{\Delta}$ 加上偏置 $\mathbf{b}_{\Delta}$。
      $$\of{ab}={{ ab | matrix:3 }}$$
    backward:
      label: '$\partial\mathbf{a}_{\Delta},\ \partial\mathbf{b}_{\Delta}$'
      title: 传到 $\mathbf{a}_{\Delta}$ 和 $\mathbf{b}_{\Delta}$
      text: |
        相加的局部导数是 1。$\mathbf{b}_{\Delta}$ 被所有位置共用，梯度把各位置加起来。
        $$\frac{\partial\ell}{\partial\mathbf{b}_{\Delta}}={{ dt_bias.grad | matrix:3 }}$$
  - id: expA
    show: [A_log, eA]
    label: '$\of{eA}$'
    title: 衰减：$e^{\mathbf{a}_{\log}}$
    text: |
      参数存的是 $\mathbf{a}_{\log}$，取 exp 以后一定是正数。
      $$\of{eA}={{ eA | matrix:3 }}$$
    backward:
      label: '$\partial\mathbf{a}_{\log}$'
      title: 传到 $\mathbf{a}_{\log}$
      text: |
        exp 的导数是它自己。$\mathbf{a}_{\log}$ 被所有位置共用，梯度把各位置加起来。
        $$\frac{\partial\ell}{\partial\mathbf{a}_{\log}}={{ A_log.grad | matrix:3 }}$$
  - id: negA
    show: nA
    label: '$\of{nA}$'
    title: 衰减：取负
    text: |
      $$\of{nA}={{ nA | matrix:3 }}$$
    backward:
      label: '$\partial e^{\mathbf{a}_{\log}}$'
      title: 穿过取负
      text: 局部导数是 $-1$。
  - id: gate
    show: g
    label: '$\of{g}$'
    title: 衰减 $g$
    text: |
      $-e^{\mathbf{a}_{\log}}$ 乘上 $\Delta$。$e^{\mathbf{a}_{\log}}$ 和 softplus 都是正数，所以 $g<0$，$e^{g}$ 在 0 和 1 之间。$-e^{\mathbf{a}_{\log}}$ 每个 value head 一个，广播到每个位置。
      $$\mathbf{g}={{ g | matrix:3 }}$$
    backward:
      label: '$\partial\Delta,\ \partial(-e^{\mathbf{a}_{\log}})$'
      title: 穿过相乘
      text: |
        逐元素乘的两个输入互为对方的局部导数。$-e^{\mathbf{a}_{\log}}$ 广播到了每个位置，梯度把各位置加起来。
        $$\frac{\partial\ell}{\partial\Delta}={{ dt.grad | matrix:3 }}$$
  - id: repeat
    show: [qr, kr]
    label: '$\mathrm{repeat\_interleave}$'
    title: 把 key head 复制给 value head
    text: |
      value head 比 key head 多：$H_v/H_k=\of{Hv//Hk}$。<code>repeat_interleave</code> 把每个 key head 的 q 和 k 连续复制 $\of{Hv//Hk}$ 份，第 $j$ 个 value head 用第 $\lfloor j/\of{Hv//Hk}\rfloor$ 个 key head。这和 GQA 里 kv head 少于 query head 的做法方向相反：这里是 value 多、key 少。之后调用 <code>torch_chunk_gated_delta_rule(query, key, value, g=g, beta=beta, initial_state=None, output_final_state=False, use_qk_l2norm_in_kernel=True)</code>；只有带缓存、一次一个 token 的 decode 才调用逐个位置递推的 <code>torch_recurrent_gated_delta_rule</code>。
      $$\mathrm{rep}(\mathbf{k})={{ kr | matrix:2 }}$$
    backward:
      label: '$\partial\of{q},\ \partial\of{k}$'
      title: 几份梯度加回一份
  - id: out_proj
    brace: { title: out_proj, subtitle: nn.Linear }
    show: [Wout.T, out]
    label: out_proj
    title: out_proj
    text: |
      HF 在门控 RMSNorm 之前把 <code>core_attn_out</code> 和 <code>z</code> 都 reshape 成 $(T H_v, d_v)$，之后再 <code>reshape(batch_size, seq_len, -1)</code> 拼回 $T\times H_v d_v$。RMSNorm 只在最后一维上算，图里直接在 $(T, H_v, d_v)$ 上算，数值相同；这里的 view 就是拼回的那一次 reshape，然后投影回 $d$ 维。
      $$\mathbf{att}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial W_{\mathrm{out}},\ \partial\bar{\mathbf{o}}$'
      title: 传到 out_proj 权重和门控 RMSNorm 的输出
