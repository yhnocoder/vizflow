title: Qwen3.5 Basic
layout: { levels: nested, iterations: overlap }
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  Qwen3_5ForCausalLM: vizflow/models/qwen3_5/for-causal-lm

model: Qwen3_5ForCausalLM

config:
  V: 5
  d_model: 4
  d_head: 8
  d_ff: 6
  num_heads: 2
  num_kv_heads: 1
  num_layers: 2
  layer_types: [linear_attention, full_attention]
  linear_num_key_heads: 1
  linear_num_value_heads: 2
  linear_key_head_dim: 2
  linear_value_head_dim: 2
  linear_conv_kernel_dim: 4
  chunk_size: 2
  partial_rotary_factor: 0.25
  rope_theta: 10000000
  dtype: bf16
  seed: 20261011
  tokenizer:
    vocab: [on, mat, the, sat, cat]
  real:
    qwen3.5-27b: { name: Qwen3.5-27B, T: 4096, V: 248320, d_model: 5120, d_head: 256, d_ff: 17408, num_heads: 24, num_kv_heads: 4, num_layers: 64, linear_num_key_heads: 16, linear_num_value_heads: 48, linear_key_head_dim: 128, linear_value_head_dim: 128, linear_conv_kernel_dim: 4, chunk_size: 64, partial_rotary_factor: 0.25, rope_theta: 10000000 }

data:
  tokens: [the, cat, sat, on]
  ids: { expr: 'tokens_to_ids(tokens[:-1])' }
  y: { expr: 'tokens_to_ids(tokens[1:])' }

panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
  - cost
  - sequence: true
    tokens: tokens
    input: ids
    label: y
    title: Sequence
    sgd: { params: all, lr: 0.5, label: Update }
    random: true
    reset: true
  - title: 对应的 PyTorch 计算
    code: |-
      e = embed_tokens(ids)
      h = e
      for i, layer in enumerate(layers):
          mask = causal_mask if layer_types[i] == "full_attention" else None
          h = layer(h, attention_mask=mask)
      h_norm = norm(h)
      hidden_states = h_norm
      z = lm_head(hidden_states)
      zf = z.float()
      logp = F.log_softmax(zf, dim=-1)
      lt = F.nll_loss(logp, y, reduction='none')
      loss = lt.mean()
    note: |
      这里的 ids 和 y 已经按相邻位置对齐，形状都是 (T,)，没有额外的 batch 维。layers 中的各层依次执行，使用各自的参数。
      示例使用 {{ num_layers }} 层（{{ layer_types | join: "、" }}），隐藏维度 {{ d_model }}，词表大小 {{ V }}，输入长度 {{ T }}。full_attention 层有 {{ num_heads }} 个 query head、{{ num_kv_heads }} 个 kv head，每个 head 的维度 {{ d_head }}；linear_attention 层有 {{ linear_num_key_heads }} 个 key head、{{ linear_num_value_heads }} 个 value head，$d_k={{ linear_key_head_dim }}$，$d_v={{ linear_value_head_dim }}$，卷积核长 {{ linear_conv_kernel_dim }}，块长 {{ chunk_size }}。
