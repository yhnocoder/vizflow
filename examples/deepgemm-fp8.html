<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepGEMM FP8 GEMM</title>
<link rel="icon" href="data:,">
<style>
main { --vf-stage-height: clamp(560px, calc(100vh - 140px), 1400px); }
@media (max-width: 980px) { main { --vf-stage-height: clamp(400px, 66vh, 940px); } }
</style>
</head>
<body>
<main class="vf-page">
  <vizflow-page src="deepgemm-fp8.yaml"></vizflow-page>
</main>
<script type="module">
import '@yhnocoder/vizflow/element';

const page = document.querySelector('vizflow-page');
page.addEventListener('load', () => {
  window.vizflow = { page, g: page.compiled.graph, nodes: page.compiled.nodes, steps: page.createdSteps };
  document.body.dataset.ready = 'true';
});
</script>
</body>
</html>
