title: Qwen3.5 最后两层：从 token 到损失
lede: Qwen3.5 的 decoder 层有两种：每 4 层里前 3 层用 Gated DeltaNet 做线性注意力，第 4 层用带输出门的 softmax 注意力。这一页从 token id 开始，经过占位的前 $N-2$ 层、第 $N-1$ 层（linear_attention）、第 $N$ 层（full_attention）、final norm、lm_head 和 nll_loss 得到损失，前向和反向都逐步画出来。序列长度 $T=3$，词表只画 5 个 token。点两侧的大括号可以折叠或展开一个模块。
hint: 拖动旋转 · 右键拖动平移 · Ctrl + 滚轮缩放 · 点 log p 的柱子换标签 · 反向时悬停连线
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  LogSoftmax: vizflow/nn/log-softmax
  NLLLoss: vizflow/nn/nll-loss
  ZeroCenteredRMSNorm: vizflow/nn/rmsnorm-zero-centered
  GLU:                 vizflow/nn/glu
  GatedDeltaNet:       ./qwen3_5/gated-deltanet.yaml
  GatedAttention:      ./qwen3_5/attention.yaml
dims: { T: 3, d: 4, f: 6, V: 5, H: 2, Hkv: 1, dh: 8, rd: 2, Hk: 1, Hv: 2, dk: 2, dv: 2, K: 4 }
dtype: bf16
real: { name: Qwen3.5-27B, T: 4096, d: 5120, f: 17408, V: 248320, H: 24, Hkv: 4, dh: 256, rd: 64, Hk: 16, Hv: 48, dk: 128, dv: 128, K: 4 }
vocab: [on, mat, the, sat, cat]
init: { seed: 20261011 }
sequence: { tokens: [the, cat, sat, on], input: ids, label: y }
inputs: {}
weights:
  E: { shape: [V, d] }
  W: { shape: [V, d] }
overview:
  label: 总览
  title: 整张图
  text: |
    这一页从 token id 一直画到损失。Qwen3.5-27B 有 $N=64$ 层，layer_types 按「linear、linear、linear、full」循环 16 次，最后两层正好是一个 linear_attention 层和一个 full_attention 层，这里把它们完整展开，前 $N-2$ 层收成一个占位盒子。两种层的外壳相同：以 0 为中心的 RMSNorm、token mixer、残差、RMSNorm、SwiGLU MLP、残差，只有 token mixer 不同。输入是 <span class="ctx">{{ids[0]:token}}</span> <span class="ctx">{{ids[1]:token}}</span> <span class="ctx">{{ids[2]:token}}</span>，标签右移一位，是 <span class="ctx">{{y[0]:token}}</span> <span class="ctx">{{y[1]:token}}</span> <span class="ctx">{{y[2]:token}}</span>。尺寸用 $d=4$、$f=6$、$V=5$；softmax 注意力有 2 个 query head、1 个 kv head，$d_h=8$；Gated DeltaNet 有 1 个 key head、2 个 value head，$d_k=d_v=2$。
    $$\ell=\frac{1}{T}\sum_{t=1}^{T}-\log\operatorname{softmax}(\mathbf{z}_t)_{y_t}={{loss:3}}$$
  backward:
    label: 总览
    title: 反向总览
    text: |
      整条反向路径一起显示。在 full_attention 层里，跨位置的梯度经过注意力权重 $P$ 传给更早的位置；在 linear_attention 层里，跨位置的梯度沿着状态 $S_t\to S_{t-1}$ 一步步往回传，每一步乘上衰减 $\alpha_t$，也经过短卷积传给前面 3 个位置。
      $$\frac{\partial\ell}{\partial\mathbf{x}_0}={{ x0.grad | matrix:3 }}$$
leaves:
  label: 输入
  title: 输入和参数
  text: |
    输入只有 token id，其余都是参数和常量。三处 RMSNorm 和 q_norm、k_norm 的权重以 0 为中心，乘的是 $1+\boldsymbol{\gamma}$。Gated DeltaNet 除了几个投影，还有短卷积的核 $W_{\mathrm{conv}}$、每个 value head 一个的 $\mathbf{a}_{\log}$ 和 $\mathbf{b}_{\Delta}$，以及门控 RMSNorm 的权重。RoPE 的 cos/sin 表、causal mask 和状态的初值 $S_0=0$ 由形状决定，不需要梯度。
    $$x=({{ids[0]}},{{ids[1]}},{{ids[2]}}),\qquad y=({{y[0]}},{{y[1]}},{{y[2]}})$$

modules:
  LinearDecoderLayer:
    subtitle: Qwen3_5DecoderLayer
    params: { Hk: { type: dim }, Hv: { type: dim }, dk: { type: dim }, dv: { type: dim }, K: { type: dim }, f: { type: dim } }
    inputs: { x: { shape: [T, d] } }
    outputs: [x_out]
    fold:
      label: '$\of{x_out}=\mathrm{layer}(\of{x})$'
      title: linear_attention 层（已折叠）
      text: |
        整个 decoder 层收成一个盒子，对应 <code>model.layers[-2](hidden_states)</code>。
        $$\of{x_out}={{ x_out | matrix:2 }}$$
      backward:
        label: '$\partial$参数, $\partial\of{x}$'
        title: 穿过 linear_attention 层（已折叠）
        text: |
          $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
    body:
      - input_layernorm:
          use: ZeroCenteredRMSNorm
          subtitle: Qwen3_5RMSNorm
          suffix: '1'
          params: { intro: 'token mixer 之前先做一次 RMSNorm，也就是 input_layernorm。' }
          inputs: { x: x }
          outputs: { out: n1 }
          tex: { out: '\mathbf{n}_{1}' }
      - linear_attn:
          use: GatedDeltaNet
          params: { Hk: Hk, Hv: Hv, dk: dk, dv: dv, K: K }
          inputs: { x: n1 }
          outputs: { out: att }
          tex: { out: '\mathbf{att}_{1}' }
      - a: { op: x + att, tex: '\mathbf{a}_{1}' }
      - post_attention_layernorm:
          use: ZeroCenteredRMSNorm
          subtitle: Qwen3_5RMSNorm
          suffix: '2'
          inputs: { x: a }
          outputs: { out: n }
          tex: { out: '\mathbf{n}_{2}' }
      - mlp:
          use: GLU
          subtitle: Qwen3_5MLP
          suffix: '1'
          params: { act: SiLU, f: f }
          inputs: { x: n }
          outputs: { down: down }
          tex: { a: '\mathrm{SiLU}(\mathbf{gate}_{1})', down: '\mathbf{down}_{1}' }
      - x_out: { op: a + down, tex: '\mathbf{x}' }
    steps:
      - id: res1
        show: a
        segment: 残差
        brace: { title: 残差相加, subtitle: '$\of{x}+\of{att}$' }
        label: '$\of{a}=\of{x}+\of{att}$'
        title: 残差相加
        text: |
          linear_attn 的输出加回 residual stream。
          $$\of{a}={{ a | matrix:2 }}$$
        backward:
          label: '$\partial\of{x},\ \partial\of{att}$'
          title: 穿过 linear_attn 的残差
          text: |
            梯度复制成两份，一份进入 linear_attn，一份沿残差直接交给 $\of{x}$。
            $$\frac{\partial\ell}{\partial\of{a}}={{ a.grad | matrix:3 }}$$
      - id: res2
        show: x_out
        segment: 残差
        brace: { title: 残差相加, subtitle: '$\of{a}+\of{down}$' }
        label: '$\of{x_out}=\of{a}+\of{down}$'
        title: 残差相加
        text: |
          MLP 的输出加回 residual stream，得到这一层的输出，它是下一层（full_attention）的输入。
          $$\of{x_out}={{ x_out | matrix:2 }}$$
        backward:
          label: '$\partial\of{a},\ \partial\of{down}$'
          title: 穿过 MLP 的残差
          text: |
            $$\frac{\partial\ell}{\partial\of{x_out}}={{ x_out.grad | matrix:3 }}$$
  FullDecoderLayer:
    subtitle: Qwen3_5DecoderLayer
    params: { H: { type: dim }, Hkv: { type: dim }, dh: { type: dim }, rd: { type: dim }, f: { type: dim }, theta: { type: float, default: 1e7 } }
    inputs: { x: { shape: [T, d] } }
    outputs: [x_out]
    fold:
      label: '$\of{x_out}=\mathrm{layer}(\of{x})$'
      title: full_attention 层（已折叠）
      text: |
        整个 decoder 层收成一个盒子，对应 <code>model.layers[-1](hidden_states)</code>。
        $$\of{x_out}={{ x_out | matrix:2 }}$$
      backward:
        label: '$\partial$参数, $\partial\of{x}$'
        title: 穿过 full_attention 层（已折叠）
        text: |
          $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
    body:
      - input_layernorm:
          use: ZeroCenteredRMSNorm
          subtitle: Qwen3_5RMSNorm
          suffix: '3'
          inputs: { x: x }
          outputs: { out: n1 }
          tex: { out: '\mathbf{n}_{3}' }
          folded: true
          fold:
            text: |
              计算和第 $N-1$ 层（linear_attention）的 input_layernorm 相同，那里展开画了每一步；权重是这一层自己的。
              $$\of{n1}={{ n1 | matrix:2 }}$$
      - self_attn:
          use: GatedAttention
          params: { H: H, Hkv: Hkv, dh: dh, rd: rd, theta: theta }
          inputs: { x: n1 }
          outputs: { att: att }
          tex: { att: '\mathbf{att}_{2}' }
      - a: { op: x + att, tex: '\mathbf{a}_{2}' }
      - post_attention_layernorm:
          use: ZeroCenteredRMSNorm
          subtitle: Qwen3_5RMSNorm
          suffix: '4'
          inputs: { x: a }
          outputs: { out: n }
          tex: { out: '\mathbf{n}_{4}' }
          folded: true
          fold:
            text: |
              计算和第 $N-1$ 层（linear_attention）的 post_attention_layernorm 相同，那里展开画了每一步；权重是这一层自己的。
              $$\of{n}={{ n | matrix:2 }}$$
      - mlp:
          use: GLU
          subtitle: Qwen3_5MLP
          suffix: '2'
          params: { act: SiLU, f: f }
          inputs: { x: n }
          outputs: { down: down }
          tex: { a: '\mathrm{SiLU}(\mathbf{gate}_{2})', down: '\mathbf{down}_{2}' }
          folded: true
          fold:
            text: |
              计算和第 $N-1$ 层（linear_attention）的 mlp 相同，那里展开画了每一步；权重是这一层自己的。
              $$\of{down}={{ down | matrix:2 }}$$
      - x_out: { op: a + down, tex: '\mathbf{x}' }
    steps:
      - id: res1
        show: a
        segment: 残差
        brace: { title: 残差相加, subtitle: '$\of{x}+\of{att}$' }
        label: '$\of{a}=\of{x}+\of{att}$'
        title: 残差相加
        text: |
          self_attn 的输出加回 residual stream。
          $$\of{a}={{ a | matrix:2 }}$$
        backward:
          label: '$\partial\of{x},\ \partial\of{att}$'
          title: 穿过 self_attn 的残差
          text: |
            $$\frac{\partial\ell}{\partial\of{a}}={{ a.grad | matrix:3 }}$$
      - id: res2
        show: x_out
        segment: 残差
        brace: { title: 残差相加, subtitle: '$\of{a}+\of{down}$' }
        label: '$\of{x_out}=\of{a}+\of{down}$'
        title: 残差相加
        text: |
          $$\of{x_out}={{ x_out | matrix:2 }}$$
        backward:
          label: '$\partial\of{a},\ \partial\of{down}$'
          title: 穿过 MLP 的残差
          text: |
            $$\frac{\partial\ell}{\partial\of{x_out}}={{ x_out.grad | matrix:3 }}$$

body:
  - e: { op: 'embedding(ids, E)', tex: '\mathbf{e}' }
  - layers:
      title: $\cdots$ 第 1 到 $N-2$ 层
      subtitle: Qwen3_5DecoderLayer $\times$ ($N-2$)
      fixed: true
      repeat: [{ like: linear_layer, count: 47 }, { like: full_layer, count: 15 }]
      fold:
        label: '$\of{x0}$'
        title: $\cdots$ 第 1 到 $N-2$ 层（占位）
        text: |
          真实模型在 embedding 和最后两层之间还有 $N-2=62$ 个 decoder 层，按「3 个 linear_attention、1 个 full_attention」交替。这里把它们收成一个盒子，只用来示意：盒子里没有真实计算，数值按恒等映射处理。这个盒子不能展开。
          $$\of{x0}=\mathrm{layers}_{1..N-2}(\of{e})\;\approx\;\of{e}\quad(\text{示意})$$
        backward:
          label: '$\partial\of{e}$'
          title: 穿过占位的 $N-2$ 层
          text: |
            $$\frac{\partial\ell}{\partial\of{e}}={{ e.grad | matrix:3 }}$$
      body:
        - x0: { op: identity(e), tex: '\mathbf{x}_0' }
  - linear_layer:
      use: LinearDecoderLayer
      title: Qwen3_5DecoderLayer
      subtitle: 第 $N-1$ 层，linear_attention
      split: true
      params: { Hk: Hk, Hv: Hv, dk: dk, dv: dv, K: K, f: f }
      inputs: { x: x0 }
      outputs: { x_out: x1 }
      tex: { x_out: '\mathbf{x}_{1}' }
  - full_layer:
      use: FullDecoderLayer
      title: Qwen3_5DecoderLayer
      subtitle: 第 $N$ 层，full_attention
      split: true
      params: { H: H, Hkv: Hkv, dh: dh, rd: rd, f: f }
      inputs: { x: x1 }
      outputs: { x_out: x }
  - norm:
      use: ZeroCenteredRMSNorm
      title: model.norm
      subtitle: Qwen3_5RMSNorm
      params:
        name: final norm
        intro: 从这里开始是 final norm（<code>model.norm</code>），在所有 decoder 层之后、lm_head 之前。
        out_note: $\of{out}$ 是 lm_head 的输入。
      inputs: { x: x }
      outputs: { out: h }
      folded: true
      fold:
        text: |
          计算和第 $N-1$ 层的 input_layernorm 相同，那里展开画了每一步；权重是 final norm 自己的。
          $$\of{h}={{ h | matrix:2 }}$$
  - z:    h @ W.T
  - zf:   { op: identity(z), tex: '\mathbf{z}_{\mathrm{fp32}}', dtype: fp32 }
  - log_softmax:
      use: LogSoftmax
      subtitle: F.log_softmax(z.float(), -1)
      inputs: { x: zf }
      outputs: { out: logp }
  - nll_loss:
      use: NLLLoss
      subtitle: "F.nll_loss(logp, labels)，reduction='mean'"
      inputs: { logp: logp, y: y }
      outputs: { loss: loss, lt: lt }
      tex: { lt: '\ell_t' }
      steps:
        pick:
          append: HF 的 <code>self.loss_function</code> 先把 logits 转成 float32，在内部把 labels 右移一位，并跳过标签为 -100 的位置（<code>ignore_index</code>）；这里直接给出右移好的标签，也没有要跳过的位置。标签是输入右移一位：位置 1 的标签是 <span class="ctx">{{y[0]:token}}</span>，位置 2 是 <span class="ctx">{{y[1]:token}}</span>，位置 3 是 <span class="ctx">{{y[2]:token}}</span>。
steps:
  - id: embed
    show: [E, e]
    segment: embed_tokens
    brace: { title: embed_tokens, subtitle: nn.Embedding }
    label: '$\of{e}=E[x]$'
    title: embed_tokens
    text: |
      每个位置按自己的 token id 从 $E$ 里取出一行。Qwen3.5-27B 的词表有 248320 个 token，hidden size 是 5120。
      $$\mathbf{e}={{ e | matrix:2 }}$$
    backward:
      label: '$\partial E$'
      title: 传到 embedding 表
      text: |
        取行的反向是把梯度加回被取到的那一行。
        $$\frac{\partial\ell}{\partial E}={{ E.grad | matrix:3 }}$$
  - id: logits
    show: [W.T, z]
    segment: lm_head
    brace: { title: lm_head, subtitle: h @ W.T }
    label: '$\of{z}$'
    title: lm_head
    text: |
      每个位置的 $\mathbf{h}_t$ 乘同一块 $W^{\top}$，得到下一个 token 的 logits。Qwen3.5-27B 的 lm_head 不和 embedding 共享权重。
      $$\mathbf{z}=\mathbf{h}W^{\top}={{ z | matrix:2 }}$$
    backward:
      label: '$\partial W,\ \partial\of{h}$'
      title: 传到 lm_head 权重和 $\of{h}$
      text: |
        $$\frac{\partial\ell}{\partial\mathbf{h}}={{ h.grad | matrix:3 }}$$
  - id: float
    show: zf
    segment: lm_head
    label: '$\of{zf}$'
    title: 转成 float32
    text: |
      HF 计算损失前先做 <code>logits.float()</code>，后面的 log_softmax 和 nll_loss 都在 float32 里算。类型转换不改变这一页的数值，局部导数是 1。
    backward:
      label: '$\partial\of{z}$'
      title: 穿过类型转换
panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
  - cost
  - sequence: true
    title: 序列
    labels: ['$x_1$', '$x_2$ $\cdot$ $y_1$', '$x_3$ $\cdot$ $y_2$', '$y_3$']
    note: 前三个是输入，后三个是标签。
    sgd: { params: all, lr: 0.5, label: 更新一步全部参数 }
    random: true
    reset: true
  - attention: 'full_layer.self_attn.eager_attention_forward.P[1..H]'
    ids: ids
    title: full_attention 层的注意力权重 P
    note: 行是 query 的位置，列是 key 的位置。
  - title: 对应的 PyTorch
    code: |-
      # transformers Qwen3_5 的文本部分，layer_types[-2:] = linear, full
      x0 = layers[:-2](model.embed_tokens(input_ids))   # 图里是占位盒子
      lin, full = model.layers[-2], model.layers[-1]
      a = x0 + lin.linear_attn(lin.input_layernorm(x0))  # Qwen3_5GatedDeltaNet
      x1 = a + lin.mlp(lin.post_attention_layernorm(a))
      n1, attn = full.input_layernorm(x1), full.self_attn  # Qwen3_5Attention
      q, gate = torch.chunk(attn.q_proj(n1).view(B,T,-1,dh*2), 2, dim=-1)
      gate = gate.reshape(B,T,-1)
      q = attn.q_norm(q.view(B,T,-1,dh)).transpose(1,2)
      k = attn.k_norm(attn.k_proj(n1).view(B,T,-1,dh)).transpose(1,2)
      v = attn.v_proj(n1).view(B,T,-1,dh).transpose(1,2)
      q, k = apply_rotary_pos_emb(q, k, cos, sin)       # 只转前 rd 维
      o, _ = eager_attention_forward(attn, q, k, v, mask, scaling=dh**-0.5)
      o = o.reshape(B,T,-1) * torch.sigmoid(gate)
      a = x1 + attn.o_proj(o)
      x = a + full.mlp(full.post_attention_layernorm(a))
      # loss = self.loss_function(logits, labels, V) 展开成下面两行
      logp = F.log_softmax(lm_head(model.norm(x)).float(), -1)
      loss = F.nll_loss(logp.view(-1, V), shift_labels.view(-1), ignore_index=-100)
    note: Qwen3.5-27B：d = 5120，64 层，每 4 层一个 full_attention；softmax 注意力 24 个 query head、4 个 kv head，head_dim = 256，只有前 64 维做 RoPE，rope_theta = $10^7$；Gated DeltaNet 16 个 key head、48 个 value head，$d_k=d_v=128$，卷积核长 4；intermediate_size = 17408，V = 248320。
values:
  linear_layer.input_layernorm.weight: [0.03, -0.04, 0.02, 0.05]
  linear_layer.post_attention_layernorm.weight: [-0.02, 0.04, 0.01, -0.03]
  full_layer.input_layernorm.weight: [0.04, 0.01, -0.03, 0.02]
  full_layer.post_attention_layernorm.weight: [0.02, -0.05, 0.03, 0.01]
  full_layer.self_attn.q_norm.weight: [0.02, -0.01, 0.03, 0, -0.02, 0.01, 0.04, -0.03]
  full_layer.self_attn.k_norm.weight: [-0.01, 0.03, 0, 0.02, 0.01, -0.02, 0.03, 0.01]
  norm.weight: [-0.04, 0.03, 0.04, 0.01]
  linear_layer.linear_attn.A_log: [0.3, -0.9]
  linear_layer.linear_attn.dt_bias: [0.2, -0.3]
