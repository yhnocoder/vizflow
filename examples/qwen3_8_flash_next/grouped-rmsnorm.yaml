module: GroupedRMSNorm
subtitle: Qwen4ExpTextRMSNorm，按组归一化
formula: '\step{scale}{\of{out}=}\step{flatten}{\operatorname{flatten}\big(}\step{normalize}{\of{xg}\big/}\step{rms}{\sqrt{\operatorname{mean}\big(\step{square}{{\of{xg}}^{2}}\big)+\epsilon}}\step{flatten}{\big)}\step{scale}{\odot(1+\of{weight})}'
params:
  g:    { type: dim }
  eps:  { type: float, default: 1e-6 }
  name: { type: text, default_key: true }
  intro: { type: text, default: '' }
inputs:
  x: { shape: [T, n] }
outputs: [out]
weights:
  weight: { shape: [n], init: zeros, tex: '\boldsymbol{\gamma}' }
body:
  - xg: { op: 'view(x, T, n // g, g)', tex: '{\of{x}}^{\mathrm{grp}}', dtype: fp32 }
  - sq: { op: xg ** 2, tex: '({\of{x}}^{\mathrm{grp}})^{2}' }
  - ms: { op: 'mean(sq, -1, keepdim=true)', tex: '\mathrm{ms}' }
  - r:  { op: 'rsqrt(ms, eps=eps)', tex: r }
  - xh: { op: xg * r, tex: '\hat{\of{x}}^{\mathrm{grp}}' }
  - flat: { op: 'view(xh, T, n)', tex: '\operatorname{flatten}(\hat{\of{x}}^{\mathrm{grp}})' }
  - scale: { op: weight + 1, tex: '(1+\of{weight})', dtype: fp32 }
  - out: { op: flat * scale, dtype: x }
steps:
  - id: group
    show: xg
    label: '$\of{xg}$'
    title: \of{name}：转成 float32，按组 reshape
    text: |
      \of{intro}<code>x.float().reshape(*x.shape[:-1], -1, group_size)</code>：输入先转成 float32，最后一维 $n=\of{n}$ 切成 $\of{n//g}$ 组，每组 $g=\of{g}$ 个数，也就是每个残差流一组。之后的均方根在每一组里单独计算，各组互不影响。
      $$\of{xg}={{ xg | matrix:2 }}$$
    backward:
      label: '$\partial\of{x}$'
      title: 按组拼回输入
      text: |
        $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
  - id: square
    show: sq
    label: '$\of{sq}$'
    title: 逐元素平方
    text: |
      <code>x.pow(2)</code>。
      $$\of{sq}={{ sq | matrix:2 }}$$
    backward:
      label: '$\partial\of{xg}$'
      title: 穿过平方
      text: 平方这一路的局部导数是 $2x$。
  - id: rms
    show: [ms, r]
    label: '$\of{ms},\ \of{r}$'
    title: 每组的均方根倒数
    text: |
      <code>torch.rsqrt(x.pow(2).mean(-1, keepdim=True) + eps)</code>：每个位置、每一组各得到一个 $r$，$\epsilon=\of{eps}$。
      $$r={{ r | matrix:3 }}$$
    backward:
      label: '$\partial\of{ms},\ \partial\of{sq}$'
      title: 传到 ms 和平方
      text: |
        $\partial r/\partial\,\mathrm{ms}=-r^3/2$，再均分给组里的每个平方。
        $$\frac{\partial\ell}{\partial r}={{ r.grad | matrix:3 }}$$
  - id: normalize
    show: xh
    label: '$\of{xh}$'
    title: 归一化
    text: |
      组里的每个数乘上这一组的 $r$。
      $$\of{xh}={{ xh | matrix:2 }}$$
    backward:
      label: '$\partial r,\ \partial\of{xg}$'
      title: 传到 r 和直连的那一路
  - id: flatten
    show: flat
    label: '$\of{flat}$'
    title: 拼回一行
    text: |
      <code>out.flatten(-2)</code>：各组按原来的顺序拼回长度 $\of{n}$ 的一行。
      $$\of{flat}={{ flat | matrix:2 }}$$
    backward:
      label: '$\partial\of{xh}$'
      title: 切回各组
  - id: scale
    show: [weight, scale, out]
    label: '$\of{out}$'
    title: 乘上 $1+\of{weight}$
    text: |
      <code>output * (1.0 + self.weight.float())</code>，再 <code>type_as(x)</code> 转回输入的 dtype。权重长 $\of{n}$，每一组有自己的 $\of{g}$ 个系数；权重初值是 0，乘的是 $1+\of{weight}$。
      $$\of{out}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\of{weight},\ \partial\of{flat}$'
      title: 传到 $\of{weight}$ 和归一化的结果
      text: |
        $$\frac{\partial\ell}{\partial\of{weight}}={{ weight.grad | matrix:3 }}$$
