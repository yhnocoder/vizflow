module: DeepseekV4MoE
subtitle: DeepseekV4SparseMoeBlock
import:
  GLU: vizflow/nn/glu
  Router: ./router.yaml
params:
  E:     { type: dim }
  V:     { type: dim }
  K:     { type: dim }
  f:     { type: dim }
  rsf:   { type: float, default: 1.5 }
  limit: { type: float }
  hash:  { type: bool, default: false }
inputs:
  x:   { shape: [T, d] }
  ids: { shape: [T], when: hash }
outputs: [out]
fold:
  label: '$\of{out}=\mathrm{mlp}(\of{x})$'
  title: mlp（已折叠）
  text: |
    路由、\of{E} 个路由专家和共享专家都收进了盒子，对应 HF 里 <code>self.mlp(hidden_states, input_ids)</code>。每个位置只经过 $K=\of{K}$ 个路由专家和 1 个共享专家。
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 mlp（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - gate:
      use: Router
      title: gate
      params: { E: E, V: V, K: K, rsf: rsf, hash: hash }
      inputs: { x: x, ids: ids }
      outputs: { rw: rw }
  - experts:
      title: experts
      subtitle: DeepseekV4Experts，每个专家对所有位置都算一遍，再按权重相加
      body:
        - for: e
          in: 1..E
          body:
            - expert[e]:
                use: GLU
                subtitle: 路由专家，带截断的 SwiGLU
                folded: true
                params: { act: silu, f: f, name: expert, clamped: true, limit: limit }
                inputs: { x: x }
                outputs: { down: 'y[e]' }
            - yv[e]: { op: 'view(y[e], T, 1, d)', tex: 'Y_{:,\of{e},:}' }
        - Y: { op: 'cat(yv[1..E], dim=1)', tex: 'Y' }
        - Yw: { op: 'Y * view(rw, T, E, 1)', tex: '\mathbf{p}\odot Y' }
        - routed: { op: 'sum(Yw, 1)', tex: '\mathbf{y}^{\mathrm{r}}' }
  - shared_experts:
      use: GLU
      subtitle: DeepseekV4MLP，共享专家
      suffix: s
      folded: true
      params: { act: silu, f: f, name: shared, clamped: true, limit: limit }
      inputs: { x: x }
      outputs: { down: shared }
      tex: { down: '\mathbf{y}^{\mathrm{s}}', a: '\mathrm{SiLU}(\bar{\mathbf{gate}}_{s})' }
  - out: { op: routed + shared, tex: '\mathbf{moe}' }
steps:
  - id: stack
    show: ['yv[1..E]', Y]
    label: '$Y$'
    title: 路由专家的输出排在一起
    text: |
      每个路由专家都是一个带截断的 SwiGLU，截断的上限是 swiglu_limit $=\of{limit}$。这里为了画图，每个专家对所有位置都算了一遍，再把 \of{E} 个输出排成 $(T, E, d)$；HF 只把每个专家被选中的那些 token 送进去算。
      $$Y_{:,1,:}={{ y[1] | matrix:2 }}$$
    backward:
      label: '$\partial\mathbf{y}^{(e)}$'
      title: 按专家切开
  - id: weight
    show: Yw
    label: '$\mathbf{p}\odot Y$'
    title: 每个专家的输出乘上自己的权重
    text: |
      没选中的专家权重是 0，它的输出在这里不起作用。
    backward:
      label: '$\partial Y,\ \partial\of{rw}$'
      title: 传到各个专家的输出和权重
      text: |
        专家 $e$ 的输出收到的梯度是 $p_e\,\partial\ell/\partial\of{routed}$，没选中这个专家的位置梯度是 0，所以这个专家的参数只从选中它的 token 学习。
  - id: combine
    show: routed
    label: '$\of{routed}$'
    title: 按专家加起来
    text: |
      $$\of{routed}=\sum_e p_{e}\,\mathbf{y}^{(e)}={{ routed | matrix:2 }}$$
    backward:
      label: '$\partial(\mathbf{p}\odot Y)$'
      title: 梯度复制给每个专家
  - id: add
    show: out
    label: '$\of{out}=\of{routed}+\of{shared}$'
    title: 加上共享专家
    text: |
      共享专家每个位置都要经过，权重固定是 1，它也用带截断的 SwiGLU。
      $$\of{out}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\of{routed},\ \partial\of{shared}$'
      title: 梯度分给路由专家和共享专家
