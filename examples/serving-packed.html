<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打包批次的注意力</title>
<link rel="icon" href="data:,">
<style>
header { margin-bottom: 16px; max-width: 760px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 64ch; }
main { --vf-stage-height: clamp(520px, calc(100vh - 220px), 1200px); }
@media (max-width: 980px) { main { --vf-stage-height: clamp(440px, 72vh, 1000px); } }
.shapes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; font-family: var(--sans); }
.shapes .grp { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin-right: 4px; }
.shapes button { font-family: var(--mono); font-size: 12px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.shapes button:hover { border-color: var(--line-strong); }
.shapes button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.vf-packed { border-collapse: collapse; font-family: var(--mono); font-size: 12px; color: var(--fg); width: 100%; }
.vf-packed th { font-family: var(--sans); font-weight: 500; color: var(--muted); text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
.vf-packed td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
.shapes button:focus-visible { outline: 2px solid var(--pos); outline-offset: 2px; }
</style>
</head>
<body>
<main class="vf-page">
  <header>
    <h1>打包批次的注意力</h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="shapes" id="shapes"></div>
  <vizflow-page></vizflow-page>
</main>
<script type="module">
import { renderText } from '@yhnocoder/vizflow/formula';
import '@yhnocoder/vizflow/element';
import { packedAttention } from '../src/sim/serve/packed.ts';

const SHAPES = {
  mixed: { label: '混合：C 4+2，B 0+6，A 8+1', rows: [{ id: 'C', cached: 4, n: 2 }, { id: 'B', cached: 0, n: 6 }, { id: 'A', cached: 8, n: 1 }] },
  prefill: { label: '只有 prefill：0+4，0+3', rows: [{ id: 'A', cached: 0, n: 4 }, { id: 'B', cached: 0, n: 3 }] },
  decode: { label: '只有 decode：5+1，3+1，7+1', rows: [{ id: 'A', cached: 5, n: 1 }, { id: 'B', cached: 3, n: 1 }, { id: 'C', cached: 7, n: 1 }] },
};

renderText(String.raw`vLLM 和 SGLang 每一步把若干个请求的新 token 拼成一块，只做一次前向。这一页画其中单 head 注意力的一步：每个请求的 query 读 KV cache 里自己已有的 k、v 和这一步新算的 k、v，分块的因果 mask 让请求之间互不可见，最后只取每个请求的最后一行去算 logits。按钮里的「4+2」表示缓存里已有 4 个 token、这一步新增 2 个。`, document.getElementById('lede'));

const page = document.querySelector('vizflow-page');
const shapes = document.getElementById('shapes');
let current = new URLSearchParams(location.search).get('shape') ?? 'mixed';
if (!(current in SHAPES)) current = 'mixed';

function show(name) {
  current = name;
  const built = packedAttention(SHAPES[name].rows);
  page.graph = built.graph;
  page.steps = built.steps;
  page.panels = built.panels;
  page.scene = {
    layout: built.layout,
    hint: '拖动旋转 · 右键拖动平移 · 滚轮缩放 · 悬停层名看 shape',
    camera: { direction: [0.25, 0.85, 1], polar: [0.2, 1.45], follow: true },
  };
  window.vizflow = { page, built, g: built.graph, steps: page.createdSteps, shape: name };
  drawShapes();
}

function drawShapes() {
  shapes.replaceChildren();
  const label = document.createElement('span');
  label.className = 'grp';
  label.textContent = '批次';
  shapes.appendChild(label);
  for (const [name, shape] of Object.entries(SHAPES)) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = shape.label;
    button.setAttribute('aria-pressed', String(name === current));
    button.addEventListener('click', () => show(name));
    shapes.appendChild(button);
  }
}

show(current);
document.body.dataset.ready = 'true';
</script>
</body>
</html>
