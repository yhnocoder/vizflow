title: Qwen3 MoE 最后一层：从 token 到损失
lede: Qwen3 MoE 的每个 decoder 层都把 SwiGLU MLP 换成稀疏 MoE：router 用 softmax 给每个专家一个概率，每个位置只经过概率最大的 $K$ 个专家。这一页从 token id 开始，经过占位的前 $N-1$ 层、最后一个 decoder 层、final norm、lm_head 和 nll_loss 得到损失，前向和反向都逐步画出来。序列长度 $T=3$，词表只画 5 个 token。点两侧的大括号可以折叠或展开一个模块。
hint: 拖动旋转 · 右键拖动平移 · Ctrl + 滚轮缩放 · 点 log p 的柱子换标签 · 反向时悬停连线
camera: { direction: [0.3, 0.5, 1], polar: [0.2, 1.45], follow: true }
import:
  RMSNorm:        vizflow/nn/rmsnorm
  SparseMoE:      vizflow/nn/moe
  Qwen3Attention: ./qwen3/attention.yaml
dims: { T: 3, d: 4, V: 5, H: 2, Hkv: 1, dh: 4, Ne: 4, K: 2, mf: 2 }
dtype: bf16
real: { name: Qwen3-30B-A3B, d: 2048, V: 151936, H: 32, Hkv: 4, dh: 128, Ne: 128, K: 8, mf: 768 }
vocab: [on, mat, the, sat, cat]
init: { seed: 20261011 }
sequence: { tokens: [the, cat, sat, on], input: ids, label: y }
inputs: {}
weights:
  E: { shape: [V, d] }
  W: { shape: [V, d] }
overview:
  label: 总览
  title: 整张图
  text: |
    这一页从 token id 一直画到损失。Qwen3-30B-A3B 有 $N=48$ 层，<code>decoder_sparse_step = 1</code>、<code>mlp_only_layers</code> 为空，所以每一层的 MLP 都是 MoE。这里展开最后一层，前 $N-1$ 层收成一个占位盒子。注意力和 Qwen3 dense 相同：q_norm、k_norm、RoPE 和 grouped-query attention。MoE 里每个位置从 \of{Ne} 个专家里选 $K=\of{K}$ 个，没有共享专家。输入是 <span class="ctx">{{ids[0]:token}}</span> <span class="ctx">{{ids[1]:token}}</span> <span class="ctx">{{ids[2]:token}}</span>，标签右移一位，是 <span class="ctx">{{y[0]:token}}</span> <span class="ctx">{{y[1]:token}}</span> <span class="ctx">{{y[2]:token}}</span>。尺寸用 $d=4$、$V=5$；注意力有 2 个 query head、1 个 kv head，$d_h=4$；MoE 有 4 个专家，每个专家的中间维度是 2。
    $$\ell=\frac{1}{T}\sum_{t=1}^{T}-\log\operatorname{softmax}(\mathbf{z}_t)_{y_t}={{loss:3}}$$
  backward:
    label: 总览
    title: 反向总览
    text: |
      整条反向路径一起显示。跨位置的梯度只在注意力里产生，经过注意力权重 $P$ 和 $\mathbf{k}$、$\mathbf{v}$ 传给更早的位置；MoE 里每个位置的梯度只进入选中它的那几个专家，router 的梯度经过 softmax 传给所有专家的分数。
      $$\frac{\partial\ell}{\partial\mathbf{x}_0}={{ x0.grad | matrix:3 }}$$
leaves:
  label: 输入
  title: 输入和参数
  text: |
    输入只有 token id，其余都是参数和常量。注意力有四个投影和 q_norm、k_norm。MoE 的 gate 有一块 $W_r$，形状 $(E, d)$；所有专家的权重和 HF 一样存在两个参数里：<code>experts.gate_up_proj</code> 是 $W_{gu}$，形状 $(E, 2m_f, d)$，每个专家的 gate_proj 和 up_proj 上下拼在一块里；<code>experts.down_proj</code> 是 $W_d$，形状 $(E, d, m_f)$。RoPE 的 cos/sin 表、causal mask 和 MoE 累加用的全 0 张量由形状决定，不需要梯度。
    $$x=({{ids[0]}},{{ids[1]}},{{ids[2]}}),\qquad y=({{y[0]}},{{y[1]}},{{y[2]}})$$

modules:
  Qwen3MoeDecoderLayer:
    subtitle: Qwen3MoeDecoderLayer
    params: { H: { type: dim }, Hkv: { type: dim }, dh: { type: dim }, Ne: { type: dim }, K: { type: dim }, mf: { type: dim } }
    inputs: { x: { shape: [T, d] } }
    outputs: [x_out]
    fold:
      label: '$\of{x_out}=\mathrm{layer}(\of{x})$'
      title: Qwen3MoeDecoderLayer（已折叠）
      text: |
        整个 decoder 层收成一个盒子，对应 <code>model.layers[-1](hidden_states)</code>。
        $$\of{x_out}={{ x_out | matrix:2 }}$$
      backward:
        label: '$\partial$参数, $\partial\of{x}$'
        title: 穿过 Qwen3MoeDecoderLayer（已折叠）
        text: |
          $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
    body:
      - input_layernorm:
          use: RMSNorm
          subtitle: Qwen3MoeRMSNorm
          suffix: '1'
          params: { intro: '注意力之前先做一次 RMSNorm，也就是 input_layernorm。' }
          inputs: { x: x }
          outputs: { out: n1 }
          tex: { out: '\mathbf{n}_{1}' }
          folded: true
      - self_attn:
          use: Qwen3Attention
          subtitle: Qwen3MoeAttention
          params: { H: H, Hkv: Hkv, dh: dh }
          inputs: { x: n1 }
          outputs: { att: att }
          folded: true
      - a: { op: x + att }
      - post_attention_layernorm:
          use: RMSNorm
          subtitle: Qwen3MoeRMSNorm
          suffix: '2'
          inputs: { x: a }
          outputs: { out: n }
          tex: { out: '\mathbf{n}_{2}' }
          folded: true
      - mlp:
          use: SparseMoE
          subtitle: Qwen3MoeSparseMoeBlock
          params: { E: Ne, K: K, mf: mf }
          inputs: { x: n }
          outputs: { out: moe }
          steps:
            router:
              text: |
                <code>router_logits = F.linear(hidden_states, self.weight)</code>。gate 的权重 $W_r$ 形状是 $(E, d)$，每行对应一个专家，$\of{n}W_r^{\top}$ 给每个位置、每个专家一个分数。Qwen3-30B-A3B 有 128 个专家，这里画 \of{Ne} 个。
                $$\mathbf{r}={{ mlp.logits | matrix:3 }}$$
            topk:
              append: |
                Qwen3-30B-A3B 里是 128 选 8。
            normalize:
              append: |
                这一页的模型 dtype 是 bf16，所以路由权重转回 bf16。
      - x_out: { op: a + moe, tex: '\mathbf{x}' }
    steps:
      - id: res1
        show: a
        segment: 残差
        brace: { title: 残差相加, subtitle: '$\of{x}+\of{att}$' }
        label: '$\of{a}=\of{x}+\of{att}$'
        title: 残差相加
        text: |
          self_attn 的输出加回 residual stream。注意力和 Qwen3 dense 的完全相同，默认折叠，点大括号可以展开。
          $$\of{a}={{ a | matrix:2 }}$$
        backward:
          label: '$\partial\of{x},\ \partial\of{att}$'
          title: 穿过 self_attn 的残差
          text: |
            梯度复制成两份，一份进入 self_attn，一份沿残差直接交给 $\of{x}$。
            $$\frac{\partial\ell}{\partial\of{a}}={{ a.grad | matrix:3 }}$$
      - id: res2
        show: x_out
        segment: 残差
        brace: { title: 残差相加, subtitle: '$\of{a}+\of{moe}$' }
        label: '$\of{x_out}=\of{a}+\of{moe}$'
        title: 残差相加
        text: |
          MoE 的输出加回 residual stream，得到这一层的输出。
          $$\of{x_out}={{ x_out | matrix:2 }}$$
        backward:
          label: '$\partial\of{a},\ \partial\of{moe}$'
          title: 穿过 MoE 的残差
          text: |
            $$\frac{\partial\ell}{\partial\of{x_out}}={{ x_out.grad | matrix:3 }}$$

body:
  - e: { op: 'embedding(ids, E)', tex: '\mathbf{e}' }
  - layers:
      title: $\cdots$ 第 1 到 $N-1$ 层
      subtitle: Qwen3MoeDecoderLayer $\times$ ($N-1$)
      fixed: true
      fold:
        label: '$\of{x0}$'
        title: $\cdots$ 第 1 到 $N-1$ 层（占位）
        text: |
          真实模型在 embedding 和最后一层之间还有 $N-1=47$ 个结构相同的 decoder 层。这里把它们收成一个盒子，只用来示意：盒子里没有真实计算，数值按恒等映射处理。这个盒子不能展开。
          $$\of{x0}=\mathrm{layers}_{1..N-1}(\of{e})\;\approx\;\of{e}\quad(\text{示意})$$
        backward:
          label: '$\partial\of{e}$'
          title: 穿过占位的 $N-1$ 层
          text: |
            $$\frac{\partial\ell}{\partial\of{e}}={{ e.grad | matrix:3 }}$$
      body:
        - x0: { op: identity(e), tex: '\mathbf{x}_0' }
  - layer:
      use: Qwen3MoeDecoderLayer
      title: Qwen3MoeDecoderLayer
      subtitle: 第 $N$ 层
      split: true
      params: { H: H, Hkv: Hkv, dh: dh, Ne: Ne, K: K, mf: mf }
      inputs: { x: x0 }
      outputs: { x_out: x }
  - norm:
      use: RMSNorm
      title: model.norm
      subtitle: Qwen3MoeRMSNorm
      params:
        name: final norm
        intro: 从这里开始是 final norm（<code>model.norm</code>），在所有 decoder 层之后、lm_head 之前。
        out_note: $\of{out}$ 是 lm_head 的输入。
      inputs: { x: x }
      outputs: { out: h }
      folded: true
  - z:    h @ W.T
  - LSE:  { op: 'logsumexp(z, -1, keepdim=true)', dtype: fp32 }
  - logp: { op: z - LSE, tex: '\log\mathbf{p}' }
  - lt:   { op: 'nll_loss(logp, y, reduction="none")', tex: '\ell_t' }
  - loss: { op: mean(lt), tex: '\ell' }
steps:
  - id: embed
    show: [E, e]
    segment: embed_tokens
    brace: { title: embed_tokens, subtitle: nn.Embedding }
    label: '$\of{e}=E[x]$'
    title: embed_tokens
    text: |
      每个位置按自己的 token id 从 $E$ 里取出一行。Qwen3-30B-A3B 的词表有 151936 个 token，hidden size 是 2048。
      $$\mathbf{e}={{ e | matrix:2 }}$$
    backward:
      label: '$\partial E$'
      title: 传到 embedding 表
      text: |
        取行的反向是把梯度加回被取到的那一行。
        $$\frac{\partial\ell}{\partial E}={{ E.grad | matrix:3 }}$$
  - id: logits
    show: [W.T, z]
    segment: lm_head
    brace: { title: lm_head, subtitle: h @ W.T }
    label: '$\of{z}$'
    title: lm_head
    text: |
      每个位置的 $\mathbf{h}_t$ 乘同一块 $W^{\top}$，得到下一个 token 的 logits。Qwen3-30B-A3B 的 lm_head 不和 embedding 共享权重。
      $$\mathbf{z}=\mathbf{h}W^{\top}={{ z | matrix:2 }}$$
    backward:
      label: '$\partial W,\ \partial\of{h}$'
      title: 传到 lm_head 权重和 $\of{h}$
      text: |
        $$\frac{\partial\ell}{\partial\mathbf{h}}={{ h.grad | matrix:3 }}$$
  - id: lse
    show: LSE
    segment: log_softmax
    brace: { title: log_softmax, subtitle: '$\mathbf{z}-\mathrm{LSE}$' }
    label: '$\of{LSE}$'
    title: log-sum-exp
    text: |
      $$\mathrm{LSE}_t=\log\sum_i e^{z_{t,i}}={{ LSE | matrix:3 }}$$
    backward:
      label: '$\partial\of{z}$'
      title: 穿过 LSE
      text: |
        $$\frac{\partial\ell}{\partial\mathbf{z}}={{ z.grad | matrix:3 }}$$
  - id: logp
    show: logp
    segment: log_softmax
    brace: { title: log_softmax, subtitle: '$\mathbf{z}-\mathrm{LSE}$' }
    label: '$\of{logp}$'
    title: log_softmax
    text: |
      $$\log\mathbf{p}={{ logp | matrix:2 }}$$
    backward:
      label: '$\partial\of{z},\ \partial\of{LSE}$'
      title: 传到 logits 和 LSE
  - id: nll
    show: lt
    segment: nll_loss
    brace: { title: nll_loss, subtitle: "reduction='mean'" }
    label: '$\of{lt}$'
    title: nll_loss（逐位置）
    text: |
      每个位置按标签取出目标 token 的 log p，取负号。
      $$\ell_t=-\log p_{t,y_t}:\quad \begin{pmatrix}{{lt[0]:3}}\\{{lt[1]:3}}\\{{lt[2]:3}}\end{pmatrix}$$
    backward:
      label: '$\partial\of{logp}$'
      title: 穿过 nll
  - id: mean
    show: loss
    segment: nll_loss
    brace: { title: nll_loss, subtitle: "reduction='mean'" }
    label: '$\of{loss}$'
    title: 取平均
    text: |
      $$\ell=\frac{1}{T}\sum_t\ell_t={{loss:3}}$$
    backward:
      label: '$\partial\of{lt}$'
      title: 从损失出发
panels:
  - loss: { parts: lt, hint: 走几步看损失下降 }
  - sequence: true
    title: 序列
    labels: ['$x_1$', '$x_2$ $\cdot$ $y_1$', '$x_3$ $\cdot$ $y_2$', '$y_3$']
    note: 前三个是输入，后三个是标签。
    sgd: { params: all, lr: 0.5, label: 更新一步全部参数 }
    random: true
    reset: true
  - attention: 'layer.self_attn.eager_attention_forward.P[1..H]'
    ids: ids
    title: 注意力权重 P
    note: 行是 query 的位置，列是 key 的位置。
  - title: 对应的 PyTorch
    code: |-
      # transformers Qwen3Moe
      x0 = layers[:-1](model.embed_tokens(input_ids))   # 图里是占位盒子
      layer = model.layers[-1]
      a = x0 + layer.self_attn(layer.input_layernorm(x0))
      n = layer.post_attention_layernorm(a)
      mlp = layer.mlp                                  # Qwen3MoeSparseMoeBlock
      logits = F.linear(n, mlp.gate.weight)            # Qwen3MoeTopKRouter
      probs = F.softmax(logits, dtype=torch.float, dim=-1)
      top, idx = torch.topk(probs, mlp.gate.top_k, dim=-1)
      top /= top.sum(dim=-1, keepdim=True)             # norm_topk_prob
      top = top.to(logits.dtype)
      experts = mlp.experts                            # Qwen3MoeExperts
      moe = torch.zeros_like(n)
      mask = F.one_hot(idx, num_classes=experts.num_experts + 1).permute(2, 1, 0)
      expert_hit = torch.greater(mask.sum(dim=(-1, -2)), 0).nonzero()
      for e in expert_hit:
          e = e[0]
          if e == experts.num_experts:
              continue
          pos, tok = torch.where(mask[e])
          g, u = F.linear(n[tok], experts.gate_up_proj[e]).chunk(2, dim=-1)
          y = F.linear(F.silu(g) * u, experts.down_proj[e])
          y = y * top[tok, pos, None]
          moe.index_add_(0, tok, y.to(moe.dtype))
      x = a + moe
      logp = F.log_softmax(lm_head(model.norm(x)).float(), -1)
      loss = F.nll_loss(logp.view(-1, V), labels.view(-1))
    note: Qwen3-30B-A3B：d = 2048，48 层，32 个 query head、4 个 kv head，head_dim = 128，rope_theta = $10^6$；128 个专家，每个 token 选 8 个，moe_intermediate_size = 768，没有共享专家；V = 151936。
