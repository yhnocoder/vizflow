<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vizflow scene3d：lm_head 与 NLL Loss</title>
<style>
h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0 0 12px; }
#stage { height: var(--vf-stage-height); min-height: 360px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.bar button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); cursor: pointer; }
.bar .step { font-family: var(--serif); color: var(--muted); }
</style>
</head>
<body>
<main class="vf-page">
  <h1>lm_head 与 NLL Loss（scene3d）</h1>
  <div id="stage"></div>
  <div class="bar">
    <button id="prev" type="button">← 上一步</button>
    <button id="next" type="button">下一步 →</button>
    <span class="step" id="step"></span>
    <button id="toggleTheme" type="button">切换深色</button>
  </div>
</main>
<script type="module">
import { graph, formatNumber } from '@yhnocoder/vizflow/core';
import { explain } from '@yhnocoder/vizflow/explain';
import { createSteps } from '@yhnocoder/vizflow/steps';
import { mountScene, board, stack } from '@yhnocoder/vizflow/scene3d';

const params = new URLSearchParams(location.search);
const gap = params.has('gap') ? Number(params.get('gap')) : 0.7;

const g = graph({ dims: { d: 4, V: 5 }, real: { d: 4096, V: 151936, name: 'Qwen3-8B' } });
const h = g.input('h', [1, 'd'], [0.8, -1.1, 0.5, 1.4]);
const W = g.param('W', ['V', 'd'], [
  [0.9, -0.6, 0.3, 0.6],
  [0.2, -0.8, 0.6, 0.2],
  [-0.4, 0.2, 0.9, 0.3],
  [0.5, 0.7, -0.6, -0.2],
  [-0.7, 0.4, -0.3, -0.5],
], { tex: 'W', elem: 'W' });
const t = g.label('t', [0], { tokens: [' mat', ' floor', ' sofa', ' dog', ' sat'] });
const z = g.matmul(h, W.T, { name: 'z' });
const ex = g.exp(z, { name: 'ex', tex: 'e^{\\mathbf{z}}', elem: 'e^{z}' });
const S = g.sum(ex, -1, { keepdim: true, name: 'S', tex: 'S', elem: 'S' });
const L = g.log(S, { name: 'LSE' });
const logp = g.sub(z, L, { name: 'log p', tex: '\\log\\mathbf{p}', elem: '\\log p' });
const ti = g.view(t, [-1, 1], { name: 'ti', tex: '\\mathbf{t}', elem: 't' });
const pick = g.gather(logp, -1, ti, { name: 'pick', tex: '\\log p_{t}', elem: '\\log p_{t}' });
const lt = g.neg(pick, { name: 'lt', tex: '\\boldsymbol{\\ell}', elem: '\\ell' });
const loss = g.mean(lt, { name: 'loss', tex: '\\ell', elem: '\\ell' });

const steps = createSteps(g, {
  overview: { title: '整张图', text: '目标 token 是 {{t:token}}。$$\\ell = \\mathrm{LSE}(\\mathbf{z}) - z_t = {{loss:3}}$$' },
  forward: [
    { show: [h, W.T], label: 'h, Wᵀ', title: '输入：h 和 Wᵀ', text: '图里画的是 $W^{\\top}$。' },
    { show: z, active: [h, W.T, z], label: 'z = hWᵀ', title: 'lm_head：z = hWᵀ', text: '$$z_{ {{t+1}} } = {{z[t]}}$$' },
    { show: ex, label: '$e^{\\mathbf{z}}$', title: 'log_softmax：取 exp', text: '$$e^{z_{ {{t+1}} }} = {{ex[t]:3}}$$' },
    { show: S, label: '$S$', title: 'log_softmax：求和', text: '$$S = \\sum_j e^{z_j} = {{S:3}}$$' },
    { show: L, label: 'LSE', title: 'log_softmax：取 log', text: '$$\\mathrm{LSE} = \\log S = {{LSE}}$$' },
    { show: logp, label: 'log p', title: 'log_softmax：减去 LSE', text: '$$\\log p_{ {{t+1}} } = {{log p[t]}}$$' },
    { show: pick, label: '$\\log p_t$', title: 'nll_loss：按标签取格', text: '$$\\log p_t = {{pick:3}}$$' },
    { show: lt, label: '$-\\log p_t$', title: 'nll_loss：取负', text: '$$-\\log p_t = {{lt:3}}$$' },
    { show: loss, label: 'ℓ', title: 'nll_loss：取平均', text: '$$\\ell = {{loss:3}}$$' },
  ],
  backward: 'auto',
});

const sceneOptions = {
  steps,
  layout: [
    board(h, W.T, z, { gap, scales: { h: { forward: 0.45, backward: 1.2 }, 'W.T': { forward: 0.6, backward: 0.8 }, z: { forward: 0.3, backward: 1.6 } } }),
    stack(z, ex, S, L, logp, pick, lt, loss, { scales: { 'log p': { forward: 0.32, backward: 1.6 } }, offsets: { LSE: [0, 0.9, 0], lt: [0, 0.9, 0], loss: [0, 0.9, 0] } }),
  ],
  hint: '点 logit 柱子换目标 token · 悬停层名看 shape · 反向时悬停连线',
};
let scene = mountScene('#stage', g, sceneOptions);
const remount = () => {
  scene.dispose();
  scene = mountScene('#stage', g, sceneOptions);
  window.vizflow.scene = scene;
};

const stepLabel = document.getElementById('step');
const showStep = () => {
  const info = steps.list[steps.current];
  stepLabel.textContent = `${info.dir === 'forward' ? '前向' : '反向'} ${info.index}：${steps.text().title}`;
};
steps.subscribe(showStep);
showStep();
document.getElementById('prev').addEventListener('click', () => steps.prev());
document.getElementById('next').addEventListener('click', () => steps.next());
document.getElementById('toggleTheme').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
});

window.vizflow = { g, steps, scene, remount, explainer: explain(g), nodes: { h, W, t, z, ex, S, L, logp, pick, lt, loss }, formatNumber };
document.body.dataset.ready = 'true';
</script>
</body>
</html>
