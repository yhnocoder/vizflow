<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>log_softmax 小部件</title>
<link rel="icon" href="data:,">
</head>
<body>
<main class="vf-page">
  <h1>log_softmax 与 nll_loss</h1>
  <div class="vf-stack">
    <div id="steps"></div>
    <div id="side"></div>
  </div>
</main>
<script type="module">
import { graph } from '@yhnocoder/vizflow/core';
import { createSteps } from '@yhnocoder/vizflow/steps';
import { mountSteps, mountPanels } from '@yhnocoder/vizflow/ui';

const g = graph({ dims: { V: 5 }, check: true });
const x = g.input('x', ['V'], [2.0, 1.0, 0.2, -0.6, -1.4]);
const t = g.label('t', 0, { tokens: [' mat', ' floor', ' sofa', ' dog', ' sat'] });
const ex = g.exp(x, { name: 'ex', tex: 'e^{\\mathbf{x}}', elem: 'e^{x}' });
const S = g.sum(ex, -1, { keepdim: true, name: 'S', tex: 'S', elem: 'S' });
const L = g.log(S, { name: 'LSE' });
const logp = g.sub(x, L, { name: 'log p', tex: '\\log\\mathbf{p}', elem: '\\log p' });
const ti = g.view(t, [1], { name: 'ti', tex: 't', elem: 't' });
const pick = g.gather(logp, -1, ti, { name: 'pick', tex: '\\log p_{t}', elem: '\\log p_{t}' });
const lt = g.neg(pick, { name: 'lt', tex: '\\boldsymbol{\\ell}', elem: '\\ell' });
const loss = g.mean(lt, { name: 'loss', tex: '\\ell', elem: '\\ell' });

const steps = createSteps(g, {
  overview: {
    title: '整张图',
    text: String.raw`
      目标 token 是 <span class="ctx">{{t:token}}</span>。

      $$\ell = -\log p_{ {{t+1}} } = {{loss:3}}$$
    `,
  },
  forward: [
    { show: x, label: 'x', title: '输入：logits x',
      text: String.raw`$$\mathbf{x} = ({{x[0]:2}},\; {{x[1]:2}},\; {{x[2]:2}},\; {{x[3]:2}},\; {{x[4]:2}})$$` },
    { show: ex, label: '$e^{\\mathbf{x}}$', title: 'log_softmax：取 exp',
      text: String.raw`$$e^{x_{ {{t+1}} }} = {{ex[t]:3}}$$` },
    { show: S, label: '$S$', title: 'log_softmax：求和',
      text: String.raw`$$S = \sum_j e^{x_j} = {{S:3}}$$` },
    { show: L, label: 'LSE', title: 'log_softmax：取 log',
      text: String.raw`$$\mathrm{LSE} = \log S = {{LSE:3}}$$` },
    { show: logp, label: 'log p', title: 'log_softmax：减去 LSE',
      text: String.raw`$$\log p_{ {{t+1}} } = x_{ {{t+1}} } - \mathrm{LSE} = {{log p[t]:3}}$$` },
    { show: pick, label: '$\\log p_t$', title: 'nll_loss：按标签取格',
      text: String.raw`$$\log p_t = {{pick:3}}$$` },
    { show: lt, label: '$-\\log p_t$', title: 'nll_loss：取负',
      text: String.raw`$$-\log p_t = {{lt:3}}$$` },
    { show: loss, label: 'ℓ', title: 'nll_loss：取平均',
      text: String.raw`$$\ell = -\log p_{ {{t+1}} } = {{loss:3}}$$` },
  ],
  backward: 'auto',
});

mountSteps('#steps', steps);
mountPanels('#side', g, [
  { loss: {
      sgd: { params: [x], lr: 1, label: '梯度下降一步' },
      random: { nodes: [x], range: [-3, 3], label: '随机' },
      reset: true,
      text: '目标 "{{t:token}}"，log p = {{log p[t]:3}}',
  } },
  { tokens: t, sliders: x, min: -6, max: 6, columns: [logp, { node: x, grad: true, title: '∂ℓ/∂x' }], title: 'logits 与目标类' },
], { steps });

window.vizflow = { g, steps };
document.body.dataset.ready = 'true';
</script>
</body>
</html>
