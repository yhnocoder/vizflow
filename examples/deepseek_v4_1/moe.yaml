module: MoE
subtitle: MoE，路由专家加 1 个共享专家
import:
  GLU: vizflow/nn/glu
  Experts: vizflow/nn/experts
  Gate: ./gate.yaml
params:
  E:     { type: dim }
  K:     { type: dim }
  f:     { type: dim }
  rsf:   { type: float, default: 1.5 }
  limit: { type: float }
inputs:
  x:          { shape: [T, d] }
  image_mask: { shape: [T] }
outputs: [out]
fold:
  label: '$\of{out}=\mathrm{ffn}(\of{x})$'
  title: ffn（已折叠）
  text: |
    路由、\of{E} 个路由专家和共享专家都收进了盒子。每个位置只经过 $K=\of{K}$ 个路由专家和 1 个共享专家。
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 ffn（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - gate:
      use: Gate
      params: { E: E, K: K, rsf: rsf }
      inputs: { x: x, image_mask: image_mask }
      outputs: { idx: idx, rw: rw }
  - experts:
      use: Experts
      subtitle: Expert $\times E$，按专家循环
      params: { E: E, mf: f, clamped: true, limit: limit, up_first: true, fused: false, token_major: true, scale_hidden: true, float_act: true }
      inputs: { x: x, idx: idx, w: rw }
      outputs: { out: routed }
      tex: { out: '\mathbf{y}^{\mathrm{r}}' }
      steps:
        clamp_up:
          append: 这一页用 $L=\of{limit}$，让截断在小数值上也能看到；真实模型里 swiglu_limit $=10$。
  - shared_experts:
      use: GLU
      subtitle: Expert，共享专家
      suffix: s
      params: { act: SiLU, f: f, name: shared_experts, clamped: true, limit: limit, up_first: true, float_act: true }
      inputs: { x: x }
      outputs: { down: shared }
      tex: { down: '\mathbf{y}^{\mathrm{s}}', a: '\mathrm{SiLU}(\bar{\mathbf{gate}}_{s})' }
      steps:
        gate_proj:
          text: |
            共享专家是同一个 <code>Expert</code> 类，只是调用时不传路由权重：<code>self.shared_experts(x)</code>。w1 把 $\of{x}$ 投影到 $f=\of{f}$ 维，没有 bias。
            $$\mathbf{gate}={{ shared_experts.gate | matrix:2 }}$$
  - y: { op: routed + shared, tex: '\mathbf{y}' }
  - out: { op: identity(y), dtype: x, tex: '\mathbf{y}_{\mathrm{cast}}' }
steps:
  - id: add
    show: y
    label: '$\of{y}=\of{routed}+\of{shared}$'
    title: 加上共享专家
    text: |
      <code>y += self.shared_experts(x)</code>：共享专家每个位置都要经过，权重固定是 1。$\of{y}$ 是 <code>torch.zeros_like(x, dtype=torch.float32)</code> 建的 float32 张量，加法在 float32 里做。
      $$\of{y}={{ y | matrix:2 }}$$
    backward:
      label: '$\partial\of{routed},\ \partial\of{shared}$'
      title: 梯度分给路由专家和共享专家
  - id: cast
    show: out
    label: '$\of{out}$'
    title: 转回输入的 dtype
    text: |
      <code>return y.type_as(x).view(shape)</code>：float32 的结果转回输入 $\of{x}$ 的 dtype，交给 hc_post。
      $$\of{out}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\of{y}$'
      title: 穿过类型转换
      text: 类型转换的局部导数是 1，梯度转回 float32。
