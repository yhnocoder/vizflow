module: Qwen3Attention
import:
  Qwen3RMSNorm: ./rmsnorm.yaml
  apply_rotary_pos_emb: ./apply-rotary-pos-emb.yaml
  eager_attention_forward: ./eager-attention-forward.yaml

args:
  d_model: dim
  d_head: dim
  num_heads: dim
  num_kv_heads: dim
inputs:
  x: [T, d_model]
  mask: [T, T]
  cos: [T, d_head]
  sin: [T, d_head]
outputs:
  att: [T, d_model]

cache: [kr, vt]

init:
  q_proj:
    use: Linear
    args: { in_features: d_model, out_features: num_heads * d_head, bias: false }
  k_proj:
    use: Linear
    args: { in_features: d_model, out_features: num_kv_heads * d_head, bias: false }
  v_proj:
    use: Linear
    args: { in_features: d_model, out_features: num_kv_heads * d_head, bias: false }
  q_norm:
    use: Qwen3RMSNorm
    args: { hidden_size: d_head }
  k_norm:
    use: Qwen3RMSNorm
    args: { hidden_size: d_head }
  apply_rotary_pos_emb: apply_rotary_pos_emb
  eager_attention_forward: eager_attention_forward
  o_proj:
    use: Linear
    args: { in_features: num_heads * d_head, out_features: d_model, bias: false }

forward:
  - q_linear: q_proj(x)
  - q: q_linear.view(T, num_heads, d_head)
  - qn: q_norm(q)
  - qt: qn.transpose(0, 1)
  - k_linear: k_proj(x)
  - k: k_linear.view(T, num_kv_heads, d_head)
  - kn: k_norm(k)
  - kt: kn.transpose(0, 1)
  - v_linear: v_proj(x)
  - v: v_linear.view(T, num_kv_heads, d_head)
  - vt: v.transpose(0, 1)
  - rotated: apply_rotary_pos_emb(q=qt, k=kt, cos=cos, sin=sin)
  - qr: rotated.q_embed
  - kr: rotated.k_embed
  - attn_output: eager_attention_forward(q=qr, k=kr, v=vt, mask=mask)
  - o: attn_output.reshape(T, num_heads * d_head)
  - att: o_proj(o)

tex:
  q_linear: '\mathbf{q}'
  k_linear: '\mathbf{k}'
  v_linear: '\mathbf{v}'
  q: '\mathbf{q}'
  k: '\mathbf{k}'
  v: '\mathbf{v}'
  qn: '\bar{\mathbf{q}}'
  kn: '\bar{\mathbf{k}}'
  qt: '\bar{\mathbf{q}}'
  kt: '\bar{\mathbf{k}}'
  vt: '\mathbf{v}'
  attn_output: '\mathbf{o}'
  qr: "\\mathbf{q}'"
  kr: "\\mathbf{k}'"
  o: '\mathbf{o}'
  att: '\mathbf{att}'
  mask: 'M'
  q_proj.weight: 'W_q'
  k_proj.weight: 'W_k'
  v_proj.weight: 'W_v'
  o_proj.weight: 'W_o'
  q_norm.weight: '\boldsymbol{\gamma}_q'
  k_norm.weight: '\boldsymbol{\gamma}_k'
  q_norm.rms: 'r^{q}'
  k_norm.rms: 'r^{k}'

formula: |-
  \begin{aligned}
  \step{apply_rotary_pos_emb.*}{\viz{qr}}&
  \step{apply_rotary_pos_emb.*}{=\mathrm{RoPE}\big(}
  \step{qk_norm.*}{\mathrm{norm}(}
  \step{q_proj}{\big(\viz{x}{\viz{q_proj.weight}}^{\top}\big).\mathrm{view}(T,H,d_h)}
  \step{qk_norm.*}{)}
  \step{apply_rotary_pos_emb.*}{\big)}\\
  \step{apply_rotary_pos_emb.*}{\viz{kr}}&
  \step{apply_rotary_pos_emb.*}{=\mathrm{RoPE}\big(}
  \step{qk_norm.*}{\mathrm{norm}(}
  \step{k_proj}{\big(\viz{x}{\viz{k_proj.weight}}^{\top}\big).\mathrm{view}(T,H_{kv},d_h)}
  \step{qk_norm.*}{)}
  \step{apply_rotary_pos_emb.*}{\big)}\\
  \step{v_proj}{\viz{v}}&
  \step{v_proj}{=\big(\viz{x}{\viz{v_proj.weight}}^{\top}\big).\mathrm{view}(T,H_{kv},d_h)}\\
  \step{o_proj}{\viz{att}}&
  \step{o_proj}{=}
  \step{eager_attention_forward.*}{\operatorname{Attn}(\viz{qr},\viz{kr},\viz{v})}
  \step{o_proj}{ {\viz{o_proj.weight}}^{\top}}
  \end{aligned}
fold:
  label: '$\viz{att}=\mathrm{self\_attn}(\viz{x})$'
  title: self_attn
  text: |
    位置 $t$ 的输出是 $\sum_{s\le t}P_{t,s}\mathbf{v}_s$ 经过 o_proj 的结果，因此只依赖 $s\le t$ 的输入，Jacobian 是块下三角的。
    $$\viz{att}={{ att | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\viz{x}$'
    title: '$\pfl{\theta},\ \pfl{\viz{x}}$'
    text: |
      一次反向算出 attention 全部参数的梯度和 $\pfl{\viz{x}}$。反向乘的是 Jacobian 的转置，块下三角转置以后是块上三角，所以位置 $s$ 的输入从所有 $t\ge s$ 的输出收到梯度。
      $$\pfl{\viz{x}}={{ x.grad | matrix:3 }}$$

layout:
  merge:
    - [q_norm, k_norm]

steps:
  - id: q_proj
    subtitle: nn.Linear
    label: '$\viz{q}$'
    title: q_proj
    text: |
      注意力要回答的问题是：位置 $t$ 应该从哪些位置取信息。做法是给每个位置算一个 query $\mathbf{q}_t$ 和一个 key $\mathbf{k}_s$，用点积 $\mathbf{q}_t\cdot\mathbf{k}_s$ 衡量匹配程度。

      query 由线性投影得到：<code>self.q_proj(hidden_states)</code> 是一次没有 bias 的线性投影，宽度 $H\,d_h={{ num_heads }}\times{{ d_head }}={{ num_heads * d_head }}$。接着 <code>.view(hidden_shape)</code> 把每一行切成 {{ num_heads }} 个 head，每个 head 宽 $d_h={{ d_head }}$，形状变成 $T\times H\times d_h$。view 只改变形状的解释，不移动数据。HF 的张量多一个 batch 维，这一页没有，所以轴的编号比 HF 少 1。
      $$\viz{q}=\big(\viz{x}{\viz{q_proj.weight}}^{\top}\big).\mathrm{view}(T,H,d_h)={{ q | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q_proj.weight},\ \partial\viz{x}$'
      title: '$\pfl{\viz{q_proj.weight}},\ \pfl{\viz{x}}$'
      text: |
        view 的反向把 $\pfl{\viz{q}}$ 的形状改回 $T\times Hd_h$，然后对 $\viz{x}W_q^{\top}$ 求两个梯度：
        $$\pf{\ell}{W_q^{\top}}={\viz{x}}^{\top}\pfl{\viz{q}},\qquad \pfl{\viz{x}}\mathrel{+}=\pfl{\viz{q}}\,W_q$$
        第一个式子展开是 $\sum_t\mathbf{x}_t^{\top}\pfl{\mathbf{q}_t}$，每个位置贡献一个外积，矩阵乘法把它们加在一起。
  - id: k_proj
    subtitle: nn.Linear
    label: '$\viz{k}$'
    title: k_proj
    text: |
      key 由同一个 $\viz{x}$ 投影得到，但只有 $H_{kv}={{ num_kv_heads }}$ 个 head，宽 {{ num_kv_heads * d_head }}，所以几个 query head 共用一个 kv head，这种做法叫 GQA（grouped-query attention）。它的好处是推理时 k、v 的缓存缩小为 $H_{kv}/H$。

      HF 先算完 q 这一路（q_proj、view、q_norm、transpose），再算 k 这一路。两路互不依赖，所以先后顺序不影响结果。
      $$\viz{k}=\big(\viz{x}{\viz{k_proj.weight}}^{\top}\big).\mathrm{view}(T,H_{kv},d_h)={{ k | matrix:2 }}$$
    backward:
      label: '$\partial\viz{k_proj.weight},\ \partial\viz{x}$'
      title: '$\pfl{\viz{k_proj.weight}},\ \pfl{\viz{x}}$'
      text: |
        和 q_proj 相同：$\pf{\ell}{W_k^{\top}}={\viz{x}}^{\top}\pfl{\viz{k}}$，$\viz{x}$ 再加上 $\pfl{\viz{k}}W_k$。
  - id: v_proj
    subtitle: nn.Linear
    label: '$\viz{v}$'
    title: v_proj
    text: |
      value 是被取回的内容，宽度和 k 相同。q_norm、k_norm 和 RoPE 都作用在分数上，而 v 不参与打分，只是加权求和的对象，所以 v 既不做 norm，也不做 RoPE。<code>value_states = self.v_proj(hidden_states).view(hidden_shape).transpose(1, 2)</code> 一行完成投影、分 head 和换轴。
      $$\viz{v}=\big(\viz{x}{\viz{v_proj.weight}}^{\top}\big).\mathrm{view}(T,H_{kv},d_h)={{ v | matrix:2 }}$$
    backward:
      label: '$\partial\viz{v_proj.weight},\ \partial\viz{x}$'
      title: '$\pfl{\viz{v_proj.weight}},\ \pfl{\viz{x}}$'
      text: |
        $\viz{x}$ 用在三个投影里，$x_{t,k}$ 影响三个投影的全部 ${{ num_heads * d_head }}+{{ num_kv_heads * d_head }}+{{ num_kv_heads * d_head }}$ 个输出分量，所以它的梯度是三路之和：
        $$\pfl{\viz{x}}=\pfl{\viz{q}}W_q+\pfl{\viz{k}}W_k+\pfl{\viz{v}}W_v={{ x.grad | matrix:3 }}$$
  - id: qk_norm
    show: zip(q_norm, k_norm)
    title: q_norm $\cdot$ k_norm
    subtitle: Qwen3RMSNorm，按 head_dim
    formula: |-
      \step{scale}{\viz{qn}=\viz{q_norm.weight}\odot}
      \step{normalize}{\viz{q}\odot}
      \step{rrms}{\frac{1}{\sqrt{\operatorname{mean}({\viz{q}}^{2})+\epsilon}}}
    fold:
      label: '$\viz{qn},\ \viz{kn}$'
      title: q_norm 和 k_norm
      text: |
        每个位置、每个 head 各做一次 RMSNorm，所以 Jacobian 是 $d_h\times d_h$ 的小块。
        $$\viz{qn}={{ qn | matrix:2 }},\qquad \viz{kn}={{ kn | matrix:2 }}$$
      backward:
        label: '$\partial\boldsymbol{\gamma},\ \partial\viz{q},\ \partial\viz{k}$'
        title: '$\pfl{\boldsymbol{\gamma}},\ \pfl{\viz{q}},\ \pfl{\viz{k}}$'
        text: |
          $$\pfl{\viz{q}}={{ q.grad | matrix:3 }},\qquad \pfl{\viz{q_norm.weight}}={{ q_norm.weight.grad | matrix:3 }}$$
    edit:
      rrms:
        title: 每个 head 的均方根倒数
        text: |
          <code>self.q_norm(... .view(hidden_shape))</code>：Qwen3 在 RoPE 之前对 q、k 的每个 head 各做一次 RMSNorm，范围是 $d_h$ 个分量。这是 Qwen3 相对 Qwen2 新增的一步。

          它的作用要从分数的大小看。归一化后每个 head 的 $\hat{\mathbf{q}}$ 模长约为 $\sqrt{d_h}$，乘上 $\viz{q_norm.weight}$ 以后，由 Cauchy 不等式：
          $$|\bar{\mathbf{q}}\cdot\bar{\mathbf{k}}|\le\|\bar{\mathbf{q}}\|\,\|\bar{\mathbf{k}}\|\le d_h\,\max_c|\gamma_{q,c}|\,\max_c|\gamma_{k,c}|$$
          后面的 RoPE 是旋转，不改变模长，所以这个上界在 RoPE 之后仍然成立。也就是说，无论投影权重变得多大，进入 softmax 的分数都有一个由 $\boldsymbol{\gamma}$ 控制的上界，所以 softmax 不会因为 q、k 变大而饱和。
          每个位置、每个 head 沿最后一维计算 $r=(\frac{1}{d_h}\sum_c x_c^2+\epsilon)^{-1/2}$。
          $$\viz{q_norm.rms}={{ q_norm.rms | matrix:3 }},\qquad \viz{k_norm.rms}={{ k_norm.rms | matrix:3 }}$$
        backward:
          title: '$\pfl{\viz{q_norm.xf}},\ \pfl{\viz{k_norm.xf}}$'
          text: |
            均方根倒数对每个分量的局部导数是 $-x_c r^3/d_h$。每个位置、每个 head 独立计算，梯度只传给对应 head 的输入。
      normalize:
        text: |
          每个分量乘上自己那一组的 $r$。这个 $r$ 只由同一个位置、同一个 head 的分量算出，所以每个分量只和这些分量有关。
          $$\hat{\mathbf{q}}={{ q_norm.xh | matrix:2 }}$$
        backward:
          text: |
            $$\pfl{\viz{q_norm.rms}}={{ q_norm.rms.grad | matrix:3 }},\qquad \pfl{\viz{k_norm.rms}}={{ k_norm.rms.grad | matrix:3 }}$$
      scale:
        title: 乘上 $\viz{q_norm.weight}$ 和 $\viz{k_norm.weight}$
        text: |
          $\viz{q_norm.weight}$ 长度为 $d_h$，被 {{ num_heads }} 个 query head 和 $T$ 个位置共用，所以每个分量作用于 ${{ num_heads }}\times T$ 个元素。之后 <code>.transpose(1, 2)</code> 把 head 维换到位置维前面，形状变成 $H\times T\times d_h$，这样后面的运算可以按 head 分批进行。
          $$\viz{qn}={{ qn | matrix:2 }},\qquad \viz{kn}={{ kn | matrix:2 }}$$
        backward:
          title: '$\pfl{\viz{q_norm.weight}},\ \pfl{\viz{k_norm.weight}}$'
          text: |
            $\viz{q_norm.weight}$ 的梯度把 {{ num_heads }} 个 head、$T$ 个位置的贡献加起来，一共 ${{ num_heads }}\times T$ 组。
            $$\pfl{\viz{q_norm.weight}}={{ q_norm.weight.grad | matrix:3 }},\qquad \pfl{\viz{k_norm.weight}}={{ k_norm.weight.grad | matrix:3 }}$$
  - id: apply_rotary_pos_emb
    fold:
      append: |
        这里的 $\mathbf{q}$ 是 $\viz{qn}$，即 q_norm 之后的 query。
        $$\viz{qr}={{ qr | matrix:2 }}$$
      backward:
        text: |
          反向乘的是旋转矩阵的转置，它也是旋转，所以梯度的模长不变，方向转回 $-t\,\omega_c$。
          $$\pfl{\viz{qn}}={{ qn.grad | matrix:3 }},\qquad \pfl{\viz{kn}}={{ kn.grad | matrix:3 }}$$
    edit:
      cos:
        append: |
          <code>cos, sin = position_embeddings</code> 是模型开头 rotary_emb 算好的表，每一层用同一组。q 有 {{ num_heads }} 个 head，k 有 {{ num_kv_heads }} 个，都乘同一张表。HF 的表带 batch 维，要先 <code>cos.unsqueeze(1)</code> 加一个 head 维才能和 q 广播。而这一页没有 batch 维，所以表直接按广播相乘。
          $$\cos={{ cos | matrix:3 }}$$
      sin:
        notes:
          - at: 'sin[0, 1]'
            text: '$t=0$ 时 $\sin 0=0$，这一行全为 0'
  - id: eager_attention_forward
    subtitle: 'repeat_kv $\cdot$ softmax $\cdot$ $P\mathbf{v}$'
    flat: true
    edit:
      krep:
        append: |
          这里 $H={{ num_heads }}$，$H_{kv}={{ num_kv_heads }}$，$n_{\mathrm{rep}}={{ num_heads // num_kv_heads }}$。
      S:
        append: |
          $$S^{({{ num_heads - 1 }})}={{ eager_attention_forward.S[num_heads - 1] | matrix:2 }}$$
      Ssc:
        append: |
          这一页 $1/\sqrt{d_h}={{ d_head ** -0.5 }}$。在 Qwen3 里 q、k 已经过 q_norm、k_norm，所以 $\boldsymbol{\gamma}$ 全为 1 时上面方差的假设近似成立。进一步，把 q_norm 那一步的上界除以 $\sqrt{d_h}$，可知缩放之后分数的绝对值不超过 $\sqrt{d_h}\,\max|\gamma_q|\,\max|\gamma_k|$。
      mask:
        notes:
          - at: 'mask[0, 2]'
            side: left
            text: '$s>t$ 的格子是 dtype 的最小值，取 exp 之后为 0'
        append: |
          mask 来自 <code>Qwen3Model.forward</code> 里的 <code>create_causal_mask</code>，每一层用同一个。
      div:
        notes:
          - at: 'eager_attention_forward.P[0, 0, 0]'
            text: '位置 0 只能看到自己，$P_{0,0}=1$'
        append: |
          位置 0 只能看到自己，所以 $P_{0,0}=1$，它的注意力输出就是 $\mathbf{v}_0$。Qwen3 的 <code>attention_dropout</code> 是 0，所以训练时省去 dropout 也不改变结果。
          $$P^{({{ num_heads - 1 }})}={{ eager_attention_forward.P[num_heads - 1] | matrix:3 }}$$
  - id: reshape
    show: o
    label: '$\viz{o}$'
    title: 拼回 $T\times{{ num_heads * d_head }}$
    text: |
      <code>attn_output.reshape(*input_shape, -1).contiguous()</code> 把 $T\times H\times d_h$ 合并成 $T\times H d_h$，{{ num_heads }} 个 head 的输出在每一行里并排：
      $${\viz{o}}_t=[\,\mathbf{o}^{(0)}_t\,|\,\cdots\,|\,\mathbf{o}^{({{ num_heads - 1 }})}_t\,],\qquad \viz{o}={{ o | matrix:2 }}$$
      上一步的 contiguous 已经让数据按这个顺序排好，所以 reshape 不再复制。局部导数是 1。
    backward:
      title: '$\pfl{\viz{attn_output}}$'
      text: 把梯度按列切回 {{ num_heads }} 个 head。
  - id: o_proj
    subtitle: nn.Linear
    label: o_proj
    title: o_proj
    text: |
      各 head 的输出只是并排放着，彼此没有交换信息，所以 <code>self.o_proj(attn_output)</code> 用一个没有 bias 的线性层把它们混合，投影回 $d_{\mathrm{model}}$ 维：
      $$\viz{att}=\viz{o}{\viz{o_proj.weight}}^{\top}={{ att | matrix:2 }},\qquad (T\times{{ num_heads * d_head }})({{ num_heads * d_head }}\times{{ d_model }})$$
      按 head 把 $W_o$ 的列分块，${\viz{att}}_t=\sum_h\mathbf{o}^{(h)}_tW_o^{(h)\top}$，也就是每个 head 各自投影后相加。
    backward:
      label: '$\partial\viz{o_proj.weight},\ \partial\viz{o}$'
      title: '$\pfl{\viz{o_proj.weight}},\ \pfl{\viz{o}}$'
      text: |
        $$\pf{\ell}{W_o^{\top}}={\viz{o}}^{\top}\pfl{\viz{att}},\qquad \pfl{\viz{o}}=\pfl{\viz{att}}W_o={{ o.grad | matrix:3 }}$$
