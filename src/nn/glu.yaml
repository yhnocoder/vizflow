module: GLU
subtitle: 门控 MLP：GLU、ReGLU、GEGLU、SwiGLU
formula: '\step{down}{\of{down}=\big(}\step{act_fn.*}{\of{act}\big(}\step{proj}{\of{x}{\of{Wg}}^{\top}}\step{act_fn.*}{\big)}\step{gate}{\odot}\step{proj}{\of{x}{\of{Wu}}^{\top}}\step{down}{\big){\of{Wd}}^{\top}}'
import:
  Sigmoid: vizflow/nn/sigmoid
  ReLU:    vizflow/nn/relu
  GELU:    vizflow/nn/gelu
  SiLU:    vizflow/nn/silu
params:
  act:  { type: module, values: [Sigmoid, ReLU, GELU, SiLU], default: SiLU }
  f:    { type: dim }
  name: { type: text, default_key: true }
inputs:
  x: { shape: [T, d] }
outputs: [down]
weights:
  Wg: { shape: [f, d] }
  Wu: { shape: [f, d] }
  Wd: { shape: [d, f] }
fold:
  label: '$\of{down}=\mathrm{\of{name}}(\of{x})$'
  title: \of{name}（已折叠）
  text: |
    $$\of{down}=\mathrm{\of{name}}(\of{x})={{ down | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 \of{name}（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}=\frac{\partial\ell}{\partial\of{down}}J_{\mathrm{\of{name}}}={{ x.grad | matrix:3 }}$$
body:
  - gate: x @ Wg.T
  - up:   x @ Wu.T
  - act_fn:
      use: act
      inputs: { x: gate }
      outputs: { out: a }
      tex: { out: '\of{act}(\mathbf{gate})' }
  - m:    a * up
  - down: m @ Wd.T
steps:
  - id: proj
    show: [Wg.T, Wu.T, gate, up]
    label: '$\mathbf{gate},\ \mathbf{up}$'
    title: gate_proj 和 up_proj
    text: 两个投影的输入都是 $\of{x}$，维度从 $d$ 扩大到 $f$。两个 Linear 都没有 bias。
    backward:
      label: '$\partial W,\ \partial\of{x}$'
  - id: gate
    show: m
    label: '$\of{a}\odot\mathbf{up}$'
    title: 门控相乘
    text: 激活后的 gate 和 up 逐元素相乘，决定 up 的每个分量放行多少。
    backward:
      label: '$\partial\of{a},\ \partial\mathbf{up}$'
  - id: down
    show: [Wd.T, down]
    label: '$\of{down}$'
    title: down_proj
    text: |
      再投影回 $d$ 维。
      $$\of{down} = \of{m}W_d^{\top} = {{ down | matrix }}$$
    backward:
      label: '$\partial W_d,\ \partial\of{m}$'
