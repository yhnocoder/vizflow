module: GLU
import:
  SiLU: vizflow/nn/silu
args:
  d_model: dim
  d_ff: dim
  act: { type: module, default: SiLU }
inputs:
  x: { type: tensor, shape: ['...', d_model], dtype: dtype }
outputs:
  down: { type: tensor, shape: ['...', d_model], dtype: dtype }
init:
  gate_proj:
    use: Linear
    args: { in_features: d_model, out_features: d_ff, bias: False }
  up_proj:
    use: Linear
    args: { in_features: d_model, out_features: d_ff, bias: False }
  down_proj:
    use: Linear
    args: { in_features: d_ff, out_features: d_model, bias: False }
  act_fn: act
forward:
  - gate: gate_proj(x)
  - a: act_fn(gate)
  - up: up_proj(x)
  - m: a * up
  - down: down_proj(m)
tex:
  gate: '\mathbf{gate}'
  a: '\phi(\mathbf{gate})'
  up: '\mathbf{up}'
  m: '\mathbf{m}'
  gate_proj.weight: 'W_g'
  up_proj.weight: 'W_u'
  down_proj.weight: 'W_d'
formula: '\step{down}{\viz{down}=\big(}\step{act_fn.*}{\phi\big(}\step{gate_proj}{\viz{x}{\viz{gate_proj.weight}}^{\top}}\step{act_fn.*}{\big)}\step{gate}{\odot}\step{up_proj}{\viz{x}{\viz{up_proj.weight}}^{\top}}\step{down}{\big){\viz{down_proj.weight}}^{\top}}'
fold:
  label: '$\viz{down}=\mathrm{mlp}(\viz{x})$'
  title: MLP（已折叠）
  text: |
    $$\viz{down}=\mathrm{mlp}(\viz{x})={{ down | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\viz{x}$'
    title: 穿过 MLP（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\viz{x}}=\frac{\partial\ell}{\partial\viz{down}}J_{\mathrm{mlp}}={{ x.grad | matrix:3 }}$$

steps:
  - id: gate_proj
    label: '$\viz{gate}$'
    title: gate_proj
    text: |
      <code>self.gate_proj(x)</code>：把 $\viz{x}$ 从 $d$ 维投影到 $f$ 维，没有 bias。
      $$\viz{gate}=\viz{x}{\viz{gate_proj.weight}}^{\top}={{ gate | matrix:2 }}$$
    backward:
      label: '$\partial\viz{gate_proj.weight},\ \partial\viz{x}$'
      title: 传到 gate_proj 权重和 $\viz{x}$
  - id: act_fn
  - id: up_proj
    label: '$\viz{up}$'
    title: up_proj
    text: |
      <code>self.up_proj(x)</code>：输入也是 $\viz{x}$，同样投影到 $f$ 维，没有 bias。HF 写的是 <code>self.down_proj(self.act_fn(self.gate_proj(x)) * self.up_proj(x))</code>，先算 gate_proj 和激活，再算 up_proj。
      $$\viz{up}=\viz{x}{\viz{up_proj.weight}}^{\top}={{ up | matrix:2 }}$$
    backward:
      label: '$\partial\viz{up_proj.weight},\ \partial\viz{x}$'
      title: 传到 up_proj 权重和 $\viz{x}$
      text: |
        $\viz{x}$ 同时用在 gate_proj 和 up_proj 两处，它的梯度是两条路相加。
        $$\frac{\partial\ell}{\partial\viz{x}}={{ x.grad | matrix:3 }}$$
  - id: gate
    show: m
    label: '$\viz{a}\odot\viz{up}$'
    title: 门控相乘
    text: 激活后的 gate 和 up 逐元素相乘，决定 up 的每个分量放行多少。
    backward:
      label: '$\partial\viz{a},\ \partial\viz{up}$'
  - id: down
    show: down_proj
    label: '$\viz{down}$'
    title: down_proj
    text: |
      <code>self.down_proj(...)</code>：再投影回 $d$ 维。
      $$\viz{down}=\viz{m}{\viz{down_proj.weight}}^{\top}={{ down | matrix:2 }}$$
    backward:
      label: '$\partial\viz{down_proj.weight},\ \partial\viz{m}$'
