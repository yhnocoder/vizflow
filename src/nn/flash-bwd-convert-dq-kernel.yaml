module: flash_bwd_convert_dq_kernel
kernel: true
args:
  softmax_scale: float
  block_m: dim
grid:
  m: triton.cdiv(T, block_m)
  h: num_heads
inputs:
  dq_accum: { type: tensor, shape: [T, num_heads, d_head], dtype: fp32 }
  dq: [T, num_heads, d_head]
outputs:
  dq: [T, num_heads, d_head]

forward:
  - acc_dq: dq_accum[m * block_m:min((m + 1) * block_m, T), h]
  - dq_scaled: acc_dq * softmax_scale
  - 'dq[m * block_m:min((m + 1) * block_m, T), h]': dq_scaled.to(dq.dtype)

tex:
  dq_accum: '\mathrm{d}Q^{\mathrm{acc}}'
  dq: '\mathrm{d}Q'
  acc_dq: '\mathrm{d}Q^{\mathrm{acc}}'
  dq_scaled: '\mathrm{d}Q'
