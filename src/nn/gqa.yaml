module: GQA
inputs:
  q: { type: tensor, shape: [num_heads, T, d_head], dtype: dtype }
  k: { type: tensor, shape: [num_kv_heads, T, d_head], dtype: dtype }
  v: { type: tensor, shape: [num_kv_heads, T, d_head], dtype: dtype }
  mask: { type: tensor, shape: [T, T], dtype: dtype }
outputs:
  o: { type: tensor, shape: [T, num_heads, d_head], dtype: dtype }
forward:
  - key_states: repeat_kv(k, num_heads // num_kv_heads)
  - value_states: repeat_kv(v, num_heads // num_kv_heads)
  - kT: key_states.transpose(1, 2)
  - S: q @ kT
  - Ss: S * d_head ** -0.5
  - Sm: Ss + mask
  - ex: Sm.float().exp()
  - Z: ex.sum(-1, keepdim=True)
  - P: (ex / Z).to(q.dtype)
  - attn_output: P @ value_states
  - o: attn_output.transpose(0, 1).contiguous()
tex:
  key_states: '\mathrm{repeat\_kv}(\viz{k})'
  value_states: '\mathrm{repeat\_kv}(\viz{v})'
  kT: '\mathrm{repeat\_kv}(\viz{k})^{\top}'
  S: 'S'
  Ss: '\tilde{S}'
  Sm: '\bar{S}'
  ex: '\mathrm{ex}'
  Z: 'Z'
  P: 'P'
  attn_output: '\mathbf{o}'
formula: '\step{pv}{\viz{attn_output}=}\step{exp,sum,div}{\operatorname{softmax}\big(}\step{S}{\viz{q}\step{kT}{{\step{krep}{\mathrm{repeat\_kv}(\viz{k})}}^{\top}}}\step{Ssc}{/\sqrt{d_h}}\step{mask}{+\viz{mask}}\step{exp,sum,div}{\big)}\step{vrep,pv}{\mathrm{repeat\_kv}(\viz{v})}'
fold:
  label: '$\viz{o}$'
  title: 注意力（已折叠）
  text: |
    {{ num_heads }} 个 query head 共用 {{ num_kv_heads }} 个 kv head，所有 head 一起做一次批量的因果注意力，再把 head 维换回位置维后面。
    $$\viz{attn_output}={{ attn_output | matrix:2 }}$$
  backward:
    label: '$\partial\viz{q},\ \partial\viz{k},\ \partial\viz{v}$'
    title: 穿过注意力（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\viz{q}}={{ q.grad | matrix:3 }}$$

steps:
  - id: krep
    show: key_states
    label: '$\viz{key_states}$'
    title: repeat_kv：复制 k
    text: |
      {{ num_heads }} 个 query head 共用 {{ num_kv_heads }} 个 kv head。<code>key_states = repeat_kv(key, module.num_key_value_groups)</code> 把每个 kv head 的 k 复制 $n_\text{rep}={{ num_heads // num_kv_heads }}$ 份，每个 query head 拿到一份。复制的局部导数是 1。
    backward:
      label: '$\partial\viz{k}$'
      title: repeat_kv 反向：几份加回一份
      text: |
        复制给几个 query head 的 k，反向时梯度在这里相加，回到各自的 kv head。
        $$\frac{\partial\ell}{\partial\viz{k}}={{ k.grad | matrix:3 }}$$
  - id: vrep
    show: value_states
    label: '$\viz{value_states}$'
    title: repeat_kv：复制 v
    text: <code>value_states = repeat_kv(value, module.num_key_value_groups)</code>：v 也按同样的方式复制，每个 query head 拿到一份。
    backward:
      label: '$\partial\viz{v}$'
      title: v 的几份加回一份
      text: |
        $$\frac{\partial\ell}{\partial\viz{v}}={{ v.grad | matrix:3 }}$$
  - id: kT
    label: '$\viz{kT}$'
    title: 转置
    text: <code>key_states.transpose(2, 3)</code>：把 $d_h$ 换到行、位置换到列。转置只是换轴，局部导数是 1。
    backward:
      label: '$\partial\viz{key_states}$'
      title: 转置回去
      text: 把梯度转置回 $T\times d_h$。
  - id: S
    label: '$\viz{q}\viz{kT}$'
    title: 打分：$\mathbf{q}\mathbf{k}^{\top}$
    text: |
      <code>torch.matmul(query, key_states.transpose(2, 3))</code>：每个 head 各自算一个 $T\times T$ 的分数表，$S_{t,s}$ 是位置 $t$ 的 query 和位置 $s$ 的 key 的点积。
      $$S^{(0)}={{ S[0] | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q},\ \partial\viz{kT}$'
      title: 传到 $\viz{q}$ 和 $\viz{kT}$
      text: |
        $$\frac{\partial\ell}{\partial\viz{q}}={{ q.grad | matrix:3 }}$$
  - id: Ssc
    show: Ss
    label: '$\times\,d_h^{-1/2}$'
    title: 缩放
    text: '<code>* scaling</code>：乘上 $1/\sqrt{d_h}$。点积的方差随 $d_h$ 增长，缩放让 softmax 的输入不至于太大。'
    backward:
      label: '$\partial\viz{S}$'
      title: 穿过缩放
      text: 局部导数是 $1/\sqrt{d_h}$。
  - id: mask
    show: Sm
    label: '$+\,\viz{mask}$'
    title: causal mask
    text: |
      <code>attn_weights = attn_weights + causal_mask</code>：$s>t$ 的位置加 $-\infty$，位置 $t$ 只能看到自己和之前的位置。mask 是常量，不需要梯度。HF 填的是这个 dtype 能表示的最小值 <code>torch.finfo(dtype).min</code>，取 exp 以后和 $-\infty$ 一样是 0，这里写成 $-\infty$。
      $$\viz{mask}={{ mask | matrix:2 }}$$
    backward:
      label: '$\partial\viz{Ss}$'
      title: 穿过 mask
      text: 加常量，梯度原样传下去。
  - id: exp
    show: ex
    label: '$\exp$'
    title: softmax：取 exp
    text: HF 调用的是 <code>softmax(attn_weights, dim=-1, dtype=torch.float32)</code>，先转成 float32 再算。softmax 按定义拆成三步画：取 exp、按行求和、相除。$e^{-\infty}=0$，被 mask 的位置在这里变成 0。kernel 会先给每一行减去这一行的最大值再取 exp，防止溢出；这一项在结果和梯度里都抵消，这里按定义画。
    backward:
      label: '$\partial\viz{Sm}$'
      title: 穿过 exp
      text: exp 的导数是它自己。
  - id: sum
    show: Z
    label: '$\viz{Z}$'
    title: 按行求和
    text: |
      每个 head、每一行各有一个 $Z$。
      $$Z^{(0)}={{ Z[0] | matrix:3 }}$$
    backward:
      label: '$\partial\viz{ex}$'
      title: 传回 ex
      text: 求和的局部导数是 1，$Z_t$ 的梯度复制给这一行的每个 $\mathrm{ex}$，再和直连那条加起来。
  - id: div
    show: P
    label: '$\viz{P}$'
    title: 注意力权重
    text: |
      每一行除以自己的 $Z$，得到位置 $t$ 对之前各位置的注意力分布，每行加起来是 1。<code>.to(query.dtype)</code> 把结果转回 q 的 dtype。HF 接着做 <code>nn.functional.dropout(attn_weights, p=dropout)</code>；Qwen3 的 attention_dropout 是 0，dropout 什么也不做，图里没有这一步。
      $$P^{(0)}={{ P[0] | matrix:3 }}$$
    backward:
      label: '$\partial\viz{ex},\ \partial\viz{Z}$'
      title: softmax 反向：穿过相除
      text: $\mathrm{ex}_{t,s}$ 直连 $P_{t,s}$，局部导数 $1/Z_t$；同时 $Z_t$ 连到这一行每个 $P$，局部导数 $-\mathrm{ex}_{t,s}/Z_t^2$。
  - id: pv
    show: attn_output
    label: '$\viz{P}\viz{value_states}$'
    title: P v
    text: |
      <code>attn_output = torch.matmul(attn_weights, value_states)</code>：每个 head 用注意力权重对 v 的各行做加权平均。随后的 <code>attn_output.transpose(1, 2).contiguous()</code> 把 head 维换回位置维后面，只是换轴和复制，数值不变。
      $${\viz{attn_output}}^{(0)}={{ attn_output[0] | matrix:2 }}$$
    backward:
      label: '$\partial\viz{P},\ \partial\viz{value_states}$'
      title: 传到 P 和 v
      text: $\partial\ell/\partial P=\frac{\partial\ell}{\partial\mathbf{o}}\mathbf{v}^{\top}$，$\partial\ell/\partial\mathbf{v}=P^{\top}\frac{\partial\ell}{\partial\mathbf{o}}$。
