module: LMHeadNLL
subtitle: lm_head、log_softmax、nll_loss
import:
  LogSoftmax: vizflow/nn/log-softmax
  NLLLoss: vizflow/nn/nll-loss
params:
  V: { type: dim }
inputs:
  h: { shape: [T, d] }
  y: { shape: [T] }
outputs: [loss, z, logp]
weights:
  W: { shape: [V, d] }
body:
  - z: h @ W.T
  - log_softmax:
      use: LogSoftmax
      subtitle: F.log_softmax(z.float(), -1)
      inputs: { x: z }
      outputs: { out: logp }
  - nll_loss:
      use: NLLLoss
      subtitle: "F.nll_loss(logp, y)，reduction='mean'"
      inputs: { logp: logp, y: y }
      outputs: { loss: loss }
steps:
  - id: logits
    show: [W.T, z]
    label: '$\of{z}$'
    title: lm_head
    text: |
      每个位置的 ${\of{h}}_t$ 都乘同一块 $W^{\top}$，得到这个位置对下一个 token 的 logits。
      $$\of{z}=\of{h}W^{\top}={{ z | matrix }}$$
