module: Softplus
inputs:
  x: { type: tensor, shape: ['...'], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...'], dtype: dtype }
forward:
  - e: x.exp()
  - d: e + 1
  - out: d.log()
tex:
  e: 'e^{\viz{x}}'
  d: '1+e^{\viz{x}}'
  out: '\operatorname{softplus}(\viz{x})'
formula: '\step{log}{\viz{out}=\log\big(\step{add}{1+}\step{exp}{e^{\viz{x}}}\big)}'
fold:
  label: '$\viz{out}$'
  title: softplus
  text: |
    逐元素计算，对应一次 <code>F.softplus</code>。
    $$\viz{out}=\operatorname{softplus}(\viz{x})={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\viz{x}$'
    title: '$\pfl{\viz{x}}$'
    text: |
      三段局部导数相乘，合起来是 $\sigma(x)$。
      $$\pfl{\viz{x}}={{ x.grad | matrix:3 }}$$
steps:
  - id: exp
    show: e
    label: '$\viz{e}$'
    title: softplus：取 exp
    text: |
      softplus 的定义是 $\log(1+e^{x})$，这里按定义拆成三步：取 exp、加 1、取 log。<code>F.softplus</code> 默认 <code>beta=1</code>、<code>threshold=20</code>：kernel 对 $x\le 20$ 算 <code>log1p(exp(x))</code>，也就是这三步；$x>20$ 时直接输出 $x$，因为这时 $\log(1+e^{x})$ 和 $x$ 在浮点数里已经相等。
      $$\viz{e}={{ e | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x}$'
      title: '$\pfl{\viz{x}}$'
      text: |
        exp 的导数是它自己。
        $$\pfl{\viz{x}}={{ x.grad | matrix:3 }}$$
  - id: add
    show: d
    label: '$\viz{d}$'
    title: softplus：加 1
    text: |
      $$\viz{d}={{ d | matrix:3 }}$$
    backward:
      label: '$\partial\viz{e}$'
      title: '$\pfl{\viz{e}}$'
      text: |
        加常数的局部导数是 1。
        $$\pfl{\viz{e}}={{ e.grad | matrix:3 }}$$
  - id: log
    show: out
    label: '$\viz{out}$'
    title: softplus：取 log
    text: |
      结果总是正数，$x$ 很负时接近 0，$x$ 很大时接近 $x$。
      $$\viz{out}=\log\viz{d}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial\viz{d}$'
      title: '$\pfl{\viz{d}}$'
      text: |
        log 的局部导数是 $1/\viz{d}$。三段乘起来是 $\frac{e^{x}}{1+e^{x}}=\sigma(x)$。
        $$\pfl{\viz{d}}={{ d.grad | matrix:3 }}$$
