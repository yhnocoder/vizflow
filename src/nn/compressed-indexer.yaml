module: CompressedIndexer
subtitle: DeepseekV4Indexer
import:
  Compressor: vizflow/nn/compressor
  PartialRoPE: vizflow/nn/partial-rope
  ReLU: vizflow/nn/relu
formula: '\step{invalid_fill}{\of{idx}=}\step{topk}{\operatorname{argtop}_{k_I}\big(}\step{index_sum}{\textstyle\sum_{h}}\step{weights,weights_scale}{w_{h}}\step{relu.*}{\,\mathrm{ReLU}\big(}\step{dot}{\mathbf{q}_{h}\mathbf{K}^{\top}}\step{relu.*}{\big)}\step{scale}{/\sqrt{c_I}}\step{future_fill}{\text{ 未来条目记 }-\infty}\step{topk}{\big)}'
params:
  HI:    { type: dim }
  cI:    { type: dim }
  kI:    { type: dim }
  m:     { type: dim }
  rd:    { type: dim }
  theta: { type: float, default: 1e4 }
  eps:   { type: float, default: 1e-6 }
inputs:
  x:  { shape: [T, d] }
  qr: { shape: [T, rq] }
outputs: [idx]
buffers:
  position_ids:  { value: 'arange(T)', dtype: int64, tex: '\mathrm{pos}' }
  entry_indices: { value: 'arange(T // m)', dtype: int64, tex: '\mathrm{ent}' }
weights:
  Wqb: { shape: [HI * cI, rq], tex: 'W^{I}_{qb}' }
  Ww:  { shape: [HI, d], tex: 'W^{I}_{w}' }
fold:
  label: '$\of{idx}=\mathrm{indexer}(\of{x},\ \of{qr})$'
  title: indexer（已折叠）
  text: |
    indexer 用自己的一套 compressor 把 key 压缩成和外面相同的窗口，给每个位置和每个已经完整的压缩条目打一个分，每个位置返回分数最高的 $k_I=\of{kI}$ 个条目的编号；选到还没压缩完的条目时，编号换成 $-1$。对应 HF 里 <code>top_k_indices = self.indexer(...)</code>。
    $$\of{idx}={{ idx | matrix:2 }}$$
  backward:
    label: indexer
    title: indexer 没有梯度
    text: indexer 只输出选中的条目编号，选择不可导，损失的梯度不会进入 indexer。
body:
  - compressor:
      use: Compressor
      suffix: I
      subtitle: indexer 自己的 compressor，宽 $c_I$
      params: { m: m, c: cI, rd: rd, theta: theta, overlap: true, eps: eps }
      inputs: { x: x }
      outputs: { C: K }
      tex: { C: '\mathbf{K}^{I}' }
      folded: true
      fold:
        text: |
          和 CSA 的 compressor 相同的重叠窗口压缩，只是宽度是 $c_I=\of{cI}$，参数也是 indexer 自己的一套：kv_proj、gate_proj、position_bias、kv_norm。
          $$\mathbf{K}^{I}={{ K | matrix:2 }}$$
  - qp: { op: qr @ Wqb.T, tex: '\of{qr}{W^{I}_{qb}}^{\top}' }
  - q:  { op: 'view(qp, T, HI, cI)', tex: '\mathbf{q}^{I}' }
  - rope:
      use: PartialRoPE
      suffix: I
      title: apply_rotary_pos_emb
      subtitle: query 在位置 $t$
      params: { rd: rd, theta: theta }
      inputs: { x: q }
      outputs: { out: qe }
      tex: { out: "{\\mathbf{q}^{I}}'" }
      folded: true
      fold:
        text: |
          计算和 self_attn 里 query 的 RoPE 相同，那里展开画了每一步；这里转的是 indexer 的 query。
          $${\mathbf{q}^{I}}'={{ qe | matrix:2 }}$$
  - scorer:
      title: scorer
      subtitle: DeepseekV4IndexerScorer
      body:
        - qf: { op: 'view(qe, T * HI, cI)', tex: 'Q^{I}' }
        - kf: { op: 'view(K, T // m, cI)', tex: 'K^{I}' }
        - kT: { op: kf.T, tex: '{K^{I}}^{\top}' }
        - Sf: { op: qf @ kT, tex: 'Q^{I}{K^{I}}^{\top}', dtype: fp32 }
        - S:  { op: 'view(Sf, T, HI, T // m)', tex: 'S^{I}' }
        - relu:
            use: ReLU
            inputs: { x: S }
            outputs: { out: R }
            tex: { out: 'R' }
            steps:
              relu:
                title: ReLU
                text: |
                  负的点积变成 0：一个 head 觉得某个条目不相关时，它对这个条目的分数没有贡献。HF 先做 ReLU 再乘缩放。
                  $$R={{ R | matrix:3 }}$$
        - Rs: { op: R * cI ** -0.5, tex: '\tilde{R}' }
        - wx: { op: x @ Ww.T, tex: '\of{x}{W^{I}_{w}}^{\top}', dtype: fp32 }
        - w:  { op: wx * HI ** -0.5, tex: '\mathbf{w}^{I}' }
        - Rw: { op: 'Rs * view(w, T, HI, 1)', tex: '\mathbf{w}^{I}\odot\tilde{R}' }
        - I:  { op: 'sum(Rw, 1)', tex: 'I' }
  - pos1:        { op: position_ids + 1, tex: '\mathrm{pos}+1' }
  - threshold:   { op: pos1 // m, tex: '\boldsymbol{\tau}' }
  - entry_row:   { op: 'view(entry_indices, 1, T // m)', tex: '\mathrm{ent}^{\top}' }
  - threshold_col: { op: 'unsqueeze(threshold, -1)', tex: '\boldsymbol{\tau}_{:,1}' }
  - future_mask: { op: 'ge(entry_row, threshold_col)', tex: '\mathbf{m}^{\mathrm{fut}}' }
  - Im:          { op: 'masked_fill(I, future_mask, -inf)', tex: '\bar{I}' }
  - top:         { op: 'topk_indices(Im, min(kI, T // m), -1)', tex: '\mathbf{i}^{\mathrm{top}}' }
  - invalid:     { op: 'ge(top, threshold_col)', tex: '\mathbf{m}^{\mathrm{inv}}' }
  - idx:         { op: 'masked_fill(top, invalid, -1)', tex: '\mathbf{i}^{I}' }
steps:
  - id: q_up
    show: [Wqb.T, qp]
    label: '$\of{qp}$'
    title: q_b_proj：indexer 的 query
    text: |
      indexer 的 query 来自注意力里归一化后的 q latent $\of{qr}$（HF 的 <code>q_residual</code>），乘 indexer 自己的 q_b_proj。
      $$\of{qp}={{ qp | matrix:2 }}$$
  - id: q_heads
    show: q
    label: '$\of{q}$'
    title: 分成 $H_I$ 个 head
    text: |
      分成 $H_I=\of{HI}$ 个 head，每个宽 $c_I=\of{cI}$。真实模型里 $H_I=64$、$c_I=128$。
      $$\of{q}={{ q | matrix:2 }}$$
  - id: q_flat
    show: qf
    label: '$\of{qf}$'
    title: 所有 head 的 query 排成一列
    text: 所有 head 共用同一组压缩后的 key，所以把 $T H_I$ 个 query 排成一个矩阵，一次乘完。
  - id: k_flat
    show: [kf, kT]
    label: '${K^{I}}^{\top}$'
    title: 压缩后的 key 转置
    text: |
      $$K^{I}={{ kf | matrix:2 }}$$
  - id: dot
    show: [Sf, S]
    label: '$\of{S}$'
    title: query 和每个压缩条目做点积
    text: |
      HF 先把 query 和 key 转成 float32 再乘。每个 token 对每个压缩条目都算，因果的限制在后面用 mask 加上。
      $$\of{S}={{ S | matrix:3 }}$$
  - id: scale
    show: Rs
    label: '$\of{Rs}$'
    title: 乘 $1/\sqrt{c_I}$
    text: |
      $$\tilde{R}={{ Rs | matrix:3 }}$$
  - id: weights
    show: [Ww.T, wx]
    label: '$\of{wx}$'
    title: weights_proj：每个位置给每个 head 一个权重
    text: |
      权重从 indexer 的输入 $\of{x}$ 算出，可以是负数，它决定这个位置更相信哪几个 head 的打分。
      $$\of{wx}={{ wx | matrix:3 }}$$
  - id: weights_scale
    show: w
    label: '$\of{w}$'
    title: 权重乘 $1/\sqrt{H_I}$
    text: |
      $$\of{w}={{ w | matrix:3 }}$$
  - id: index_weight
    show: Rw
    label: '$\of{Rw}$'
    title: 每个 head 的分数乘上自己的权重
    text: |
      $$\of{Rw}={{ Rw | matrix:3 }}$$
  - id: index_sum
    show: I
    label: '$\of{I}$'
    title: 按 head 相加，得到 index score
    text: |
      $I_{t,w}$ 表示位置 $t$ 有多需要第 $w$ 个压缩条目。
      $$I_{t,w}=\sum_h w_{t,h}\,\tilde{R}_{t,h,w},\qquad \of{I}={{ I | matrix:3 }}$$
  - id: positions
    show: [position_ids, pos1]
    label: '$\of{pos1}$'
    title: 每个位置的编号加 1
    text: |
      <code>causal_threshold = (position_ids + 1) // self.compress_rate</code> 的第一步：$\of{position_ids}$ 是每个 token 的位置 $0,1,\dots,T-1$（没有缓存时 HF 的 <code>position_ids</code> 就是 <code>arange(T)</code>），先加 1，得到位置 $t$ 之前（含 $t$）一共有几个 token。
      $$\of{pos1}={{ pos1 | matrix:2 }}$$
  - id: threshold
    show: threshold
    label: '$\of{threshold}$'
    title: 每个位置能看到几个完整的条目
    text: |
      <code>// self.compress_rate</code>：再按 $m=\of{m}$ 向下取整。$\tau_t=\lfloor (t+1)/m\rfloor$ 是到位置 $t$ 为止已经压缩完的条目个数，编号小于 $\tau_t$ 的条目只包含不晚于 $t$ 的 token。
      $$\of{threshold}={{ threshold | matrix:2 }}$$
  - id: entries
    show: [entry_indices, entry_row]
    label: '$\of{entry_row}$'
    title: 压缩条目的编号排成一行
    text: |
      <code>entry_indices = torch.arange(compressed_len)</code>，再 <code>.view(1, 1, -1)</code>：条目编号 $0,1,\dots,\lfloor T/m\rfloor-1$ 排成一行，下一步和每个位置的 $\tau_t$ 逐个比较。图上没有 batch 维，view 成 $(1, \lfloor T/m\rfloor)$。
      $$\of{entry_row}={{ entry_row | matrix:2 }}$$
  - id: threshold_col
    show: threshold_col
    label: '$\of{threshold_col}$'
    title: 阈值排成一列
    text: |
      <code>causal_threshold.unsqueeze(-1)</code>：$\tau$ 排成一列，和上面那一行广播成 $T\times\lfloor T/m\rfloor$ 的表。
      $$\of{threshold_col}={{ threshold_col | matrix:2 }}$$
  - id: future_mask
    show: future_mask
    label: '$\of{future_mask}$'
    title: 标出还没压缩完的条目
    text: |
      <code>future_mask = entry_indices.view(1, 1, -1) &gt;= causal_threshold.unsqueeze(-1)</code>：第 $t$ 行第 $w$ 列在 $w\ge\tau_t$ 时是 true，表示第 $w$ 个条目包含位置 $t$ 之后的 token，位置 $t$ 不能选它。
      $$\of{future_mask}={{ future_mask | matrix:2 }}$$
  - id: future_fill
    show: Im
    label: '$\of{Im}$'
    title: 还没压缩完的条目记成 $-\infty$
    text: |
      <code>index_scores = index_scores.masked_fill(future_mask, float("-inf"))</code>：$\of{future_mask}$ 为 true 的分数换成 $-\infty$，其余保留。
      $$\of{Im}={{ Im | matrix:3 }}$$
  - id: topk
    show: top
    label: '$\of{top}$'
    title: 'top-$k_I$：每个位置选出 $k_I$ 个条目的编号'
    text: |
      <code>top_k = min(self.index_topk, compressed_len)</code>，然后 <code>top_k_indices = index_scores.topk(top_k, dim=-1).indices</code>：每一行取分数最高的 $\min(k_I, \lfloor T/m\rfloor)=\of{min(kI, T // m)}$ 个条目，返回它们的编号，按分数从大到小排。能选的条目不到这么多时（例如位置 0，一个完整的条目都没有），top-k 会选上 $-\infty$ 的条目。真实模型里 $k_I=512$。编号是整数，没有梯度。
      $$\of{top}={{ top | matrix:2 }}$$
  - id: invalid
    show: invalid
    label: '$\of{invalid}$'
    title: 标出选错的编号
    text: |
      <code>invalid = top_k_indices &gt;= causal_threshold.unsqueeze(-1)</code>：编号不小于 $\tau_t$ 的选择指向还没压缩完的条目，是 top-k 在可选条目不够时补上的。
      $$\of{invalid}={{ invalid | matrix:2 }}$$
  - id: invalid_fill
    show: idx
    label: '$\of{idx}$'
    title: 选错的编号换成 $-1$
    text: |
      <code>return torch.where(invalid, torch.full_like(top_k_indices, -1), top_k_indices)</code>：$\of{invalid}$ 为 true 的编号换成 $-1$，其余保留。图上写成 <code>masked_fill(top, invalid, -1)</code>，结果相同。indexer 的输出就是这些编号，mask 由 self_attn 用编号拼出来。
      $$\of{idx}={{ idx | matrix:2 }}$$
