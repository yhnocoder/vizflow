module: liger_cross_entropy_kernel
kernel: true
inputs:
  X: [N, V]
  Y: { type: tensor, shape: [N], dtype: int64 }
  n_non_ignore: { type: tensor, shape: [], dtype: int64 }
outputs:
  loss: { type: tensor, shape: [N], dtype: fp32 }
  X_grad: [N, V]

forward:
  - ori_X_y: X.gather(-1, Y.unsqueeze(-1)).squeeze(-1).float()
  - BLOCK_SIZE: min(32768, triton.next_power_of_2(V))
  - m: full([N], float('-inf'), dtype=fp32)
  - d: zeros(N, dtype=fp32)
  - for: i in range(0, V, BLOCK_SIZE)
    do:
      - X_block: X[:, i:min(i + BLOCK_SIZE, V)].float()
      - block_max: X_block.max(-1)
      - m_new: maximum(m, block_max)
      - d: d * 2 ** ((m - m_new) * math.log2(math.e)) + (2 ** ((X_block - m_new.unsqueeze(-1)) * math.log2(math.e))).sum(-1)
      - m: m_new
  - lse: m + d.log()
  - for: j in range(0, V, BLOCK_SIZE)
    do:
      - X_load: X[:, j:min(j + BLOCK_SIZE, V)].float()
      - softmax_X: 2 ** ((X_load - m.unsqueeze(-1)) * math.log2(math.e)) / d.unsqueeze(-1)
      - X_store: softmax_X / n_non_ignore
      - 'X[:, j:min(j + BLOCK_SIZE, V)]': X_store.to(X.dtype)
  - softmax_X_y: 2 ** ((ori_X_y - m) * math.log2(math.e)) / d
  - dx_y: (softmax_X_y - 1) / n_non_ignore
  - X_grad: X.scatter(-1, Y.unsqueeze(-1), dx_y.unsqueeze(-1).to(X.dtype))
  - loss: (lse - ori_X_y) / n_non_ignore

tex:
  X: 'X'
  Y: 'y'
  ori_X_y: 'x_y'
  m: 'm'
  d: 'd'
  X_block: 'X^{\mathrm{blk}}'
  block_max: 'm^{\mathrm{blk}}'
  m_new: 'm^{\mathrm{new}}'
  lse: '\mathrm{lse}'
  X_load: 'X^{\mathrm{blk}}'
  softmax_X: 'p'
  X_store: 'p/N'
  softmax_X_y: 'p_y'
  dx_y: '\frac{\partial\ell}{\partial x_y}'
  X_grad: '\frac{\partial\ell}{\partial X}'
  loss: '\ell_t'

fold:
  label: '$\viz{loss},\ \viz{X_grad}$'
  title: liger_cross_entropy_kernel
  text: |
    一次 kernel 读两遍 logits：第一遍求每行的 $\log\sum_v e^{X_v}$ 得到损失，第二遍把 logits 就地改写成损失对它的梯度。
    $$\viz{loss}={{ loss | matrix:3 }}$$

steps:
  - id: x_y
    show: ori_X_y
    label: '$\viz{ori_X_y}$'
    title: 取出目标 logit
    text: |
      <code>liger_cross_entropy_kernel</code> 的每个 Triton program 处理一行，也就是一个位置，所以这一块的 {{ N }} 行同时计算。先读出目标 token 那一格 $x_y$，转成 fp32。HF 的 <code>-100</code> 标签在这里直接返回、梯度置 0，这一页没有这样的位置。
      $$\viz{ori_X_y}={{ ori_X_y | matrix:3 }}$$
  - id: init
    show: [m, d]
    label: '$m,\ d$'
    title: 'online softmax 的初值'
    text: |
      $m$ 是已经读过的 logits 的最大值，初值 $-\infty$；$d$ 是 $\sum e^{X_v-m}$，初值 0。词表很大，一行放不进一个程序的寄存器，所以按 <code>BLOCK_SIZE</code> $=\min(32768,\ 2^{\lceil\log_2 V\rceil})={{ BLOCK_SIZE }}$ 列一块读。
  - id: online
    loop: i
    defaults:
      show: [X_block, block_max, m_new, d, m]
      label: '$\viz{m_new},\ \viz{d}$'
      title: '第一遍：第 {{ i }} 列起的一块'
      text: |
        读入第 {{ i }} 到 {{ min(i + BLOCK_SIZE, V) - 1 }} 列，转成 fp32。新的最大值 $m^{\mathrm{new}}=\max(m,\max_v X_v)$，旧的和要乘 $e^{m-m^{\mathrm{new}}}$ 换到新的最大值下，再加上这一块的指数和：
        $$d\leftarrow d\,e^{m-m^{\mathrm{new}}}+\sum_{v\in\text{块}}e^{X_v-m^{\mathrm{new}}},\qquad m\leftarrow m^{\mathrm{new}}$$
        $$\viz{d}={{ d | matrix:3 }}$$
  - id: lse
    show: lse
    label: '$\viz{lse}$'
    title: log-sum-exp
    text: |
      读完整行以后 $\mathrm{lse}=m+\log d=\log\sum_v e^{X_v}$，这一行的损失是 $\mathrm{lse}-x_y=-\log p_y$。
      $$\viz{lse}={{ lse | matrix:3 }}$$
  - id: grad
    loop: j
    defaults:
      show: [X_load, softmax_X, X_store, X]
      label: '$\viz{X_store}$'
      title: '第二遍：把第 {{ j }} 列起的一块改写成梯度'
      text: |
        前向时就已经知道损失对 logits 的梯度：对 mean 归约，$\frac{\partial\ell}{\partial X_v}=(p_v-[v=y])/N$，其中 $N$ 是不被忽略的位置数（这里是 {{ n_non_ignore }}）。第二遍再读一次这一块，算出 $p_v=e^{X_v-m}/d$，除以 $N$，转回 logits 的 dtype 写回原来的位置。logits 的缓冲区从此存的是梯度，不再需要另外分配 $N\times V$ 的空间。
        $$\viz{X_store}={{ X_store | matrix:3 }}$$
  - id: target
    show: [softmax_X_y, dx_y, X_grad]
    label: '$\viz{X_grad}$'
    title: 目标列减 $1/N$
    text: |
      目标那一格还要减去 one-hot 的 1：<code>X_y = (softmax_X_y - 1) / n_non_ignore</code>，单独写回 $X$ 的第 $y$ 列。
      $$\viz{X_grad}={{ X_grad | matrix:3 }}$$
  - id: loss
    show: loss
    label: '$\viz{loss}$'
    title: 每行的损失
    text: |
      每行的损失 $(\mathrm{lse}-x_y)/N$ 写进 fp32 的 <code>loss_ptr</code>，除以 $N$ 是 mean 归约，求和在 kernel 外面做。
      $$\viz{loss}={{ loss | matrix:3 }}$$
