module: NLLLoss
inputs:
  logp: { type: tensor, shape: [N, C], dtype: dtype }
  y: { type: tensor, shape: [N], dtype: int64 }
outputs:
  loss: { type: tensor, shape: [], dtype: dtype }
  lt: { type: tensor, shape: [N], dtype: dtype }
forward:
  - pick: logp.gather(-1, y.view(-1, 1)).view(-1)
  - lt: -pick
  - loss: lt.mean()
tex:
  pick: '\log p_{y}'
  lt: '\boldsymbol{\ell}'
  loss: '\ell'
formula: '\step{mean}{\viz{loss}=\frac{1}{N}\sum_{n}}\step{neg}{-}\step{pick}{\viz{logp}_{n,\,y_{n}}}'
fold:
  label: '$\viz{loss}$'
  title: nll_loss（已折叠）
  text: |
    按标签取格、取负、取平均收在盒子里，对应一次 <code>F.nll_loss(logp, y)</code>。
    $$\viz{loss}={{ loss | matrix:3 }}$$
  backward:
    label: '$\partial\viz{logp}$'
    title: 穿过 nll_loss（已折叠）
    text: |
      每一行只有标签那一格收到 $-1/N$，其余是 0。
      $$\frac{\partial\ell}{\partial\viz{logp}}={{ logp.grad | matrix:3 }}$$

steps:
  - id: pick
    label: '$\viz{pick}$'
    title: nll_loss：按标签取格
    text: |
      <code>F.nll_loss(logp, y)</code> 对每一行 $n$ 算 $-\log p_{n,y_n}$，默认 <code>reduction='mean'</code> 再取平均。它是一个 kernel，这里拆成三步：按标签取格、取负、取平均。第一步每一行按自己的标签取出一格，写成 PyTorch 就是 <code>logp.gather(-1, y.view(-1, 1))</code>，每一行只有标签那一格有连线。
      $$\viz{pick}={{ pick | matrix:3 }}$$
    backward:
      label: '$\partial\viz{logp}$'
      title: nll_loss：穿过取格
      text: |
        取格的反向把梯度放回被取到的那一格，同一行的其他格是 0。
        $$\frac{\partial\ell}{\partial\viz{logp}}={{ logp.grad | matrix:3 }}$$
  - id: neg
    show: lt
    label: '$\viz{lt}$'
    title: nll_loss：取负
    text: |
      取负号得到每个位置的损失 $\ell_n=-\log p_{n,y_n}$。目标 token 的概率越小，这一项越大。
      $$\viz{lt}={{ lt | matrix:3 }}$$
    backward:
      label: '$\partial\viz{pick}$'
      title: nll_loss：穿过取负
      text: |
        局部导数是 $-1$。
        $$\frac{\partial\ell}{\partial\viz{pick}}={{ pick.grad | matrix:3 }}$$
  - id: mean
    show: loss
    label: '$\viz{loss}$'
    title: nll_loss：取平均
    text: |
      对 $N$ 个位置取平均。<code>F.nll_loss</code> 的平均只算标签不等于 <code>ignore_index</code>（默认 $-100$）的位置，这一页没有被忽略的标签，所以分母就是 $N$。
      $$\viz{loss}=\frac{1}{N}\sum_n\ell_n={{ loss | matrix:3 }}$$
    backward:
      label: '$\partial\viz{lt}$'
      title: 从损失出发
      text: |
        平均值把梯度 $1/N$ 分给每个位置。
        $$\frac{\partial\ell}{\partial\viz{lt}}={{ lt.grad | matrix:3 }}$$
