module: NLLLoss
inputs:
  logp: { type: tensor, shape: [N, C], dtype: dtype }
  y: { type: tensor, shape: [N], dtype: int64 }
outputs:
  loss: { type: tensor, shape: [], dtype: dtype }
  lt: { type: tensor, shape: [N], dtype: dtype }
forward:
  - pick: logp.gather(-1, y.view(-1, 1)).view(-1)
  - lt: -pick
  - loss: lt.mean()
tex:
  pick: '\log p_{y}'
  lt: '\boldsymbol{\ell}'
  loss: '\ell'
formula: '\step{mean}{\viz{loss}=\frac{1}{N}\sum_{n}}\step{neg}{-}\step{pick}{\viz{logp}_{n,\,y_{n}}}'
fold:
  label: '$\viz{loss}$'
  title: nll_loss
  text: |
    $$\viz{loss}={{ loss | matrix:3 }}$$
  backward:
    label: '$\partial\viz{logp}$'
    title: '$\frac{\partial\ell}{\partial \viz{logp}}$'
    text: |
      每一行只有标签那一格收到 $-1/N$，其余为 0。
      $$\frac{\partial\ell}{\partial \viz{logp}}={{ logp.grad | matrix:3 }}$$

steps:
  - id: pick
    label: '$\viz{pick}$'
    title: nll_loss：按标签取格
    text: |
      <code>F.nll_loss(logp, y)</code> 对每一行 $n$ 算 $-\log p_{n,y_n}$，默认 <code>reduction='mean'</code> 再取平均。第一步每一行按自己的标签取出一格，相当于 <code>logp.gather(-1, y.view(-1, 1))</code>。
      $$\viz{pick}={{ pick | matrix:3 }}$$
    backward:
      label: '$\partial\viz{logp}$'
      title: '$\frac{\partial\ell}{\partial \viz{logp}}$'
      text: |
        取格的反向把梯度放回被取到的那一格，同一行的其他格为 0。
        $$\frac{\partial\ell}{\partial \viz{logp}}={{ logp.grad | matrix:3 }}$$
  - id: neg
    show: lt
    label: '$\viz{lt}$'
    title: nll_loss：取负
    text: |
      $\ell_n=-\log p_{n,y_n}$。$p=1$ 时为 0，$p\to0$ 时趋于无穷，所以预测目标的概率越小，这一项越大。它也是目标分布（one-hot）与预测分布的交叉熵。
      $$\viz{lt}={{ lt | matrix:3 }}$$
    backward:
      label: '$\partial\viz{pick}$'
      title: '$\frac{\partial\ell}{\partial \viz{pick}}$'
      text: |
        局部导数是 $-1$。
        $$\frac{\partial\ell}{\partial \viz{pick}}={{ pick.grad | matrix:3 }}$$
  - id: mean
    show: loss
    label: '$\viz{loss}$'
    title: nll_loss：取平均
    text: |
      $\ell=\frac1N\sum_n\ell_n$。<code>F.nll_loss</code> 的平均只计入标签不等于 <code>ignore_index</code>（默认 $-100$）的位置，没有被忽略的标签时分母就是 $N$。
      $$\viz{loss}={{ loss | matrix:3 }}$$
    backward:
      label: '$\partial\viz{lt}$'
      title: 从损失出发
      text: |
        反向从 $\frac{\partial\ell}{\partial \ell}=1$ 开始。平均的局部导数是 $1/N$，每个位置拿到 $1/N$。
        $$\frac{\partial\ell}{\partial \viz{lt}}={{ lt.grad | matrix:3 }}$$
