module: SiLU
kernel: true
import:
  Sigmoid: vizflow/nn/sigmoid
inputs:
  x: { type: tensor, shape: ['...'], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...'], dtype: dtype }
init:
  sigmoid: Sigmoid
forward:
  - s: sigmoid(x)
  - out: x * s
tex:
  s: '\sigma(\viz{x})'
  out: '\operatorname{SiLU}(\viz{x})'
formula: '\step{mul}{\viz{out}=\viz{x}\odot}\step{sigmoid.*}{\sigma(\viz{x})}'
fold:
  label: '$\viz{out}$'
  title: SiLU
  text: |
    $$\operatorname{SiLU}(\viz{x})={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\viz{x}$'
    title: '$\frac{\partial\ell}{\partial \viz{x}}$'
    text: |
      $$\frac{\partial\ell}{\partial \viz{x}}=\frac{\partial\ell}{\partial \viz{out}}\odot\sigma(\viz{x})\big(1+\viz{x}(1-\sigma(\viz{x}))\big)={{ x.grad | matrix:3 }}$$

steps:
  - id: sigmoid
    subtitle: sigmoid
    edit:
      neg:
        text: |
          $\operatorname{SiLU}(x)=x\,\sigma(x)$。$x$ 很大时 $\sigma(x)\to1$，输出接近 $x$；$x$ 很小时 $\sigma(x)\to0$，输出接近 0；中间平滑过渡，最小值约 $-0.28$，在 $x\approx-1.28$ 处取得。先算 $\sigma(x)$，再乘回 $x$。算 $\sigma(x)$ 的第一步是取负。
          $$\viz{sigmoid.n}={{ sigmoid.n | matrix:3 }}$$
  - id: mul
    show: out
    label: '$\viz{x}\odot\sigma$'
    title: SiLU：乘回输入
    text: |
      $\sigma(x)$ 与 $x$ 逐元素相乘。$\viz{x}$ 因此有两条出边，一条进 sigmoid，一条直接进这个乘法。
      $$\operatorname{SiLU}(\viz{x})=\viz{x}\odot\viz{s}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x},\ \partial\viz{s}$'
      title: '$\frac{\partial\ell}{\partial \viz{x}},\ \frac{\partial\ell}{\partial \viz{s}}$'
      text: |
        直连那条拿到 $\frac{\partial\ell}{\partial \viz{out}}\odot\viz{s}$，$\viz{s}$ 拿到 $\frac{\partial\ell}{\partial \viz{out}}\odot\viz{x}$。sigmoid 那一路传回来以后在 $\viz{x}$ 上相加，合起来的局部导数是 $\sigma(x)+x\,\sigma(x)(1-\sigma(x))$。
        $$\frac{\partial\ell}{\partial \viz{s}}={{ s.grad | matrix:3 }}$$
