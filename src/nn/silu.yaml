module: SiLU
import:
  Sigmoid: vizflow/nn/sigmoid
inputs:
  x: { type: tensor, shape: ['...'], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...'], dtype: dtype }
init:
  sigmoid: Sigmoid
forward:
  - s: sigmoid(x)
  - out: x * s
tex:
  s: '\sigma(\viz{x})'
  out: '\operatorname{SiLU}(\viz{x})'
formula: '\step{mul}{\viz{out}=\viz{x}\odot}\step{sigmoid.*}{\sigma(\viz{x})}'
fold:
  label: '$\viz{out}$'
  title: SiLU（已折叠）
  text: |
    sigmoid 和乘法收在盒子里，对应一次 <code>F.silu</code>。逐元素计算，每个输出只连到同一位置的输入。
    $$\viz{out}=\operatorname{SiLU}(\viz{x})={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\viz{x}$'
    title: 穿过 SiLU（已折叠）
    text: |
      两条路的梯度相加，合起来是 $\sigma(x)\big(1+x(1-\sigma(x))\big)$。
      $$\frac{\partial\ell}{\partial\viz{x}}={{ x.grad | matrix:3 }}$$

steps:
  - id: sigmoid
    subtitle: sigmoid
    steps:
      neg:
        text: |
          SiLU 的定义是 $\operatorname{SiLU}(x)=x\,\sigma(x)$，其中 $\sigma(x)=\dfrac{1}{1+e^{-x}}$。<code>F.silu</code> 是一个逐元素 kernel，这里按定义拆开画：先用取负、取 exp、加 1、取倒数四步算出 $\sigma(x)$，再和输入逐元素相乘。第一步给每个元素取负号。
          $$\viz{sigmoid.n}={{ sigmoid.n | matrix:3 }}$$
  - id: mul
    show: out
    label: '$\viz{x}\odot\sigma$'
    title: SiLU：乘回输入
    text: |
      $\sigma(x)$ 和输入逐元素相乘。输入 $\viz{x}$ 因此有两条出边，一条进 sigmoid，一条直接进这个乘法。正数基本原样通过，负数被压到接近 0。
      $$\viz{out}=\viz{x}\odot\viz{s}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x},\ \partial\viz{s}$'
      title: SiLU：穿过乘法
      text: |
        逐元素乘的两个输入互为对方的局部导数：$\viz{x}$ 的直连那条拿到 $\frac{\partial\ell}{\partial\viz{out}}\odot\viz{s}$，$\viz{s}$ 拿到 $\frac{\partial\ell}{\partial\viz{out}}\odot\viz{x}$。直连那条要等 sigmoid 那条传回来以后，在 $\viz{x}$ 上相加。
        $$\frac{\partial\ell}{\partial\viz{s}}={{ s.grad | matrix:3 }}$$
