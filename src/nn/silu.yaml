module: SiLU
subtitle: SiLU
formula: '\step{mul}{\of{out}=\of{x}\odot}\step{sigmoid.*}{\sigma(\of{x})}'
import:
  Sigmoid: vizflow/nn/sigmoid
params:
  name: { type: text, default_key: true }
inputs:
  x: { shape: [...] }
outputs: [out]
fold:
  label: '$\of{out}$'
  title: \of{name}（已折叠）
  text: |
    sigmoid 和乘法收在盒子里，对应一次 <code>F.silu</code>。逐元素计算，每个输出只连到同一位置的输入。
    $$\of{out}=\operatorname{SiLU}(\of{x})={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\of{x}$'
    title: 穿过 \of{name}（已折叠）
    text: |
      两条路的梯度相加，合起来是 $\sigma(x)\big(1+x(1-\sigma(x))\big)$。
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - sigmoid:
      use: Sigmoid
      inputs: { x: x }
      outputs: { out: s }
      steps:
        neg:
          text: |
            SiLU 的定义是 $\operatorname{SiLU}(x)=x\,\sigma(x)$，其中 $\sigma(x)=\dfrac{1}{1+e^{-x}}$。<code>F.silu</code> 是一个逐元素 kernel，这里按定义拆开画：先用取负、取 exp、加 1、取倒数四步算出 $\sigma(x)$，再和输入逐元素相乘。第一步给每个元素取负号。
            $$\of{sigmoid.n}={{ sigmoid.n | matrix:3 }}$$
  - out: { op: x * s, tex: '\operatorname{SiLU}(\of{x})' }
steps:
  - id: mul
    show: out
    label: '$\of{x}\odot\sigma$'
    title: \of{name}：乘回输入
    text: |
      $\sigma(x)$ 和输入逐元素相乘。输入 $\of{x}$ 因此有两条出边，一条进 sigmoid，一条直接进这个乘法。正数基本原样通过，负数被压到接近 0。
      $$\of{out}=\of{x}\odot\of{s}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial\of{x},\ \partial\of{s}$'
      title: \of{name}：穿过乘法
      text: |
        逐元素乘的两个输入互为对方的局部导数：$\of{x}$ 的直连那条拿到 $\frac{\partial\ell}{\partial\of{out}}\odot\of{s}$，$\of{s}$ 拿到 $\frac{\partial\ell}{\partial\of{out}}\odot\of{x}$。直连那条要等 sigmoid 那条传回来以后，在 $\of{x}$ 上相加。
        $$\frac{\partial\ell}{\partial\of{s}}={{ s.grad | matrix:3 }}$$
