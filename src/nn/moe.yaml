module: SparseMoE
subtitle: 稀疏 MoE：softmax 路由，选 top-k 个专家
import:
  Experts: vizflow/nn/experts
params:
  E:  { type: dim }
  K:  { type: dim }
  mf: { type: dim }
inputs:
  x: { shape: [T, d] }
outputs: [out]
weights:
  Wr: { shape: [E, d], tex: 'W_{r}' }
fold:
  label: '$\of{out}=\mathrm{moe}(\of{x})$'
  title: 稀疏 MoE（已折叠）
  text: |
    路由和 \of{E} 个专家都收进了盒子。每个位置只经过 $K=\of{K}$ 个专家，位置之间互不影响。
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过稀疏 MoE（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - gate:
      title: gate
      subtitle: TopKRouter
      body:
        - logits: { op: x @ Wr.T, tex: '\mathbf{r}' }
        - p: { op: 'softmax(logits, -1)', tex: '\mathbf{p}', dtype: fp32 }
        - idx: { op: 'topk_indices(p, K, -1)', tex: '\mathbf{i}' }
        - top: { op: 'gather(p, -1, idx)', tex: '\mathbf{p}^{\mathrm{top}}' }
        - den: { op: 'sum(top, -1, keepdim=true)', tex: '\textstyle\sum\mathbf{p}^{\mathrm{top}}' }
        - rw: { op: top / den, tex: '\bar{\mathbf{p}}^{\mathrm{top}}', dtype: logits }
  - experts:
      use: Experts
      params: { E: E, mf: mf }
      inputs: { x: x, idx: idx, w: rw }
      outputs: { out: out }
      tex: { out: '\mathbf{moe}' }
steps:
  - id: router
    show: [Wr.T, logits]
    label: '$\of{logits}=\of{x}W_r^{\top}$'
    title: router 的分数
    text: |
      <code>router_logits = F.linear(hidden_states, self.weight)</code>。gate 的权重 $W_r$ 形状是 $(E, d)$，每行对应一个专家，$\of{x}W_r^{\top}$ 给每个位置、每个专家一个分数。
      $$\of{logits}={{ logits | matrix:3 }}$$
    backward:
      label: '$\partial W_r,\ \partial\of{x}$'
      title: 传到 gate 的权重和 $\of{x}$
      text: |
        $$\frac{\partial\ell}{\partial\of{logits}}={{ logits.grad | matrix:3 }}$$
  - id: softmax
    show: p
    label: '$\of{p}=\operatorname{softmax}(\of{logits})$'
    title: 每个专家一个概率
    text: |
      <code>router_probs = softmax(router_logits, dtype=torch.float, dim=-1)</code>，在 float32 里把一行分数变成 \of{E} 个专家上的概率。
      $$\of{p}={{ p | matrix:3 }}$$
    backward:
      label: '$\partial\of{logits}$'
      title: 穿过 softmax
      text: |
        softmax 让一行里的概率互相影响，没被选中的专家的分数也通过归一化拿到梯度。
        $$\frac{\partial\ell}{\partial\of{p}}={{ p.grad | matrix:3 }}$$
  - id: topk
    show: [idx, top]
    label: '$\of{idx},\ \of{top}$'
    title: 'top-$\of{K}$：选出 $K$ 个专家'
    text: |
      <code>router_top_value, router_indices = torch.topk(router_probs, self.top_k, dim=-1)</code>。每个位置按概率从大到小选 $K=\of{K}$ 个专家，$\of{idx}$ 是它们的编号（从 0 开始），$\of{top}$ 是对应的概率。topk 一次给出两样，图上先画编号（topk_indices），再按编号从 $\of{p}$ 里取出概率（gather），取出的值和 topk 的值相同。编号没有梯度，梯度只通过取出的概率传回 $\of{p}$。
      $$\of{idx}={{ idx | matrix }},\qquad \of{top}={{ top | matrix:3 }}$$
    backward:
      label: '$\partial\of{p}$'
      title: 传回选中的概率
      text: |
        gather 的反向把梯度放回被选中的那 $K$ 个概率，没选中的专家在这一步拿到 0。
        $$\frac{\partial\ell}{\partial\of{p}}={{ p.grad | matrix:3 }}$$
  - id: normalize
    show: [den, rw]
    label: '$\of{rw}$'
    title: 归一化成路由权重
    text: |
      <code>norm_topk_prob = True</code>：<code>router_top_value /= router_top_value.sum(dim=-1, keepdim=True)</code>，选中的 $K$ 个概率除以它们的和，变成和为 1 的权重，再 <code>.to(router_logits.dtype)</code> 转回分数的 dtype。
      $$\of{rw}=\frac{\of{top}}{\sum\of{top}}={{ rw | matrix:3 }}$$
    backward:
      label: '$\partial\of{top}$'
      title: 穿过归一化
      text: |
        $$\frac{\partial\ell}{\partial\of{top}}={{ top.grad | matrix:3 }}$$
