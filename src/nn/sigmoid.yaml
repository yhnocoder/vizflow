module: Sigmoid
inputs:
  x: { type: tensor, shape: ['...'], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...'], dtype: dtype }
forward:
  - n: -x
  - e: n.exp()
  - d: e + 1
  - out: d.reciprocal()
tex:
  n: '-\viz{x}'
  e: 'e^{-\viz{x}}'
  d: '1+e^{-\viz{x}}'
  out: '\sigma(\viz{x})'
formula: '\step{recip}{\viz{out}=\frac{1}{\step{add}{1+}\step{exp}{e^{\step{neg}{-\viz{x}}}}}}'
fold:
  label: '$\viz{out}$'
  title: sigmoid
  text: |
    $$\sigma(\viz{x})={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\viz{x}$'
    title: '$\frac{\partial\ell}{\partial \viz{x}}$'
    text: |
      $$\frac{\partial\ell}{\partial \viz{x}}=\frac{\partial\ell}{\partial \viz{out}}\odot\sigma(\viz{x})\big(1-\sigma(\viz{x})\big)={{ x.grad | matrix:3 }}$$

steps:
  - id: neg
    show: n
    label: '$-\viz{x}$'
    title: sigmoid：取负
    text: |
      $\sigma(x)=\dfrac{1}{1+e^{-x}}$，把实数压到 $(0,1)$，$\sigma(0)=\tfrac12$。按定义依次是取负、取 exp、加 1、取倒数。第一步取负。
      $$\viz{n}={{ n | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x}$'
      title: '$\frac{\partial\ell}{\partial \viz{x}}$'
      text: |
        局部导数是 $-1$。四步的局部导数相乘，结果是 $\sigma(x)(1-\sigma(x))$，最大值 $\tfrac14$ 在 $x=0$ 处取得。
        $$\frac{\partial\ell}{\partial \viz{x}}={{ x.grad | matrix:3 }}$$
  - id: exp
    show: e
    label: '$\viz{e}$'
    title: sigmoid：取 exp
    text: |
      $$\viz{e}=e^{-\viz{x}}={{ e | matrix:3 }}$$
    backward:
      label: '$\partial\viz{n}$'
      title: '$\frac{\partial\ell}{\partial \viz{n}}$'
      text: |
        exp 的导数是它自己，局部导数是这一格的 $e^{-x}$。
        $$\frac{\partial\ell}{\partial \viz{n}}={{ n.grad | matrix:3 }}$$
  - id: add
    show: d
    label: '$\viz{d}$'
    title: sigmoid：加 1
    text: |
      $$\viz{d}=1+e^{-\viz{x}}={{ d | matrix:3 }}$$
    backward:
      label: '$\partial\viz{e}$'
      title: '$\frac{\partial\ell}{\partial \viz{e}}$'
      text: |
        加常数的局部导数是 1。
        $$\frac{\partial\ell}{\partial \viz{e}}={{ e.grad | matrix:3 }}$$
  - id: recip
    show: out
    label: '$\viz{out}$'
    title: sigmoid：取倒数
    text: |
      分母大于 1，取倒数后每个值在 0 和 1 之间。
      $$\sigma(\viz{x})=\frac{1}{\viz{d}}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial\viz{d}$'
      title: '$\frac{\partial\ell}{\partial \viz{d}}$'
      text: |
        $\frac{d}{dv}v^{-1}=-v^{-2}$，局部导数是 $-\sigma^{2}$。
        $$\frac{\partial\ell}{\partial \viz{d}}={{ d.grad | matrix:3 }}$$
