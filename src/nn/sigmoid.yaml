module: Sigmoid
inputs:
  x: { type: tensor, shape: ['...'], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...'], dtype: dtype }
forward:
  - n: -x
  - e: n.exp()
  - d: e + 1
  - out: d.reciprocal()
tex:
  n: '-\viz{x}'
  e: 'e^{-\viz{x}}'
  d: '1+e^{-\viz{x}}'
  out: '\sigma(\viz{x})'
formula: '\step{recip}{\viz{out}=\frac{1}{\step{add}{1+}\step{exp}{e^{\step{neg}{-\viz{x}}}}}}'
fold:
  label: '$\viz{out}$'
  title: sigmoid（已折叠）
  text: |
    取负、取 exp、加 1、取倒数收在盒子里，对应一次 <code>torch.sigmoid</code>。逐元素计算，每个输出只连到同一位置的输入。
    $$\viz{out}=\sigma(\viz{x})={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\viz{x}$'
    title: 穿过 sigmoid（已折叠）
    text: |
      四段局部导数相乘，合起来是 $\sigma(x)\big(1-\sigma(x)\big)$。
      $$\frac{\partial\ell}{\partial\viz{x}}={{ x.grad | matrix:3 }}$$

steps:
  - id: neg
    show: n
    label: '$\viz{n}$'
    title: sigmoid：取负
    text: |
      sigmoid 的定义是 $\sigma(x)=\dfrac{1}{1+e^{-x}}$。<code>torch.sigmoid</code> 是一个逐元素 kernel，这里按定义拆成四步：取负、取 exp、加 1、取倒数。第一步给每个元素取负号。
      $$\viz{n}={{ n | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x}$'
      title: sigmoid：穿过取负
      text: |
        取负的局部导数是 $-1$，梯度变号后交给 $\viz{x}$。
        $$\frac{\partial\ell}{\partial\viz{x}}={{ x.grad | matrix:3 }}$$
  - id: exp
    show: e
    label: '$\viz{e}$'
    title: sigmoid：取 exp
    text: |
      $$\viz{e}={{ e | matrix:3 }}$$
    backward:
      label: '$\partial(\viz{n})$'
      title: sigmoid：穿过 exp
      text: |
        exp 的导数是它自己，局部导数就是这一格的 $e^{-x}$。
        $$\frac{\partial\ell}{\partial(\viz{n})}={{ n.grad | matrix:3 }}$$
  - id: add
    show: d
    label: '$\viz{d}$'
    title: sigmoid：加 1
    text: |
      $$\viz{d}={{ d | matrix:3 }}$$
    backward:
      label: '$\partial\viz{e}$'
      title: sigmoid：穿过加 1
      text: |
        加常数的局部导数是 1，梯度原样传下去。
        $$\frac{\partial\ell}{\partial\viz{e}}={{ e.grad | matrix:3 }}$$
  - id: recip
    show: out
    label: '$\viz{out}$'
    title: sigmoid：取倒数
    text: |
      取倒数得到 $\sigma(x)$，每个值都在 0 和 1 之间。
      $$\viz{out}=\frac{1}{\viz{d}}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial(\viz{d})$'
      title: sigmoid：穿过取倒数
      text: |
        $\frac{d}{dv}\frac{1}{v}=-\frac{1}{v^{2}}$，所以局部导数是 $-\sigma^{2}$。
        $$\frac{\partial\ell}{\partial(\viz{d})}={{ d.grad | matrix:3 }}$$
