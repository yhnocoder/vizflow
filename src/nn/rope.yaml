module: RoPE
inputs:
  q: { type: tensor, shape: [num_heads, T, d_head], dtype: dtype }
  k: { type: tensor, shape: [num_kv_heads, T, d_head], dtype: dtype }
  cos: { type: tensor, shape: [T, d_head], dtype: dtype }
  sin: { type: tensor, shape: [T, d_head], dtype: dtype }
outputs:
  q_embed: { type: tensor, shape: [num_heads, T, d_head], dtype: dtype }
  k_embed: { type: tensor, shape: [num_kv_heads, T, d_head], dtype: dtype }
forward:
  - qc: q * cos
  - kc: k * cos
  - q1: 'q[..., : d_head // 2]'
  - q2: 'q[..., d_head // 2 :]'
  - k1: 'k[..., : d_head // 2]'
  - k2: 'k[..., d_head // 2 :]'
  - nq2: -q2
  - nk2: -k2
  - qrh: cat([nq2, q1], dim=-1)
  - krh: cat([nk2, k1], dim=-1)
  - qs: qrh * sin
  - ks: krh * sin
  - q_embed: qc + qs
  - k_embed: kc + ks
tex:
  qc: '\viz{q}\odot\viz{cos}'
  kc: '\viz{k}\odot\viz{cos}'
  q1: '{\viz{q}}_{1}'
  q2: '{\viz{q}}_{2}'
  k1: '{\viz{k}}_{1}'
  k2: '{\viz{k}}_{2}'
  nq2: '-{\viz{q}}_{2}'
  nk2: '-{\viz{k}}_{2}'
  qrh: '\mathrm{rh}(\viz{q})'
  krh: '\mathrm{rh}(\viz{k})'
  qs: '\mathrm{rh}(\viz{q})\odot\viz{sin}'
  ks: '\mathrm{rh}(\viz{k})\odot\viz{sin}'
formula: '\step{add}{\viz{q_embed}=}\step{cos}{\viz{q}\odot\viz{cos}}\step{add}{+}\step{sin}{\step{rh}{\operatorname{cat}\big(}\step{neg}{-}\step{half}{{\viz{q}}_{2}}\step{rh}{,}\step{half}{{\viz{q}}_{1}}\step{rh}{\big)}\odot\viz{sin}}'
fold:
  label: '$\viz{q_embed},\ \viz{k_embed}$'
  title: RoPE（已折叠）
  text: |
    这几步合成一个旋转：每个 head 里的第 $c$ 和第 $c+{{ d_head // 2 }}$ 个分量组成一对，转过角度 $t\,\omega_c$。Jacobian 是一个个 $2\times2$ 的旋转矩阵。
  backward:
    label: '$\partial\viz{q},\ \partial\viz{k}$'
    title: 穿过 RoPE（已折叠）
    text: |
      旋转矩阵的转置就是它的逆，反向把梯度转回 $-t\,\omega_c$。
      $$\frac{\partial\ell}{\partial\viz{q}}={{ q.grad | matrix:3 }}$$

steps:
  - id: cos
    show: [qc, kc]
    label: '$\odot\viz{cos}$'
    title: 乘 cos
    text: |
      <code>q_embed = (q * cos) + (rotate_half(q) * sin)</code>，k 也一样。这里按代码的顺序一行一步画出来，rotate_half 也拆成切两半、后半取负、拼回三步。q 有 {{ num_heads }} 个 head，k 有 {{ num_kv_heads }} 个 head，每个 head 宽 $d_h={{ d_head }}$，所有 head 用同一张 cos/sin 表。HF 先把 cos、sin 在 head 维上 <code>unsqueeze</code>，这里没有 batch 维，按广播直接相乘。cos 和 sin 是常量，不需要梯度，所以连线只在前向画出。
      $$\viz{qc}={{ qc | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q},\ \partial\viz{k}$'
      title: 穿过乘 cos，传到 $\viz{q}$ 和 $\viz{k}$
  - id: half
    show: [q1, q2, k1, k2]
    label: '$\viz{q1},\ \viz{q2}$'
    title: rotate_half：切成两半
    text: |
      HF 的 <code>rotate_half(x)</code> 有三行：<code>x1 = x[..., : x.shape[-1] // 2]</code>、<code>x2 = x[..., x.shape[-1] // 2 :]</code>、<code>return torch.cat((-x2, x1), dim=-1)</code>。这里一行画一步。第一步把每个 head 的 $d_h={{ d_head }}$ 列切成前后两半，切片只是取出元素，局部导数是 1。
      $$\viz{q1}={{ q1 | matrix:2 }},\qquad \viz{q2}={{ q2 | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q},\ \partial\viz{k}$（rotate_half）'
      title: 两半拼回原来的位置
      text: 切片的反向把梯度放回被切出的那几列。
  - id: neg
    show: [nq2, nk2]
    label: '$\viz{nq2}$'
    title: rotate_half：后半取负
    text: |
      后半段每个元素取负号。
      $$\viz{nq2}={{ nq2 | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q2},\ \partial\viz{k2}$'
      title: 穿过取负
      text: 局部导数是 $-1$。
  - id: rh
    show: [qrh, krh]
    label: rotate_half
    title: rotate_half：交换位置拼回去
    text: |
      取负的后半段放到前面，前半段放到后面，拼回 $d_h$ 列。拼接只是搬动元素，局部导数是 1，每个元素只连一条线。合起来 $\mathrm{rotate\_half}(x_1,x_2,x_3,x_4)=(-x_3,-x_4,x_1,x_2)$。
      $$\viz{qrh}={{ qrh | matrix:2 }}$$
    backward:
      label: '$\partial(\viz{nq2}),\ \partial\viz{q1}$'
      title: 穿过拼接
      text: 拼接的反向把梯度按列切回两段。
  - id: sin
    show: [qs, ks]
    label: '$\odot\viz{sin}$'
    title: 乘 sin
    text: |
      位置 0 的 sin 全是 0，所以第一行在这一步全部变成 0。
      $$\viz{qs}={{ qs | matrix:2 }}$$
    backward:
      label: '$\partial\,\mathrm{rh}$'
      title: 穿过乘 sin
  - id: add
    show: [q_embed, k_embed]
    label: '$\viz{q_embed},\ \viz{k_embed}$'
    title: 相加
    text: 每个 head 里第 $c$ 个和第 $c+d_h/2$ 个分量组成一对，被一起转了角度 $t\,\omega_c$。两个向量转过的角度只取决于各自的位置，所以旋转后的点积只依赖位置差。
    backward:
      label: '$\partial(\cdot\cos),\ \partial(\cdot\sin)$'
      title: 穿过相加
