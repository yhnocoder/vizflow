module: RoPE
subtitle: RoPE
params:
  dh:    { type: dim }
  theta: { type: float, default: 1e4 }
inputs:
  q: { shape: [T, n] }
  k: { shape: [T, m] }
outputs: [q_embed, k_embed]
buffers:
  cos: { value: 'rope_cos(T, dh, theta)', tex: '\cos' }
  sin: { value: 'rope_sin(T, dh, theta)', tex: '\sin' }
fold:
  label: '$\of{q_embed},\ \of{k_embed}$'
  title: RoPE（已折叠）
  text: |
    四步合成一个旋转：每个 head 里的第 $c$ 和第 $c+\of{dh//2}$ 个分量组成一对，转过角度 $t\,\omega_c$。Jacobian 是一个个 $2\times2$ 的旋转矩阵。
  backward:
    label: '$\partial\of{q},\ \partial\of{k}$'
    title: 穿过 RoPE（已折叠）
    text: |
      旋转矩阵的转置就是它的逆，反向把梯度转回 $-t\,\omega_c$。
      $$\frac{\partial\ell}{\partial\of{q}}={{ q.grad | matrix:3 }}$$
body:
  - qc:  { op: 'tile_mul(q, cos)', tex: '\of{q}\odot\cos' }
  - kc:  { op: 'tile_mul(k, cos)', tex: '\of{k}\odot\cos' }
  - qrh: { op: 'rotate_half(q, size=dh)', tex: '\mathrm{rh}(\of{q})' }
  - krh: { op: 'rotate_half(k, size=dh)', tex: '\mathrm{rh}(\of{k})' }
  - qs:  { op: 'tile_mul(qrh, sin)', tex: '\mathrm{rh}(\of{q})\odot\sin' }
  - ks:  { op: 'tile_mul(krh, sin)', tex: '\mathrm{rh}(\of{k})\odot\sin' }
  - q_embed: qc + qs
  - k_embed: kc + ks
steps:
  - id: cos
    show: [cos, qc, kc]
    label: '$\odot\cos$'
    title: 乘 cos
    text: |
      RoPE 的公式是 $\of{q_embed}=\of{q}\odot\cos+\mathrm{rotate\_half}(\of{q})\odot\sin$，k 也一样，这里按代码的顺序拆成四步。q 和 k 的列按 head 分组，每组宽 $d_h=\of{dh}$，所有 head 用同一张 cos/sin 表。
      cos 和 sin 表的每一行对应一个位置，$\omega_i=\theta^{-2i/d_h}$，$\theta=\of{theta}$。位置 1 的角度是 0，cos 全是 1。cos 和 sin 是常量，不需要梯度，所以没有连线。
      $$\cos={{ cos | matrix:3 }}$$
    backward:
      label: '$\partial\of{q},\ \partial\of{k}$'
  - id: rh
    show: [qrh, krh]
    label: rotate_half
    title: rotate_half
    text: |
      把每个 head 的后半段取负号放到前面，前半段放到后面。它只是重新排列加取负号，所以局部导数是 $\pm1$，每个元素只连一条线。
      $$\mathrm{rotate\_half}(x_1,x_2,x_3,x_4)=(-x_3,-x_4,x_1,x_2)$$
    backward:
      label: '$\partial\of{q},\ \partial\of{k}$'
  - id: sin
    show: [sin, qs, ks]
    label: '$\odot\sin$'
    title: 乘 sin
    text: |
      位置 1 的 sin 全是 0，所以第一行在这一步全部变成 0。
      $$\sin={{ sin | matrix:3 }}$$
    backward:
      label: '$\partial\,\mathrm{rh}$'
  - id: add
    show: [q_embed, k_embed]
    label: '$\of{q_embed},\ \of{k_embed}$'
    title: 相加
    text: 每个 head 里第 $c$ 个和第 $c+d_h/2$ 个分量组成一对，被一起转了角度 $t\,\omega_c$。两个向量转过的角度只取决于各自的位置，所以旋转后的点积只依赖位置差。
    backward:
      label: '$\partial(\cdot\cos),\ \partial(\cdot\sin)$'
