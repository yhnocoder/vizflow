module: RoPE
inputs:
  q: { type: tensor, shape: [num_heads, T, d_head], dtype: dtype }
  k: { type: tensor, shape: [num_kv_heads, T, d_head], dtype: dtype }
  cos: { type: tensor, shape: [T, d_head], dtype: dtype }
  sin: { type: tensor, shape: [T, d_head], dtype: dtype }
outputs:
  q_embed: { type: tensor, shape: [num_heads, T, d_head], dtype: dtype }
  k_embed: { type: tensor, shape: [num_kv_heads, T, d_head], dtype: dtype }
forward:
  - qc: q * cos
  - kc: k * cos
  - q1: 'q[..., : d_head // 2]'
  - q2: 'q[..., d_head // 2 :]'
  - k1: 'k[..., : d_head // 2]'
  - k2: 'k[..., d_head // 2 :]'
  - nq2: -q2
  - nk2: -k2
  - qrh: cat([nq2, q1], dim=-1)
  - krh: cat([nk2, k1], dim=-1)
  - qs: qrh * sin
  - ks: krh * sin
  - q_embed: qc + qs
  - k_embed: kc + ks
layout:
  place:
    kc: { with: qc }
    q2: { with: q1 }
    k1: { with: q1 }
    k2: { with: q1 }
    nk2: { with: nq2 }
    krh: { with: qrh }
    ks: { with: qs }
    k_embed: { with: q_embed }
tex:
  qc: '\viz{q}\odot\viz{cos}'
  kc: '\viz{k}\odot\viz{cos}'
  q1: '{\viz{q}}_{1}'
  q2: '{\viz{q}}_{2}'
  k1: '{\viz{k}}_{1}'
  k2: '{\viz{k}}_{2}'
  nq2: '-{\viz{q}}_{2}'
  nk2: '-{\viz{k}}_{2}'
  qrh: '\mathrm{rh}(\viz{q})'
  krh: '\mathrm{rh}(\viz{k})'
  qs: '\mathrm{rh}(\viz{q})\odot\viz{sin}'
  ks: '\mathrm{rh}(\viz{k})\odot\viz{sin}'
formula: '\step{add}{\viz{q_embed}=}\step{cos}{\viz{q}\odot\viz{cos}}\step{add}{+}\step{sin}{\step{rh}{\operatorname{cat}\big(}\step{neg}{-}\step{half}{{\viz{q}}_{2}}\step{rh}{,}\step{half}{{\viz{q}}_{1}}\step{rh}{\big)}\odot\viz{sin}}'
fold:
  label: '$\viz{q_embed},\ \viz{k_embed}$'
  title: RoPE
  text: |
    乘 cos、rotate_half、乘 sin、相加合起来是一次旋转：每个 head 里第 $c$ 和第 $c+d_h/2$ 个分量转过 $t\,\omega_c$。所以 Jacobian 由 $2\times2$ 的旋转矩阵组成；位置 0 的角度是 0，那里的旋转矩阵是单位阵。
    $$\begin{pmatrix}q'_c\\ q'_{c+d_h/2}\end{pmatrix}=\begin{pmatrix}\cos t\omega_c & -\sin t\omega_c\\ \sin t\omega_c & \cos t\omega_c\end{pmatrix}\begin{pmatrix}q_c\\ q_{c+d_h/2}\end{pmatrix}$$
  backward:
    label: '$\partial\viz{q},\ \partial\viz{k}$'
    title: '$\frac{\partial\ell}{\partial \viz{q}},\ \frac{\partial\ell}{\partial \viz{k}}$'
    text: |
      旋转矩阵是正交矩阵，转置等于逆，所以反向乘转置就是把梯度转回 $-t\,\omega_c$。
      $$\frac{\partial\ell}{\partial \viz{q}}={{ q.grad | matrix:3 }}$$

steps:
  - id: cos
    show: [qc, kc]
    label: '$\odot\cos$'
    title: RoPE：乘 cos
    text: |
      <code>q_embed = (q * cos) + (rotate_half(q) * sin)</code>，k 相同。这一行的效果是把每个 head 里第 $c$ 和第 $c+d_h/2$ 个分量组成的一对转过角度 $t\,\omega_c$（推导见 section「RoPE：用旋转来编码位置」）。

      cos 的形状是 $T\times d_h$，q 是 $H\times T\times d_h$，按广播相乘，所以所有 head 用同一张表。cos、sin 是常量，没有梯度。
      $$\viz{qc}={{ qc | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q},\ \partial\viz{k}$'
      title: '$\frac{\partial\ell}{\partial \viz{q}},\ \frac{\partial\ell}{\partial \viz{k}}$'
      text: |
        直连的局部导数是 $\cos$。这一路和经过 rotate_half 的那一路在 $\viz{q}$ 上相加：
        $$\frac{\partial\ell}{\partial q_c}=g_c\cos t\omega_c+g_{c+d_h/2}\sin t\omega_c,\qquad \frac{\partial\ell}{\partial q_{c+d_h/2}}=g_{c+d_h/2}\cos t\omega_c-g_c\sin t\omega_c$$
        其中 $g=\frac{\partial\ell}{\partial \viz{q_embed}}$。这正是把 $(g_c,g_{c+d_h/2})$ 转过 $-t\,\omega_c$。
        $$\frac{\partial\ell}{\partial \viz{q}}={{ q.grad | matrix:3 }},\qquad \frac{\partial\ell}{\partial \viz{k}}={{ k.grad | matrix:3 }}$$
  - id: half
    show: [q1, q2, k1, k2]
    label: '$\viz{q1},\ \viz{q2}$'
    title: rotate_half：切成两半
    text: |
      <code>rotate_half</code> 的前两行：<code>x1 = x[..., : x.shape[-1] // 2]</code>、<code>x2 = x[..., x.shape[-1] // 2 :]</code>。HF 把第 $c$ 和第 $c+d_h/2$ 个分量配成一对，所以把每个 head 的 $d_h$ 列切成前后两半后，前半是每一对的第一个分量，后半是第二个分量。切片只取出元素，局部导数是 1。
      $$\viz{q1}={{ q1 | matrix:2 }},\qquad \viz{q2}={{ q2 | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q},\ \partial\viz{k}$（rotate_half）'
      title: '$\frac{\partial\ell}{\partial \viz{q}},\ \frac{\partial\ell}{\partial \viz{k}}$'
      text: 切片的反向把梯度放回被切出的列。
  - id: neg
    show: [nq2, nk2]
    label: '$-\viz{q2}$'
    title: rotate_half：后半取负
    text: |
      第三行 <code>torch.cat((-x2, x1), dim=-1)</code> 里的 <code>-x2</code>。
      $$-\viz{q2}={{ nq2 | matrix:2 }}$$
    backward:
      label: '$\partial\viz{q2},\ \partial\viz{k2}$'
      title: '$\frac{\partial\ell}{\partial \viz{q2}},\ \frac{\partial\ell}{\partial \viz{k2}}$'
      text: 局部导数是 $-1$，梯度变号。
  - id: rh
    show: [qrh, krh]
    label: rotate_half
    title: rotate_half：交换两半拼回
    text: |
      取负的后半放到前面，前半放到后面，拼回 $d_h$ 列：
      $$\mathrm{rh}(\mathbf{q})_c=-q_{c+d_h/2},\qquad \mathrm{rh}(\mathbf{q})_{c+d_h/2}=q_c$$
      对一对 $(q_c,q_{c+d_h/2})$ 来说，rotate_half 把它变成 $(-q_{c+d_h/2},q_c)$，这是把这一对转过 $90^\circ$。拼接只搬动元素，不改变数值。
      $$\mathrm{rh}(\viz{q})={{ qrh | matrix:2 }}$$
    backward:
      label: '$\partial(-\viz{q2}),\ \partial\viz{q1}$'
      title: '$\frac{\partial\ell}{\partial (-\viz{q2})},\ \frac{\partial\ell}{\partial \viz{q1}}$'
      text: |
        拼接的反向把梯度按列切回两段。连同取负一起看：$q_c$ 从 $\mathrm{rh}_{c+d_h/2}$ 拿到 $+1$ 倍，$q_{c+d_h/2}$ 从 $\mathrm{rh}_c$ 拿到 $-1$ 倍。
  - id: sin
    show: [qs, ks]
    label: '$\odot\sin$'
    title: RoPE：乘 sin
    text: |
      $\mathrm{rh}(\mathbf{q})$ 逐元素乘 sin。位置 $t=0$ 的角度是 0，$\sin 0=0$，所以第 0 行在这一步全为 0。又因为 $\cos 0=1$，乘 cos 那一项在第 0 行等于 q 本身，所以两项相加后，位置 0 的 q、k 保持不变。
      $$\mathrm{rh}(\viz{q})\odot\sin={{ qs | matrix:2 }}$$
    backward:
      label: '$\partial\,\mathrm{rh}$'
      title: '$\frac{\partial\ell}{\partial \mathrm{rh}}$'
      text: |
        局部导数是对应位置的 sin。
        $$\frac{\partial\ell}{\partial \mathrm{rh}(\viz{q})}={{ qrh.grad | matrix:3 }}$$
  - id: add
    show: [q_embed, k_embed]
    label: '$\viz{q_embed},\ \viz{k_embed}$'
    title: 相加：完成旋转
    text: |
      把两项相加，按一对分量写开：
      $$q'_c=q_c\cos t\omega_c-q_{c+d_h/2}\sin t\omega_c,\qquad q'_{c+d_h/2}=q_c\sin t\omega_c+q_{c+d_h/2}\cos t\omega_c$$
      这就是 $2\times2$ 旋转矩阵乘 $(q_c,q_{c+d_h/2})$。旋转矩阵满足 $R_t^{\top}R_s=R_{s-t}$，所以 $\mathbf{q}'_t\cdot\mathbf{k}'_s=\mathbf{q}_t^{\top}R_{s-t}\mathbf{k}_s$：分数里的位置只以差 $t-s$ 出现。
      $$\viz{q_embed}={{ q_embed | matrix:2 }},\qquad \viz{k_embed}={{ k_embed | matrix:2 }}$$
    backward:
      label: '$\partial(\cdot\cos),\ \partial(\cdot\sin)$'
      title: '$\frac{\partial\ell}{\partial (\cdot\cos)},\ \frac{\partial\ell}{\partial (\cdot\sin)}$'
      text: |
        相加的两个输入拿到同一份梯度。
        $$\frac{\partial\ell}{\partial \viz{q_embed}}={{ q_embed.grad | matrix:3 }}$$
