module: ZeroCenteredRMSNorm
subtitle: RMSNorm，权重以 0 为中心
params:
  eps:      { type: float, default: 1e-6 }
  name:     { type: text, default_key: true }
  intro:    { type: text, default: '' }
  out_note: { type: text, default: '' }
  in_note:  { type: text, default: '' }
inputs:
  x: { shape: [..., n] }
outputs: [out]
weights:
  weight: { shape: [n], init: zeros, tex: '\boldsymbol{\gamma}' }
fold:
  label: '$\of{out}$'
  title: \of{name}（已折叠）
  text: |
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial\of{weight},\ \partial\of{x}$'
    title: 穿过 \of{name}（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{weight}}={{ weight.grad | matrix:3 }}$$
body:
  - sq: { op: x ** 2, tex: '\of{x}^{2}', dtype: fp32 }
  - ms: { op: 'mean(sq, -1, keepdim=true)', tex: '\mathrm{ms}' }
  - r:  { op: 'rsqrt(ms, eps=eps)', tex: r }
  - xh: { op: x * r, tex: '\hat{\of{x}}' }
  - scale: { op: weight + 1, tex: '(1+\of{weight})', dtype: fp32 }
  - out: { op: xh * scale, dtype: x }
steps:
  - id: square
    show: sq
    label: '$\of{sq}$'
    title: \of{name}：逐元素平方
    text: |
      \of{intro}先把输入转成 float32 再平方，前三步和普通的 RMSNorm 相同。
      $$\of{sq}={{ sq | matrix:2 }}$$
    backward:
      label: '$\partial\of{x}$'
      title: 传到输入
      text: |
        平方这一路的局部导数是 $2x$。两条路相加以后，交给输入的那部分梯度和这一行的输入垂直，因为 RMSNorm 对整行的缩放不敏感。\of{in_note}
        $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
  - id: rms
    show: [ms, r]
    label: '$\of{ms},\ \of{r}$'
    title: 均方根的倒数
    text: |
      每一行对平方取平均得到 ms，加上 $\epsilon=\of{eps}$ 再取平方根的倒数，得到这一行的 $r$。每一行各算各的。
      $$\mathrm{ms}={{ ms | matrix:3 }},\qquad r={{ r | matrix:3 }}$$
    backward:
      label: '$\partial\of{ms},\ \partial\of{sq}$'
      title: 传到 ms 和平方
      text: |
        $\partial r/\partial\,\mathrm{ms}=-r^3/2$。平均值再把梯度均分给这一行的每个平方。
        $$\frac{\partial\ell}{\partial\,\mathrm{ms}}={{ ms.grad | matrix:3 }}$$
  - id: normalize
    show: xh
    label: '$\of{xh}$'
    title: 归一化
    text: |
      每个分量乘上自己那一行的 $r$。不减均值，也没有 bias。
      $$\of{xh}={{ xh | matrix:2 }}$$
    backward:
      label: '$\partial\of{r},\ \partial\of{x}$'
      title: 传到 r，以及输入的直连那条
      text: |
        $$\frac{\partial\ell}{\partial r}={{ r.grad | matrix:3 }}$$
  - id: scale
    show: [weight, scale, out]
    label: '$\of{out}$'
    title: 乘上 $\of{scale}$
    text: |
      和普通 RMSNorm 的区别在这一步：权重 $\of{weight}$ 初始化为 0，乘的是 $1+\of{weight}$，所以刚初始化时这一层就是纯粹的归一化。$\of{weight}$ 以 0 为中心，权重衰减把它拉向 0，对应的缩放 $1+\of{weight}$ 被拉向 1。乘法在 float32 里做，最后再转回输入的 dtype。\of{out_note}
      $$\of{out}=\of{xh}\odot\of{scale}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\of{weight},\ \partial\of{xh}$'
      title: 传到 $\of{weight}$ 和 $\of{xh}$
      text: |
        $1+\of{weight}$ 对 $\of{weight}$ 的导数是 1，所以 $\of{weight}$ 的梯度和普通 RMSNorm 一样，是把 $T$ 行的 $\frac{\partial\ell}{\partial\of{out}}\odot\of{xh}$ 加起来。
        $$\frac{\partial\ell}{\partial\of{weight}}={{ weight.grad | matrix:3 }}$$
