module: LogSoftmax
inputs:
  x: { type: tensor, shape: ['...', C], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...', C], dtype: dtype }
forward:
  - ex: x.exp()
  - S: ex.sum(-1, keepdim=True)
  - LSE: S.log()
  - out: x - LSE
tex:
  ex: 'e^{\viz{x}}'
  S: 'S'
  LSE: '\mathrm{LSE}'
  out: '\log\mathbf{p}'
formula: '\step{sub}{\viz{out}=\viz{x}-}\step{log}{\log}\step{sum}{\sum_{j}}\step{exp}{e^{x_{j}}}'
fold:
  label: '$\viz{out}$'
  title: log_softmax（已折叠）
  text: |
    取 exp、按行求和、取 log、相减收在盒子里，对应一次 <code>F.log_softmax(x, -1)</code>。每一行只和自己那一行有关。
    $$\viz{out}={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\viz{x}$'
    title: 穿过 log_softmax（已折叠）
    text: |
      两条路合起来，$\frac{\partial\ell}{\partial x_{i}}=g_{i}-p_{i}\sum_{j}g_{j}$，其中 $g=\partial\ell/\partial\viz{out}$，$p=e^{\viz{out}}$。
      $$\frac{\partial\ell}{\partial\viz{x}}={{ x.grad | matrix:3 }}$$

steps:
  - id: exp
    show: ex
    label: '$\viz{ex}$'
    title: log_softmax：取 exp
    text: |
      log_softmax 的定义是 $\log p_{i}=x_{i}-\log\sum_{j}e^{x_{j}}$，这里按定义拆成四步：取 exp、按行求和、取 log、相减。PyTorch 的 kernel 会先减去每一行的最大值 $m$ 再取 exp，算的是 $x_{i}-m-\log\sum_{j}e^{x_{j}-m}$，防止溢出；$m$ 在式子里正好抵消，结果和梯度都不变，这一页的数值也远不会溢出，所以按定义画。
      $$\viz{ex}={{ ex | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x}$'
      title: log_softmax：穿过 exp
      text: |
        exp 的导数是它自己。这一条和相减那一步的直连那条在 $\viz{x}$ 上相加。
        $$\frac{\partial\ell}{\partial\viz{x}}={{ x.grad | matrix:3 }}$$
  - id: sum
    show: S
    label: '$\viz{S}$'
    title: log_softmax：按行求和
    text: |
      每一行各有一个 $S$，是这一行所有 exp 的和。
      $$\viz{S}={{ S | matrix:3 }}$$
    backward:
      label: '$\partial\viz{ex}$'
      title: log_softmax：穿过求和
      text: |
        求和的局部导数是 1，$S$ 的梯度复制给这一行的每个 $e^{x}$。
        $$\frac{\partial\ell}{\partial\viz{ex}}={{ ex.grad | matrix:3 }}$$
  - id: log
    show: LSE
    label: '$\viz{LSE}$'
    title: log_softmax：取 log
    text: |
      $\log S$ 就是 log-sum-exp，每一行一个。
      $$\viz{LSE}={{ LSE | matrix:3 }}$$
    backward:
      label: '$\partial\viz{S}$'
      title: log_softmax：穿过 log
      text: |
        log 的局部导数是 $1/S$。
        $$\frac{\partial\ell}{\partial\viz{S}}={{ S.grad | matrix:3 }}$$
  - id: sub
    show: out
    label: '$\viz{out}$'
    title: log_softmax：减去 LSE
    text: |
      每个元素减去自己那一行的 LSE。$e^{\log p}$ 每一行加起来是 1。
      $$\viz{out}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x},\ \partial\viz{LSE}$'
      title: log_softmax：穿过相减
      text: |
        $\viz{x}$ 的直连那条局部导数是 1，原样拿到 $\partial\ell/\partial\viz{out}$。LSE 连到这一行的每个元素，局部导数是 $-1$，所以它收到这一行梯度之和的相反数。
        $$\frac{\partial\ell}{\partial\viz{LSE}}={{ LSE.grad | matrix:3 }}$$
