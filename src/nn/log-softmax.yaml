module: LogSoftmax
inputs:
  x: { type: tensor, shape: ['...', C], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...', C], dtype: dtype }
forward:
  - ex: x.exp()
  - S: ex.sum(-1, keepdim=True)
  - LSE: S.log()
  - out: x - LSE
tex:
  ex: 'e^{\viz{x}}'
  S: 'S'
  LSE: '\mathrm{LSE}'
  out: '\log\mathbf{p}'
formula: '\step{sub}{\viz{out}=\viz{x}-}\step{log}{\log}\step{sum}{\sum_{j}}\step{exp}{e^{x_{j}}}'
fold:
  label: '$\viz{out}$'
  title: log_softmax
  text: |
    每一行只和自己有关。
    $$\viz{out}={{ out | matrix:3 }}$$
  backward:
    label: '$\partial\viz{x}$'
    title: '$\frac{\partial\ell}{\partial \viz{x}}$'
    text: |
      两路合起来，记 $g=\frac{\partial\ell}{\partial \viz{out}}$，$p=e^{\viz{out}}$：
      $$\frac{\partial\ell}{\partial x_i}=g_i-p_i\sum_jg_j,\qquad \frac{\partial\ell}{\partial \viz{x}}={{ x.grad | matrix:3 }}$$

steps:
  - id: exp
    show: ex
    label: '$e^{\viz{x}}$'
    title: log_softmax：取 exp
    text: |
      softmax 把一行 logits 变成概率 $p_i=e^{x_i}/\sum_je^{x_j}$。损失要用的是 $\log p_i$，直接写成
      $$\log p_i=x_i-\log\sum_je^{x_j}$$
      先算 $p$ 再取 log 的话，$p_i$ 很小时会下溢为 0，log 后变成 $-\infty$，所以直接按这个式子算。kernel 还先减去每行最大值 $m$ 来避免 exp 溢出，$\log\sum_je^{x_j}=m+\log\sum_je^{x_j-m}$，结果和梯度都不变。
      $$\viz{ex}={{ ex | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x}$'
      title: '$\frac{\partial\ell}{\partial \viz{x}}$'
      text: |
        exp 的局部导数是它自己。这一路和相减那一步的直连在 $\viz{x}$ 上相加。
        $$\frac{\partial\ell}{\partial \viz{x}}={{ x.grad | matrix:3 }}$$
  - id: sum
    show: S
    label: '$\viz{S}$'
    title: log_softmax：按行求和
    text: |
      $S=\sum_je^{x_j}$，每一行一个。
      $$\viz{S}={{ S | matrix:3 }}$$
    backward:
      label: '$\partial\viz{ex}$'
      title: '$\frac{\partial\ell}{\partial \viz{ex}}$'
      text: |
        局部导数是 1，$\frac{\partial\ell}{\partial S}$ 复制给这一行的每个 $e^{x_j}$。
        $$\frac{\partial\ell}{\partial \viz{ex}}={{ ex.grad | matrix:3 }}$$
  - id: log
    show: LSE
    label: '$\viz{LSE}$'
    title: log_softmax：取 log
    text: |
      $\mathrm{LSE}=\log S$，即 log-sum-exp。它是 $\max_jx_j$ 的光滑近似：$\max_jx_j\le\mathrm{LSE}\le\max_jx_j+\log n$。
      $$\viz{LSE}={{ LSE | matrix:3 }}$$
    backward:
      label: '$\partial\viz{S}$'
      title: '$\frac{\partial\ell}{\partial \viz{S}}$'
      text: |
        局部导数是 $1/S$。
        $$\frac{\partial\ell}{\partial \viz{S}}={{ S.grad | matrix:3 }}$$
  - id: sub
    show: out
    label: '$\viz{out}$'
    title: log_softmax：减去 LSE
    text: |
      每个元素减去这一行的 LSE，得到 $\log p_i$，所以每一行的 $e^{\log p_i}$ 之和为 1。
      $$\viz{out}={{ out | matrix:3 }}$$
    backward:
      label: '$\partial\viz{x},\ \partial\viz{LSE}$'
      title: '$\frac{\partial\ell}{\partial \viz{x}},\ \frac{\partial\ell}{\partial \viz{LSE}}$'
      text: |
        $\viz{x}$ 的直连局部导数是 1；LSE 连到这一行的每个元素，局部导数是 $-1$，收到这一行梯度之和的相反数。
        $$\frac{\partial\ell}{\partial \viz{LSE}}={{ LSE.grad | matrix:3 }}$$
