module: MLA
subtitle: multi-head latent attention
import:
  RMSNorm: vizflow/nn/rmsnorm
  RoPE: vizflow/nn/rope
  GQA: vizflow/nn/gqa
  LightningIndexer: vizflow/nn/lightning-indexer
params:
  H:     { type: dim }
  dn:    { type: dim }
  dr:    { type: dim }
  dv:    { type: dim }
  rq:    { type: dim }
  rkv:   { type: dim }
  theta: { type: float, default: 1e4 }
  sparse: { type: bool, default: false }
  HI:    { type: dim }
  dI:    { type: dim }
  kI:    { type: dim }
inputs:
  x: { shape: [T, d] }
outputs: [att]
weights:
  Wqa:  { shape: [rq, d] }
  Wqb:  { shape: [H*(dn + dr), rq] }
  Wkva: { shape: [rkv + dr, d] }
  Wkvb: { shape: [H*(dn + dv), rkv] }
  Wo:   { shape: [d, H*dv] }
buffers:
  M: { value: causal_mask(T) }
  ones: { value: 'ones(T, T)', dtype: bool, tex: '\mathbf{1}', when: sparse }
fold:
  label: '$\of{att}=\mathrm{self\_attn}(\of{x})$'
  title: self_attn（已折叠）
  text: |
    q 和 kv 各自先压缩到一个低维的 latent，再展开成 \of{H} 个 head；每个 head 的 query 和 key 拼上一小段带 RoPE 的维度，按普通的多头因果注意力算完，最后经过 o_proj。对应 HF 里 <code>self.self_attn(hidden_states)</code>。
    $$\of{att}={{ att | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 self_attn（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - cq: { op: x @ Wqa.T, tex: '\mathbf{c}_{q}' }
  - q_a_layernorm:
      use: RMSNorm
      subtitle: DeepseekV3RMSNorm
      suffix: q
      params: { intro: 'q 的 latent 先做一次 RMSNorm，范围是 $r_q$ 维。' }
      inputs: { x: cq }
      outputs: { out: cqn }
      tex: { out: '\bar{\of{cq}}' }
      folded: true
  - q: 'view(cqn @ Wqb.T, T, H, dn + dr)'
  - q_pass: { op: 'narrow(q, -1, 0, dn)', tex: '\mathbf{q}_{\mathrm{pass}}' }
  - q_rot:  { op: 'narrow(q, -1, dn, dr)', tex: '\mathbf{q}_{\mathrm{rot}}' }
  - ckv: { op: x @ Wkva.T, tex: '[\mathbf{c}_{kv}\,|\,\mathbf{k}_{\mathrm{rot}}]' }
  - c_kv: { op: 'narrow(ckv, -1, 0, rkv)', tex: '\mathbf{c}_{kv}' }
  - k_rot: { op: 'view(narrow(ckv, -1, rkv, dr), T, 1, dr)', tex: '\mathbf{k}_{\mathrm{rot}}' }
  - kv_a_layernorm:
      use: RMSNorm
      subtitle: DeepseekV3RMSNorm
      suffix: kv
      params: { intro: 'kv 的 latent 也做一次 RMSNorm，范围是 $r_{kv}$ 维；带 RoPE 的那一段不归一化。' }
      inputs: { x: c_kv }
      outputs: { out: ckvn }
      tex: { out: '\bar{\of{c_kv}}' }
      folded: true
  - kv: 'view(ckvn @ Wkvb.T, T, H, dn + dv)'
  - k_pass: { op: 'narrow(kv, -1, 0, dn)', tex: '\mathbf{k}_{\mathrm{pass}}' }
  - v: 'narrow(kv, -1, dn, dv)'
  - q_de: { op: 'view(transpose(view(q_rot, T*H, dr // 2, 2), 1, 2), T, H, dr)', tex: '\mathrm{deint}(\of{q_rot})' }
  - k_de: { op: 'view(transpose(view(k_rot, T, dr // 2, 2), 1, 2), T, 1, dr)', tex: '\mathrm{deint}(\of{k_rot})' }
  - apply_rotary_pos_emb:
      use: RoPE
      title: apply_rotary_pos_emb
      subtitle: 只转 $d_r$ 维
      params: { theta: theta }
      inputs: { q: q_de, k: k_de }
      outputs: { q_embed: q_emb, k_embed: k_emb }
      tex: { q_embed: "{\\of{q_rot}}'", k_embed: "{\\of{k_rot}}'" }
      folded: true
  - qs: { op: 'cat([q_pass, q_emb], dim=2)', tex: "{\\mathbf{q}'}" }
  - k_rep: { op: 'repeat_interleave(k_emb, H, 1)', tex: '\mathrm{rep}(\of{k_emb})' }
  - ks: { op: 'cat([k_pass, k_rep], dim=2)', tex: "{\\mathbf{k}'}" }
  - indexer:
      use: LightningIndexer
      when: sparse
      params: { HI: HI, dI: dI, dr: dr, kI: kI, theta: theta }
      inputs: { x: x, qr: cqn, mask: M }
      outputs: { idx: topk_idx }
  - index_mask: { op: 'scatter(ones, -1, topk_idx, 0)', tex: '\mathbf{m}^{I}', dtype: bool, when: sparse }
  - M_sparse: { op: 'masked_fill(M, index_mask, -inf)', tex: '\tilde{M}', when: sparse }
  - eager_attention_forward:
      use: GQA
      inline: true
      inputs: { q: qs, k: ks, v: v, mask: M_sparse if sparse else M }
      outputs: { o: o }
      brace: { title: eager_attention_forward, subtitle: 'softmax $\cdot$ $P\mathbf{v}$，每个 head 各算一次' }
      steps:
        krep:
          label: '$\mathbf{k}^{(h)}$'
          title: 每个 head 取出自己的 k
          text: |
            MLA 里每个 query head 都有自己的 k 和 v，<code>repeat_kv</code> 的 $n_\text{rep}=1$，这一步只是按 head 把 k 取出来。
          backward:
            title: 梯度放回各自的 head
            text: |
              $$\frac{\partial\ell}{\partial\mathbf{k}'}={{ ks.grad | matrix:3 }}$$
        vrep:
          label: '$\mathbf{v}^{(h)}$'
          title: 每个 head 取出自己的 v
          text: v 也按 head 取出来。
        mask:
          when: sparse
          title: 稀疏的 mask
          text: |
            这里加的是前面拼出的稀疏 mask $\of{M_sparse}$：causal mask 之外，没被 indexer 选中的 key 也是 $-\infty$，取 exp 之后变成 0。
            $$\of{M_sparse}={{ M_sparse | matrix:2 }}$$
          backward:
            text: 加常量，梯度原样传下去。mask 来自 indexer 的 top-k 选择，选择不可导，HF 里 indexer 又在 <code>torch.no_grad</code> 下运行，所以损失的梯度不会进入 indexer，它的参数从这个损失得不到梯度。训练时 DeepSeek 另用一个 KL 损失训练 indexer，让 index score 接近主注意力的分布。
  - att: { op: o @ Wo.T, tex: '\mathbf{att}' }
formula: '\step{o_proj}{\of{att}=}\step{eager_attention_forward.*}{\operatorname{attn}\big(}\step{q_cat}{\big[}\step{q_split}{\of{q_pass}}\step{q_cat}{,}\step{apply_rotary_pos_emb.*}{\mathrm{RoPE}\big(}\step{deinterleave}{\mathrm{deint}(\of{q_rot})}\step{apply_rotary_pos_emb.*}{\big)}\step{q_cat}{\big]},\ \step{k_cat}{\big[}\step{kv_split}{\of{k_pass}}\step{k_cat}{,}\step{k_expand}{\mathrm{RoPE}\big(\mathrm{deint}(\of{k_rot})\big)}\step{k_cat}{\big]},\ \step{kv_split}{\of{v}}\step{eager_attention_forward.*}{\big)}\step{o_proj}{{\of{Wo}}^{\top}}'
steps:
  - id: q_down
    show: [Wqa.T, cq]
    label: '$\of{cq}$'
    title: q_a_proj：把 query 压缩成 latent
    text: |
      query 不直接从 $\of{x}$ 投影到 \of{H} 个 head，先压缩到 $r_q=\of{rq}$ 维的 latent $\of{cq}$，再展开。两步的参数量比一步少：真实模型里 $d=7168$、$r_q=1536$，一步投影要 $7168\times 24576$，两步只要 $7168\times1536+1536\times24576$。
      $$\of{cq}=\of{x}W_{qa}^{\top}={{ cq | matrix:2 }}$$
    backward:
      label: '$\partial W_{qa},\ \partial\of{x}$'
      title: 传到 q_a_proj 的权重和 $\of{x}$
  - id: q_up
    show: [Wqb.T, q]
    label: '$\of{q}$'
    title: q_b_proj：展开成 \of{H} 个 head
    text: |
      归一化后的 latent 投影到 $H(d_n+d_r)$ 维，按 head 分成 $(T, H, d_n+d_r)$。每个 head 的前 $d_n=\of{dn}$ 维只看内容，后 $d_r=\of{dr}$ 维等一会儿做 RoPE。
      $$\of{q}={{ q | matrix:2 }}$$
    backward:
      label: '$\partial W_{qb},\ \partial\of{cqn}$'
      title: 传到 q_b_proj 的权重和 latent
  - id: q_split
    show: [q_pass, q_rot]
    label: '$\of{q_pass},\ \of{q_rot}$'
    title: 每个 head 切成不带位置和带位置的两段
    text: |
      对应 <code>torch.split(q_states, [qk_nope_head_dim, qk_rope_head_dim], dim=-1)</code>。
      $$\of{q_rot}={{ q_rot | matrix:2 }}$$
    backward:
      label: '$\partial\of{q}$'
      title: 两段拼回一个 head
  - id: kv_down
    show: [Wkva.T, ckv]
    label: '$\of{ckv}$'
    title: kv_a_proj_with_mqa：kv 的 latent 和共享的 RoPE key
    text: |
      一个投影同时算出两样东西：$r_{kv}=\of{rkv}$ 维的 latent $\of{c_kv}$，以及 $d_r=\of{dr}$ 维的 $\of{k_rot}$。推理时 KV cache 只存这两样，每个位置 $r_{kv}+d_r$ 个数，真实模型里是 $512+64=576$；普通的多头注意力要存 $2Hd_h$ 个数。名字里的 mqa 指 $\of{k_rot}$ 只有一份，所有 head 共用，像 multi-query attention。
      $$[\of{c_kv}\,|\,\of{k_rot}]=\of{x}W_{kva}^{\top}={{ ckv | matrix:2 }}$$
    backward:
      label: '$\partial W_{kva},\ \partial\of{x}$'
      title: 传到 kv_a_proj_with_mqa 的权重和 $\of{x}$
      text: |
        $\of{x}$ 的梯度是 q 和 kv 两条路相加。
        $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
  - id: kv_split
    show: [c_kv, k_rot]
    label: '$\of{c_kv},\ \of{k_rot}$'
    title: 切出 latent 和 RoPE key
    text: |
      $\of{k_rot}$ 写成 $(T, 1, d_r)$，只有 1 个 head。
      $$\of{c_kv}={{ c_kv | matrix:2 }}$$
    backward:
      label: '$\partial[\of{c_kv}\,|\,\of{k_rot}]$'
      title: 两段拼回去
  - id: kv_up
    show: [Wkvb.T, kv]
    label: '$\of{kv}$'
    title: kv_b_proj：从 latent 展开 k 和 v
    text: |
      latent 投影到 $H(d_n+d_v)$ 维，每个 head 得到不带位置的 key 和 value。所有 head 的 k、v 都来自同一个 $r_{kv}$ 维的 latent。推理时可以把 $W_{kvb}$ 里属于 k 的部分并进 query、属于 v 的部分并进 o_proj，注意力直接在 latent 上算；训练和 HF 的实现按这里的顺序展开。
      $$\of{kv}={{ kv | matrix:2 }}$$
    backward:
      label: '$\partial W_{kvb},\ \partial\of{ckvn}$'
      title: 传到 kv_b_proj 的权重和 latent
      text: |
        $$\frac{\partial\ell}{\partial\of{ckvn}}={{ ckvn.grad | matrix:3 }}$$
  - id: kv_split2
    show: [k_pass, v]
    label: '$\of{k_pass},\ \of{v}$'
    title: 每个 head 切成 key 和 value
    text: |
      对应 <code>torch.split(kv, [qk_nope_head_dim, v_head_dim], dim=-1)</code>。
      $$\of{v}={{ v | matrix:2 }}$$
    backward:
      label: '$\partial\of{kv}$'
      title: 两段拼回去
  - id: deinterleave
    show: [q_de, k_de]
    label: '$\mathrm{deint}(\of{q_rot}),\ \mathrm{deint}(\of{k_rot})$'
    title: 把相邻的一对分量拆成前后两半
    text: |
      DeepSeek 的权重把 RoPE 的每一对分量放在相邻的两维 $(x_0,x_1),(x_2,x_3),\dots$，每对转同一个角度。HF 的 <code>apply_rotary_pos_emb_interleave</code> 取出偶数位 <code>q[..., 0::2]</code> 和奇数位 <code>q[..., 1::2]</code>，旋转后按 [偶数位, 奇数位] 拼回去。这里先把每个 head 的 $d_r=\of{dr}$ 维重排成 $(x_0,x_2,\dots,x_1,x_3,\dots)$，写成 <code>view(..., d_r/2, 2).transpose(-1, -2).reshape(..., d_r)</code>，再交给普通的前后两半配对的 RoPE，结果和 HF 逐位相同，转完以后也保持这个顺序。q 和 k 用同一个排列，点积只是换了求和的顺序，所以注意力分数不变。$d_r=2$ 时只有一对，排列不改变任何位置。重排的局部导数是 1，每个元素只连一条线。
      $$\mathrm{deint}(\of{q_rot})={{ q_de | matrix:2 }}$$
    backward:
      label: '$\partial\of{q_rot},\ \partial\of{k_rot}$'
      title: 按原来的顺序放回去
  - id: q_cat
    show: qs
    label: "$\\of{qs}$"
    title: 拼回 query
    text: |
      不带位置的 $\of{q_pass}$ 在前，转过的 $\of{q_emb}$ 在后，对应 <code>torch.cat((q_pass, q_rot), dim=-1)</code>。每个 head 宽 $d_n+d_r=\of{dn+dr}$。
      $$\of{qs}={{ qs | matrix:2 }}$$
    backward:
      label: "$\\partial\\of{q_pass},\\ \\partial\\of{q_emb}$"
      title: 按列切回两段
  - id: k_expand
    show: k_rep
    label: "$\\mathrm{expand}(\\of{k_emb})$"
    title: RoPE key 复制给每个 head
    text: |
      转过的 $\of{k_emb}$ 只有 1 个 head，<code>k_rot.expand</code> 把它复制给 \of{H} 个 head。复制的局部导数是 1。
    backward:
      label: "$\\partial\\of{k_emb}$"
      title: 几份加回一份
      text: |
        \of{H} 个 head 用的是同一个 $\of{k_rot}$，反向时 \of{H} 份梯度加回这一份。
  - id: k_cat
    show: ks
    label: "$\\of{ks}$"
    title: 拼回 key
    text: |
      和 query 一样，不带位置的在前，带位置的在后。$\of{qs}$ 和 $\of{ks}$ 的点积分成两部分：前 $d_n$ 维只看内容，后 $d_r$ 维带相对位置。
      $$\of{ks}={{ ks | matrix:2 }}$$
    backward:
      label: "$\\partial\\of{k_pass},\\ \\partial\\of{k_rep}$"
      title: 按列切回两段
  - id: index_ones
    when: sparse
    show: [topk_idx, ones]
    label: '$\of{ones}$'
    title: 全是 true 的 bool 表
    text: |
      indexer 返回的是编号 $\of{topk_idx}$，eager 注意力要的是一张 mask，所以 self_attn 先用编号拼出 mask。第一步是 <code>topk_indices.new_ones((batch_size, seq_length, key_states.shape[2]), dtype=torch.bool)</code>：一张 $T\times T$ 的 bool 表，全是 true。true 表示这个 key 要被挡住。
      $$\of{ones}={{ ones | matrix:2 }}$$
  - id: index_mask
    when: sparse
    show: index_mask
    label: '$\of{index_mask}$'
    title: 选中的 key 写成 false
    text: |
      <code>.scatter(-1, topk_indices.long(), False)</code>：第 $t$ 行在 $\of{topk_idx}$ 第 $t$ 行列出的那几列写上 false。选中的 key 是 false，其余仍是 true，所以 true 标出的是要挡住的 key。HF 接着 <code>.unsqueeze(1)</code> 加出 head 这一维，所有 head 用同一张表；图上没有 batch 和 head 这两维，不画这一步。
      $$\of{index_mask}={{ index_mask | matrix:2 }}$$
  - id: sparse_mask
    when: sparse
    show: M_sparse
    label: '$\of{M_sparse}$'
    title: 没选中的 key 填成 $-\infty$
    text: |
      <code>attention_mask = attention_mask.masked_fill(index_mask, torch.finfo(hidden_states.dtype).min)</code>：$\of{index_mask}$ 为 true 的位置换成一个很大的负数，其余保留 causal mask 原来的值。HF 填的是 dtype 能表示的最小值，这里和 causal mask 一样填 $-\infty$，取 exp 之后两者都是 0。选中的 key 里如果有未来的位置（第 1 行能选的 key 不到 $k_I$ 个时），它在 causal mask 里本来就是 $-\infty$，所以仍然挡住。这张 mask 交给后面的注意力，代替原来的 causal mask，每个位置最多看 $k_I$ 个 key。
      $$\of{M_sparse}={{ M_sparse | matrix:2 }}$$
  - id: o_proj
    brace: { title: o_proj, subtitle: nn.Linear }
    show: [Wo.T, att]
    label: o_proj
    title: o_proj
    text: |
      \of{H} 个 head 的输出拼成 $H d_v=\of{H*dv}$ 维，投影回 $d$ 维，没有 bias。
      $$\of{att}={{ att | matrix:2 }}$$
    backward:
      label: '$\partial W_o,\ \partial\of{o}$'
      title: 传到 o_proj 权重和注意力输出
