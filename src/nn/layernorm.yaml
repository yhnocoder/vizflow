module: LayerNorm
subtitle: nn.LayerNorm
formula: '\step{affine}{\of{out}=\of{weight}\odot}\step{normalize}{\step{center}{(\of{x}-\mu)}\big/}\step{var}{\sqrt{\operatorname{mean}\big((\of{x}-\mu)^{2}\big)+\epsilon}}\step{affine}{+\of{bias}}'
params:
  eps:      { type: float, default: 1e-5 }
  name:     { type: text, default_key: true }
  intro:    { type: text, default: '' }
  out_note: { type: text, default: '' }
inputs:
  x: { shape: [..., n] }
outputs: [out]
weights:
  weight: { shape: [n], init: ones, tex: '\boldsymbol{\gamma}' }
  bias:   { shape: [n], init: zeros, tex: '\boldsymbol{\beta}' }
fold:
  label: '$\of{out}$'
  title: \of{name}（已折叠）
  text: |
    每一行减去自己的均值，除以自己的标准差，再乘 $\of{weight}$、加 $\of{bias}$。
    $$\of{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial\of{weight},\ \partial\of{bias},\ \partial\of{x}$'
    title: 穿过 \of{name}（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - mu:  { op: 'mean(x, -1, keepdim=true)', tex: '\mu' }
  - xc:  { op: x - mu, tex: '\of{x}-\mu' }
  - sq:  { op: xc ** 2, tex: '(\of{x}-\mu)^{2}' }
  - var: { op: 'mean(sq, -1, keepdim=true)', tex: '\sigma^{2}' }
  - r:   { op: 'rsqrt(var, eps=eps)', tex: r }
  - xh:  { op: xc * r, tex: '\hat{\of{x}}' }
  - xw:  { op: xh * weight, tex: '\of{weight}\odot\of{xh}' }
  - out: xw + bias
steps:
  - id: center
    show: [mu, xc]
    label: '$\of{xc}$'
    title: \of{name}：减去均值
    text: |
      \of{intro}LayerNorm 对最后一维归一化，每一行先求均值 $\mu$，再从这一行的每个分量里减去它。和 RMSNorm 相比，LayerNorm 多了减均值这一步和偏置 $\of{bias}$。
      $$\mu={{ mu | matrix:3 }},\qquad \of{xc}={{ xc | matrix:2 }}$$
    backward:
      label: '$\partial\of{x}$'
      title: 传到输入
      text: |
        减均值这一步让每一行的梯度之和变成 0：整行加上同一个数，输出不变。
        $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
  - id: var
    show: [sq, var, r]
    label: '$\sigma^{2},\ \of{r}$'
    title: 方差与标准差的倒数
    text: |
      去掉均值以后的平方取平均，得到这一行的方差 $\sigma^{2}$，这里除以 $n$，不做无偏修正。加上 $\epsilon=\of{eps}$ 再取平方根的倒数，得到 $r$。
      $$\sigma^{2}={{ var | matrix:3 }},\qquad r={{ r | matrix:3 }}$$
    backward:
      label: '$\partial\sigma^{2},\ \partial(\of{x}-\mu)$'
      title: 传到方差和去均值的输入
      text: |
        $\partial r/\partial\sigma^{2}=-r^{3}/2$，平均值再把梯度均分给这一行的每个平方。
        $$\frac{\partial\ell}{\partial\sigma^{2}}={{ var.grad | matrix:3 }}$$
  - id: normalize
    show: xh
    label: '$\of{xh}$'
    title: 归一化
    text: |
      去均值的每个分量乘上这一行的 $r$，每一行的均值变成 0、方差变成 1（不计 $\epsilon$）。不同的行之间没有连线。
      $$\of{xh}={{ xh | matrix:2 }}$$
    backward:
      label: '$\partial\of{r},\ \partial(\of{x}-\mu)$'
      title: 传到 r 和去均值的输入
  - id: affine
    show: [weight, xw, bias, out]
    label: '$\of{out}$'
    title: 乘权重、加偏置
    text: |
      $\of{weight}$ 和 $\of{bias}$ 都是长度为 $n$ 的向量，所有位置共用。\of{out_note}
      $$\of{out}=\of{weight}\odot\of{xh}+\of{bias}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\of{weight},\ \partial\of{bias},\ \partial\of{xh}$'
      title: 传到 $\of{weight}$、$\of{bias}$ 和 $\of{xh}$
      text: |
        $\of{weight}$ 和 $\of{bias}$ 被所有位置共用，梯度要把各行加起来。$\partial\ell/\partial\of{bias}$ 就是 $\partial\ell/\partial\of{out}$ 按行求和。
        $$\frac{\partial\ell}{\partial\of{bias}}={{ bias.grad | matrix:3 }}$$
