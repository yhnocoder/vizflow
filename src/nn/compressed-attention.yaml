module: CompressedAttention
subtitle: DeepseekV4Attention
import:
  RMSNorm: vizflow/nn/rmsnorm
  UnweightedRMSNorm: vizflow/nn/rmsnorm-unweighted
  PartialRoPE: vizflow/nn/partial-rope
  GQA: vizflow/nn/gqa
  Compressor: vizflow/nn/compressor
  CompressedIndexer: vizflow/nn/compressed-indexer
formula: '\step{o_b}{\of{att}=}\step{group_proj,concat_groups}{\big[\,\cdots\,\mathbf{o}_{g}W_{a,g}^{\top}\cdots\big]}\step{o_b}{\,W_{b}^{\top}},\quad\step{inverse.*}{\mathbf{o}=\mathrm{RoPE}^{-1}\big(}\step{eager_attention_forward.*}{\operatorname{attn}\big(\mathbf{q},\ }\step{keys}{[\,\mathbf{kv};\,\mathbf{C}\,]}\step{eager_attention_forward.*}{\big)}\step{inverse.*}{\big)}'
params:
  H:        { type: dim }
  D:        { type: dim }
  rd:       { type: dim }
  rq:       { type: dim }
  g:        { type: dim }
  dg:       { type: dim }
  W:        { type: dim }
  theta:    { type: float, default: 1e4 }
  compress: { type: bool, default: false }
  sparse:   { type: bool, default: false }
  m:        { type: dim }
  HI:       { type: dim }
  cI:       { type: dim }
  kI:       { type: dim }
  eps:      { type: float, default: 1e-6 }
inputs:
  x: { shape: [T, d] }
outputs: [att]
weights:
  Wqa:   { shape: [rq, d], tex: 'W_{qa}' }
  Wqb:   { shape: [H * D, rq], tex: 'W_{qb}' }
  Wkv:   { shape: [D, d], tex: 'W_{kv}' }
  Woa:   { shape: [g * dg, H * D // g], tex: 'W_{a}' }
  Wob:   { shape: [d, g * dg], tex: 'W_{b}' }
  sinks: { shape: [H], dtype: fp32, tex: '\mathbf{s}^{\mathrm{sink}}' }
buffers:
  Mw: { value: 'causal_mask(T, W)', tex: 'M_{\mathrm{sw}}' }
  entry_indices: { value: 'arange(T // m)', dtype: int64, tex: '\mathrm{ent}^{\mathrm{HCA}}', when: 'false if sparse else compress' }
  position_ids:  { value: 'arange(T)', dtype: int64, tex: '\mathrm{pos}^{\mathrm{HCA}}', when: 'false if sparse else compress' }
  block_zeros:   { value: 'zeros(T, T // m)', tex: '\mathbf{0}_{T\times\lfloor T/m\rfloor}', when: 'false if sparse else compress' }
  block_bias: { value: 'full(T, T // m + 1, -inf)', tex: '(-\infty)_{T\times(\lfloor T/m\rfloor+1)}', when: sparse }
fold:
  label: '$\of{att}=\mathrm{self\_attn}(\of{x})$'
  title: self_attn（已折叠）
  text: |
    query 经过低秩的 q_a_proj、q_b_proj，key 和 value 是同一个向量，只有一个 head。每个位置看滑动窗口里的 $W=\of{W}$ 个 token，加上压缩过的更早的条目；输出转回 RoPE 之前的方向，再按组投影回 $d$ 维。对应 HF 里 <code>self.self_attn(hidden_states)</code>。
    $$\of{att}={{ att | matrix:2 }}$$
  backward:
    label: '$\partial$参数, $\partial\of{x}$'
    title: 穿过 self_attn（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\of{x}}={{ x.grad | matrix:3 }}$$
body:
  - cq: { op: x @ Wqa.T, tex: '\mathbf{c}_{q}' }
  - q_a_norm:
      use: RMSNorm
      suffix: qa
      subtitle: DeepseekV4RMSNorm
      params: { eps: eps }
      inputs: { x: cq }
      outputs: { out: cqn }
      tex: { out: '\bar{\mathbf{c}}_{q}' }
      folded: true
      fold:
        text: |
          计算和 decoder 层的 input_layernorm 相同，那里展开画了每一步；权重是这个实例自己的。
          $$\bar{\mathbf{c}}_{q}={{ cqn | matrix:2 }}$$
  - qp: { op: cqn @ Wqb.T, tex: '\mathbf{q}_{\mathrm{b}}' }
  - q: { op: 'view(qp, T, H, D)', tex: '\mathbf{q}' }
  - q_b_norm:
      use: UnweightedRMSNorm
      suffix: qb
      subtitle: DeepseekV4UnweightedRMSNorm
      params: { eps: eps, intro: '每个 head 的 query 各自做一次 RMSNorm。' }
      inputs: { x: q }
      outputs: { out: qn }
      tex: { out: '\bar{\mathbf{q}}' }
      folded: true
      fold:
        text: |
          计算和 mHC 的 input_norm 相同，是没有权重的 RMSNorm，那里展开画了每一步；这里对每个 head 的 query 各做一次。
          $$\bar{\mathbf{q}}={{ qn | matrix:2 }}$$
  - q_rope:
      use: PartialRoPE
      suffix: q
      title: apply_rotary_pos_emb
      subtitle: query
      params: { rd: rd, theta: theta }
      inputs: { x: qn }
      outputs: { out: qr }
      tex: { out: "\\mathbf{q}'" }
  - kvp: { op: x @ Wkv.T, tex: '\mathbf{kv}_{\mathrm{proj}}' }
  - kv_norm:
      use: RMSNorm
      suffix: kv
      subtitle: DeepseekV4RMSNorm
      params: { eps: eps }
      inputs: { x: kvp }
      outputs: { out: kvn }
      tex: { out: '\bar{\mathbf{kv}}' }
      folded: true
      fold:
        text: |
          计算和 decoder 层的 input_layernorm 相同，那里展开画了每一步；权重是这个实例自己的。
          $$\bar{\mathbf{kv}}={{ kvn | matrix:2 }}$$
  - kv1: { op: 'view(kvn, T, 1, D)', tex: '\mathbf{kv}' }
  - kv_rope:
      use: PartialRoPE
      suffix: kv
      title: apply_rotary_pos_emb
      subtitle: key 和 value
      params: { rd: rd, theta: theta }
      inputs: { x: kv1 }
      outputs: { out: kvr }
      tex: { out: "\\mathbf{kv}'" }
      folded: true
      fold:
        text: |
          计算和上面 query 的 RoPE 相同，那里展开画了每一步。
          $$\mathbf{kv}'={{ kvr | matrix:2 }}$$
  - compressor:
      use: Compressor
      when: compress
      subtitle: '每 $m$ 个 token 压成一个条目'
      params: { m: m, c: D, rd: rd, theta: theta, overlap: sparse, eps: eps }
      inputs: { x: x }
      outputs: { C: C }
      tex: { C: '\mathbf{C}' }
  - entry_row:     { op: 'view(entry_indices, 1, T // m)', tex: '(\mathrm{ent}^{\mathrm{HCA}})^{\top}', when: 'false if sparse else compress' }
  - pos1:          { op: position_ids + 1, tex: '\mathrm{pos}^{\mathrm{HCA}}+1', when: 'false if sparse else compress' }
  - threshold:     { op: pos1 // m, tex: '\boldsymbol{\tau}', when: 'false if sparse else compress' }
  - threshold_col: { op: 'unsqueeze(threshold, -1)', tex: '\boldsymbol{\tau}_{:,1}', when: 'false if sparse else compress' }
  - future_mask:   { op: 'ge(entry_row, threshold_col)', tex: '\mathbf{m}^{\mathrm{fut}}', when: 'false if sparse else compress' }
  - Mc:            { op: 'masked_fill(block_zeros, future_mask, -inf)', tex: 'M_{\mathrm{c}}', when: 'false if sparse else compress' }
  - indexer:
      use: CompressedIndexer
      when: sparse
      params: { HI: HI, cI: cI, kI: kI, m: m, rd: rd, theta: theta, eps: eps }
      inputs: { x: x, qr: cqn }
      outputs: { idx: top_k_indices }
  - valid:       { op: 'ge(top_k_indices, 0)', tex: '\mathbf{m}^{\mathrm{valid}}', when: sparse }
  - safe_indices: { op: 'where(valid, top_k_indices, T // m)', tex: '\mathbf{i}^{\mathrm{safe}}', when: sparse }
  - block_s:     { op: 'scatter(block_bias, -1, safe_indices, 0)', tex: 'B^{\mathrm{blk}}', when: sparse }
  - Ms:          { op: 'narrow(block_s, -1, 0, T // m)', tex: '\tilde{M}_{\mathrm{c}}', when: sparse }
  - keys: { op: 'cat([kvr, C], 0)', tex: '[\,\mathbf{kv}'';\,\mathbf{C}\,]', when: compress }
  - mask: { op: 'cat([Mw, Ms if sparse else Mc], 1)', tex: 'M', when: compress }
  - eager_attention_forward:
      use: GQA
      inline: true
      params: { sink: true }
      inputs: { q: qr, k: keys if compress else kvr, v: keys if compress else kvr, mask: mask if compress else Mw, sinks: sinks }
      outputs: { o: o_cat }
      brace: { title: eager_attention_forward, subtitle: '每个 head 各算一次，key 和 value 是同一个向量' }
      steps:
        krep:
          label: '$\mathbf{k}^{(h)}$'
          title: 每个 head 取出共用的 key
          text: |
            只有一个 KV head，<code>repeat_kv</code> 把它复制给 \of{H} 个 query head。key 和 value 是同一个张量：HF 把同一个 <code>kv</code> 同时作为 key 和 value 传进注意力。
        vrep:
          label: '$\mathbf{v}^{(h)}$'
          title: value 也是同一个向量
          text: value 用的就是上面那个 key，带着同样的 RoPE。最后会把它转回来。
        mask:
          title: 滑动窗口和压缩条目的 mask
          text: |
            mask 的前 $T$ 列是滑动窗口：位置 $t$ 看 $t-W<s\le t$ 的 token。后面几列是压缩条目，来自 compressor 的因果 mask（HCA）或 indexer 选出的稀疏 mask（CSA）。
            $$M={{ mask | matrix:2 }}$$
          backward:
            text: 加常量，梯度原样传下去。mask 由形状和 indexer 的选择决定，没有梯度。
  - o3: { op: 'view(o_cat, T, H, D)', tex: '\mathbf{o}' }
  - inverse:
      use: PartialRoPE
      suffix: o
      title: apply_rotary_pos_emb（$-\sin$）
      subtitle: 把 value 带的旋转转回去
      params: { rd: rd, theta: theta, inverse: true }
      inputs: { x: o3 }
      outputs: { out: ou }
      tex: { out: '\mathbf{o}''' }
      folded: true
      fold:
        text: |
          计算和上面 query 的 RoPE 相同，只是 sin 取负号：最后一步的相加换成相减，每一对分量转回 $-p_n\omega_i$。
          $$\mathbf{o}'={{ ou | matrix:2 }}$$
  - og: { op: 'view(ou, T, g, H * D // g)', tex: '\mathbf{o}^{\mathrm{grp}}' }
  - for: j
    in: 1..g
    brace: 'group \of{j}'
    body:
      - Wa[j]: { op: 'narrow(Woa, 0, (j-1) * dg, dg)', tex: 'W_{a,\of{j}}' }
      - z[j]:  { op: 'select_matmul(og, Wa[j].T, j-1)', tex: '\mathbf{z}_{\of{j}}' }
  - zc: { op: 'cat(z[1..g], dim=1)', tex: '\mathbf{u}' }
  - att: { op: zc @ Wob.T, tex: '\mathbf{att}' }
steps:
  - id: q_down
    show: [Wqa.T, cq]
    label: '$\of{cq}$'
    title: q_a_proj：query 先压缩到 $r_q$ 维
    text: |
      $r_q=\of{rq}$，真实模型里 $d=4096$、$r_q=1024$。
      $$\of{cq}={{ cq | matrix:2 }}$$
    backward:
      label: '$\partial W_{qa},\ \partial\of{x}$'
      title: 传到 q_a_proj 的权重和 $\of{x}$
  - id: q_up
    show: [Wqb.T, qp]
    label: '$\of{qp}$'
    title: q_b_proj：展开成 \of{H} 个 head
    text: |
      归一化后的 latent（HF 的 <code>q_residual</code>，indexer 也用它）投影到 $HD=\of{H*D}$ 维。
      $$\of{qp}={{ qp | matrix:2 }}$$
    backward:
      label: '$\partial W_{qb},\ \partial\of{cqn}$'
      title: 传到 q_b_proj 的权重和 latent
  - id: q_heads
    show: q
    label: '$\of{q}$'
    title: 按 head 分开
    text: |
      每个 head 宽 $D=\of{D}$，最后 $d_r=\of{rd}$ 维做 RoPE。真实模型里 $D=512$、$d_r=64$。
      $$\of{q}={{ q | matrix:2 }}$$
    backward:
      label: '$\partial\of{qp}$'
      title: 拼回一行
  - id: kv_proj
    show: [Wkv.T, kvp]
    label: '$\of{kvp}$'
    title: kv_proj：一个既是 key 又是 value 的向量
    text: |
      $\of{x}$ 直接投影到 $D$ 维，只有一个 head，所有 query head 共用；这个向量既作 key 也作 value。
      $$\of{kvp}={{ kvp | matrix:2 }}$$
    backward:
      label: '$\partial W_{kv},\ \partial\of{x}$'
      title: 传到 kv_proj 的权重和 $\of{x}$
  - id: kv_head
    show: kv1
    label: '$\of{kv1}$'
    title: 写成一个 head
    text: 写成 $(T, 1, D)$。
    backward:
      label: '$\partial\of{kvn}$'
      title: 去掉 head 维
  - id: hca_entries
    when: 'false if sparse else compress'
    show: [entry_indices, entry_row]
    label: '$\of{entry_row}$'
    title: 压缩条目的编号排成一行
    text: |
      HCA 层压缩条目那几列的 mask 由 HF <code>DeepseekV4HCACompressor.forward</code> 的最后几行建出，这里逐行画出。第一行是 <code>entry_indices = torch.arange(compressed_len)</code>：条目编号 $0,1,\dots,\lfloor T/m\rfloor-1$。后面的比较里写成 <code>entry_indices.view(1, 1, 1, -1)</code>，排成一行；图上没有 batch 和 head 维，view 成 $(1, \lfloor T/m\rfloor)$。
      $$\of{entry_row}={{ entry_row | matrix:2 }}$$
  - id: hca_positions
    when: 'false if sparse else compress'
    show: [position_ids, pos1]
    label: '$\of{pos1}$'
    title: 每个位置的编号加 1
    text: |
      <code>causal_threshold = (position_ids + 1) // self.compress_rate</code> 的第一步：$\of{position_ids}$ 是每个 token 的位置 $0,1,\dots,T-1$（没有缓存时 HF 的 <code>position_ids</code> 就是 <code>arange(T)</code>），先加 1，得到位置 $t$ 之前（含 $t$）一共有几个 token。
      $$\of{pos1}={{ pos1 | matrix:2 }}$$
  - id: hca_threshold
    when: 'false if sparse else compress'
    show: threshold
    label: '$\of{threshold}$'
    title: 每个位置能看到几个完整的条目
    text: |
      <code>// self.compress_rate</code>：再按 $m=\of{m}$ 向下取整。$\tau_t=\lfloor (t+1)/m\rfloor$ 是到位置 $t$ 为止已经压缩完的条目个数，编号小于 $\tau_t$ 的条目只包含不晚于 $t$ 的 token。
      $$\of{threshold}={{ threshold | matrix:2 }}$$
  - id: hca_threshold_col
    when: 'false if sparse else compress'
    show: threshold_col
    label: '$\of{threshold_col}$'
    title: 阈值排成一列
    text: |
      <code>causal_threshold.unsqueeze(1).unsqueeze(-1)</code>：$\tau$ 排成一列，和上面那一行广播成 $T\times\lfloor T/m\rfloor$ 的表。HF 的第一个 <code>unsqueeze(1)</code> 加的是 head 维，图上没有这一维。
      $$\of{threshold_col}={{ threshold_col | matrix:2 }}$$
  - id: hca_future
    when: 'false if sparse else compress'
    show: future_mask
    label: '$\of{future_mask}$'
    title: 标出还没压缩完的条目
    text: |
      <code>entry_indices.view(1, 1, 1, -1) &gt;= causal_threshold.unsqueeze(1).unsqueeze(-1)</code>：第 $t$ 行第 $w$ 列在 $w\ge\tau_t$ 时是 true，表示第 $w$ 个条目包含位置 $t$ 之后的 token，位置 $t$ 不能看它。第 $w$ 个条目压缩了 token $wm$ 到 $wm+m-1$，所以条件等价于 $(w+1)m&gt;t+1$。
      $$\of{future_mask}={{ future_mask | matrix:2 }}$$
  - id: hca_fill
    when: 'false if sparse else compress'
    show: [block_zeros, Mc]
    label: '$\of{Mc}$'
    title: 还没压缩完的条目记成 $-\infty$
    text: |
      <code>block_bias = compressed_kv.new_zeros((batch, 1, seq_len, compressed_len))</code> 建一张全 0 的表 $\of{block_zeros}$，然后 <code>block_bias = block_bias.masked_fill(..., float("-inf"))</code>：$\of{future_mask}$ 为 true 的位置换成 $-\infty$，其余是 0。HCA 层没有 indexer，这张表就是压缩条目那几列的 mask。
      $$\of{Mc}={{ Mc | matrix:2 }}$$
  - id: index_valid
    when: sparse
    show: valid
    label: '$\of{valid}$'
    title: 标出有效的编号
    text: |
      indexer 返回的是条目编号，注意力要的是一张 mask。HF 在 <code>DeepseekV4CSACompressor.forward</code> 里用编号拼出这张 mask，第一步是 <code>valid = top_k_indices &gt;= 0</code>：indexer 把选错的编号写成了 $-1$，这里标出其余的编号。
      $$\of{valid}={{ valid | matrix:2 }}$$
  - id: index_safe
    when: sparse
    show: safe_indices
    label: '$\of{safe_indices}$'
    title: 无效的编号指到多出来的一列
    text: |
      <code>safe_indices = torch.where(valid, top_k_indices, torch.full_like(top_k_indices, compressed_len))</code>：无效的编号换成 $\lfloor T/m\rfloor=\of{T // m}$，也就是最后一个条目之后的那一列。下一步往这一列写的 0 最后会被切掉，不影响结果。
      $$\of{safe_indices}={{ safe_indices | matrix:2 }}$$
  - id: block_bias
    when: sparse
    show: block_bias
    label: '$\of{block_bias}$'
    title: 一张全是 $-\infty$ 的表
    text: |
      <code>block_bias = compressed_kv.new_full((batch, 1, seq_len, compressed_len + 1), float("-inf"))</code>：$T$ 行，每行 $\lfloor T/m\rfloor+1$ 列，全是 $-\infty$。多出来的最后一列接收无效的编号。图上没有 batch 和 head 这两维。
      $$\of{block_bias}={{ block_bias | matrix:2 }}$$
  - id: block_scatter
    when: sparse
    show: block_s
    label: '$\of{block_s}$'
    title: 选中的条目写成 0
    text: |
      <code>block_bias.scatter_(-1, safe_indices.unsqueeze(1), 0.0)</code>：第 $t$ 行在 $\of{safe_indices}$ 第 $t$ 行列出的那几列写上 0。选中且已经压缩完的条目是 0，其余仍是 $-\infty$。HF 原地改写 <code>block_bias</code>，图上另起一个名字。
      $$\of{block_s}={{ block_s | matrix:2 }}$$
  - id: block_narrow
    when: sparse
    show: Ms
    label: '$\of{Ms}$'
    title: 切掉多出来的一列
    text: |
      <code>return compressed_kv, block_bias[..., :compressed_len]</code>：去掉最后一列，剩下每个压缩条目一列。这就是 CSA 层压缩条目那几列的 mask，没选中的条目是 $-\infty$。
      $$\of{Ms}={{ Ms | matrix:2 }}$$
  - id: keys
    when: compress
    show: keys
    label: '$\of{keys}$'
    title: 滑动窗口的 kv 后面接上压缩条目
    text: |
      key（也是 value）有 $T+\lfloor T/m\rfloor=\of{T + T // m}$ 个：前 $T$ 个是每个 token 自己的，后 $\lfloor T/m\rfloor$ 个是压缩条目，对应 <code>torch.cat([kv, compressed_kv], dim=2)</code>。
      $$\of{keys}={{ keys | matrix:2 }}$$
    backward:
      label: '$\partial\mathbf{kv}'',\ \partial\mathbf{C}$'
      title: 按来源切开
  - id: mask
    when: compress
    show: [Mw, mask]
    label: '$\of{mask}$'
    title: 拼出注意力的 mask
    text: |
      前 $T$ 列是滑动窗口的 causal mask：位置 $t$ 只看 $t-W<s\le t$，$W=\of{W}$。
      $$M_{\mathrm{sw}}={{ Mw | matrix:2 }}$$
      后面接上压缩条目那几列，对应 HF 的 <code>torch.cat([attention_mask, block_bias.to(attention_mask.dtype)], dim=-1)</code>。HCA 层接的是上面由位置和条目编号比较得到的 mask，还没压缩完的条目是 $-\infty$；CSA 层接的是上面由 indexer 的编号拼出的 mask，没选中的条目也是 $-\infty$。
      $$\of{mask}={{ mask | matrix:2 }}$$
  - id: o_heads
    show: o3
    label: '$\of{o3}$'
    title: 按 head 分开
    text: 注意力的输出排回 $(T, H, D)$。
    backward:
      label: '$\partial\mathbf{o}$'
      title: 拼回一行
  - id: groups
    show: og
    label: '$\of{og}$'
    title: 把 head 分成 $g$ 组
    text: |
      \of{H} 个 head 按顺序分成 $g=\of{g}$ 组，每组 $HD/g=\of{H * D // g}$ 维，对应 <code>attn_output.reshape(..., o_groups, -1)</code>。真实模型 64 个 head 分 8 组，每组 4096 维。
    backward:
      label: '$\partial\mathbf{o}''$'
      title: 拼回去
  - id: group_proj
    show: ['Wa[1..g]', 'z[1..g]']
    label: '$\mathbf{z}_{j}=\mathbf{o}_{j}W_{a,j}^{\top}$'
    title: o_a_proj：每组单独投影
    text: |
      o_a_proj 的权重有 $g\cdot d_g$ 行，第 $j$ 组只用其中第 $j$ 段 $d_g=\of{dg}$ 行，组与组之间不混合，相当于一个块对角的矩阵。HF 用 <code>torch.bmm</code> 一次算完所有组。真实模型每组从 4096 维投影到 1024 维。
      $$\of{z[1]}=\mathbf{o}_{1}W_{a,1}^{\top}={{ z[1] | matrix:2 }}$$
    backward:
      label: '$\partial W_{a},\ \partial\mathbf{o}^{\mathrm{grp}}$'
      title: 传到 o_a_proj 的权重和各组的输出
  - id: concat_groups
    show: zc
    label: '$\of{zc}$'
    title: 各组拼起来
    text: |
      对应 <code>.flatten(2)</code>，得到 $g d_g=\of{g*dg}$ 维。
    backward:
      label: '$\partial\mathbf{z}_{j}$'
      title: 按组切开
  - id: o_b
    show: [Wob.T, att]
    label: '$\of{att}$'
    title: o_b_proj：混合各组，回到 $d$ 维
    text: |
      $$\of{att}={{ att | matrix:2 }}$$
    backward:
      label: '$\partial W_{b},\ \partial\of{zc}$'
      title: 传到 o_b_proj 的权重
