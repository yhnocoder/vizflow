module: RMSNorm
args:
  hidden_size: dim
  eps: { type: float, default: 1e-6 }
inputs:
  x: { type: tensor, shape: ['...', hidden_size], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...', hidden_size], dtype: dtype }
init:
  weights:
    weight: { shape: [hidden_size], init: ones }
forward:
  - xf: x.float()
  - sq: xf ** 2
  - ms: sq.mean(-1, keepdim=True)
  - mse: ms + eps
  - r: rsqrt(mse)
  - xh: xf * r
  - xc: xh.to(x.dtype)
  - out: weight * xc
tex:
  weight: '\boldsymbol{\gamma}'
  xf: '{\viz{x}}_{\mathrm{fp32}}'
  sq: '{\viz{x}}^{2}'
  ms: '\mathrm{ms}'
  mse: '(\mathrm{ms}+\epsilon)'
  r: 'r'
  xh: '\hat{\viz{x}}_{\mathrm{fp32}}'
  xc: '\hat{\viz{x}}'
formula: '\step{scale}{\viz{out}=\viz{weight}\odot}\step{normalize}{\viz{x}\big/}\step{rms}{\sqrt{\step{mean}{\operatorname{mean}\big(}\step{square}{{\viz{x}}^{2}}\step{mean}{\big)}\step{eps}{+\epsilon}}}'
fold:
  label: '$\viz{out}$'
  title: RMSNorm
  text: |
    每一行只和自己那一行有关，所以 Jacobian 是 $T$ 个 $d\times d$ 的对角块。
    $$\viz{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial\viz{weight},\ \partial\viz{x}$'
    title: '$\frac{\partial\ell}{\partial \viz{weight}},\ \frac{\partial\ell}{\partial \viz{x}}$'
    text: |
      $$\frac{\partial\ell}{\partial \viz{x}}=r\Big(\mathbf{u}-\hat{\mathbf{x}}\,\frac{\hat{\mathbf{x}}\cdot\mathbf{u}}{d}\Big),\qquad \frac{\partial\ell}{\partial \viz{weight}}={{ weight.grad | matrix:3 }}$$

steps:
  - id: float
    show: xf
    label: '$\viz{xf}$'
    title: RMSNorm：转成 float32
    text: |
      RMSNorm 把每一行缩放到均方根为 1，再乘一个可学习的权重：
      $$\viz{out}=\viz{weight}\odot\frac{\viz{x}}{\sqrt{\frac{1}{d}\sum_k x_k^2+\epsilon}}$$
      和 LayerNorm 相比，它不减均值，也没有 bias。HF 第一行 <code>hidden_states.to(torch.float32)</code> 先转成 float32。
      $$\viz{xf}={{ xf | matrix:2 }}$$
    backward:
      label: '$\partial\viz{x}$'
      title: '$\frac{\partial\ell}{\partial \viz{x}}$'
      text: |
        平方这一路和归一化那一步的直连在 $\viz{xf}$ 上相加。记 $\mathbf{u}=\frac{\partial\ell}{\partial \viz{out}}\odot\viz{weight}$，两路合起来是：
        $$\frac{\partial\ell}{\partial \viz{x}}=r\Big(\mathbf{u}-\hat{\mathbf{x}}\,\frac{\hat{\mathbf{x}}\cdot\mathbf{u}}{d}\Big),\qquad \frac{\partial\ell}{\partial \viz{x}}={{ x.grad | matrix:3 }}$$
        第二项减去了 $\mathbf{u}$ 在 $\hat{\mathbf{x}}$ 方向上的分量，所以 $\viz{x}\cdot\frac{\partial\ell}{\partial \viz{x}}=r\,(\viz{x}\cdot\mathbf{u})\,\frac{\epsilon}{\mathrm{ms}+\epsilon}$，$\epsilon$ 可忽略时为 0。也就是说，梯度和这一行的输入垂直：把整行放大或缩小，输出几乎不变，损失也就不会沿这个方向变化。
  - id: square
    show: sq
    label: '$\viz{sq}$'
    title: 逐元素平方
    text: |
      接着 <code>.pow(2)</code> 逐元素平方。
      $$\viz{sq}={{ sq | matrix:2 }}$$
    backward:
      label: '$\partial\viz{xf}$'
      title: '$\frac{\partial\ell}{\partial \viz{xf}}$'
      text: |
        平方的局部导数是 $2x$。
        $$\frac{\partial\ell}{\partial \viz{xf}}={{ xf.grad | matrix:3 }}$$
  - id: mean
    show: ms
    label: '$\viz{ms}$'
    title: 平方的平均
    text: |
      <code>variance = hidden_states.pow(2).mean(-1, keepdim=True)</code>。每一行对 $d$ 个平方取平均，得到这一行的均方 $\mathrm{ms}_t=\frac{1}{d}\sum_k x_{t,k}^2$。平均只在最后一维上做，所以每行一个数。HF 把它叫 variance，但计算时没有减均值，所以它是二阶原点矩。
      $$\mathrm{ms}={{ ms | matrix:3 }}$$
    backward:
      label: '$\partial\viz{sq}$'
      title: '$\frac{\partial\ell}{\partial \viz{sq}}$'
      text: |
        局部导数是 $1/d$：$\mathrm{ms}_t$ 的梯度除以 $d$，分给这一行的每个平方。
        $$\frac{\partial\ell}{\partial \viz{sq}}={{ sq.grad | matrix:3 }}$$
  - id: eps
    show: mse
    label: '$\viz{mse}$'
    title: 加上 $\epsilon$
    text: |
      <code>variance + self.variance_epsilon</code>。考虑到假如一行全为 0，$\viz{ms}=0$，下一步的 $\viz{r}=\frac{1}{\sqrt{\viz{ms}}}$ 会变成 <code>inf</code>，所以加上一个很小的 $\epsilon$ 来避免这种情况。
      $$\viz{mse}={{ mse | matrix:3 }}$$
    backward:
      label: '$\partial\viz{ms}$'
      title: '$\frac{\partial\ell}{\partial \viz{ms}}$'
      text: |
        加常数的局部导数是 1，梯度原样传下去。
        $$\frac{\partial\ell}{\partial \mathrm{ms}}={{ ms.grad | matrix:3 }}$$
  - id: rms
    show: r
    label: '$\viz{r}$'
    title: 平方根的倒数
    text: |
      <code>torch.rsqrt(...)</code> 一次算出 $r_t=(\mathrm{ms}_t+\epsilon)^{-1/2}$，于是下一步可以用乘法代替除法。
      $$r={{ r | matrix:3 }}$$
    backward:
      label: '$\partial\viz{mse}$'
      title: '$\frac{\partial\ell}{\partial \viz{mse}}$'
      text: |
        $\frac{d}{dv}v^{-1/2}=-\frac12v^{-3/2}$，代入 $v=\mathrm{ms}+\epsilon$ 得局部导数 $-r^{3}/2$。
        $$\frac{\partial\ell}{\partial \viz{mse}}={{ mse.grad | matrix:3 }}$$
  - id: normalize
    show: xh
    label: '$\viz{xh}$'
    title: 归一化
    text: |
      <code>hidden_states * torch.rsqrt(...)</code>，每个分量乘上这一行的 $r$：$\hat x_{t,k}=x_{t,k}\,r_t$。乘完以后每行的均方是 $\frac{\mathrm{ms}_t}{\mathrm{ms}_t+\epsilon}\approx1$，也就是模长约为 $\sqrt d$。

      一个元素直接依赖自己，又经过 $r_t$ 依赖同一行的所有元素。$r_t$ 只由这一行算出，所以行与行之间互不依赖。
      $$\viz{xh}={{ xh | matrix:2 }}$$
    backward:
      label: '$\partial\viz{r},\ \partial\viz{xf}$'
      title: '$\frac{\partial\ell}{\partial \viz{r}},\ \frac{\partial\ell}{\partial \viz{xf}}$'
      text: |
        $r_t$ 用在这一行的 $d$ 个输出里，每一路的局部导数是 $x_{t,k}$，所以 $\frac{\partial\ell}{\partial r_t}=\sum_kx_{t,k}u_{t,k}=\mathbf{x}_t\cdot\mathbf{u}_t$。直连那条的局部导数是 $r_t$，输入拿到 $r_t\,u_{t,k}$。
        $$\frac{\partial\ell}{\partial r}={{ r.grad | matrix:3 }}$$
  - id: cast
    show: xc
    label: '$\viz{xc}$'
    title: 转回输入的 dtype
    text: |
      随后 <code>hidden_states.to(input_dtype)</code> 转回输入的 dtype。
      $$\viz{xc}={{ xc | matrix:2 }}$$
    backward:
      label: '$\partial\viz{xh}$'
      title: '$\frac{\partial\ell}{\partial \viz{xh}}$'
      text: 类型转换的局部导数是 1，梯度转回 float32。
  - id: scale
    show: [weight, out]
    label: '$\viz{out}$'
    title: 乘上权重 $\viz{weight}$
    text: |
      <code>self.weight * hidden_states</code>。归一化把每一行的尺度固定了，所以再乘上 $\viz{weight}$，让模型能给每个维度重新设定尺度。它是长度为 $d$ 的向量，初始化为全 1，所有位置共用，所以它的第 $k$ 个分量作用于每一行的第 $k$ 列。
      $$\viz{out}=\viz{weight}\odot\viz{xc}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\viz{weight},\ \partial\viz{xc}$'
      title: '$\frac{\partial\ell}{\partial \viz{weight}},\ \frac{\partial\ell}{\partial \viz{xc}}$'
      text: |
        逐元素乘的两个输入互为对方的局部导数。$\viz{weight}$ 被 $T$ 行共用，梯度按行相加：
        $$\frac{\partial\ell}{\partial \viz{weight}}=\sum_t\frac{\partial\ell}{\partial {\viz{out}}_t}\odot{\viz{xc}}_t={{ weight.grad | matrix:3 }},\qquad \mathbf{u}=\frac{\partial\ell}{\partial \viz{out}}\odot\viz{weight}={{ xc.grad | matrix:3 }}$$
