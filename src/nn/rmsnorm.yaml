module: RMSNorm
args:
  hidden_size: dim
  eps: { type: float, default: 1e-6 }
inputs:
  x: { type: tensor, shape: ['...', hidden_size], dtype: dtype }
outputs:
  out: { type: tensor, shape: ['...', hidden_size], dtype: dtype }
init:
  weights:
    weight: { shape: [hidden_size], init: ones }
forward:
  - xf: x.float()
  - sq: xf ** 2
  - ms: sq.mean(-1, keepdim=True)
  - mse: ms + eps
  - r: rsqrt(mse)
  - xh: xf * r
  - xc: xh.to(x.dtype)
  - out: weight * xc
tex:
  weight: '\boldsymbol{\gamma}'
  xf: '{\viz{x}}_{\mathrm{fp32}}'
  sq: '{\viz{x}}^{2}'
  ms: '\mathrm{ms}'
  mse: '(\mathrm{ms}+\epsilon)'
  r: 'r'
  xh: '\hat{\viz{x}}_{\mathrm{fp32}}'
  xc: '\hat{\viz{x}}'
formula: '\step{scale}{\viz{out}=\viz{weight}\odot}\step{normalize}{\viz{x}\big/}\step{rms}{\sqrt{\step{mean}{\operatorname{mean}\big(}\step{square}{{\viz{x}}^{2}}\step{mean}{\big)}\step{eps}{+\epsilon}}}'
fold:
  label: '$\viz{out}$'
  title: RMSNorm（已折叠）
  text: |
    $$\viz{out}={{ out | matrix:2 }}$$
  backward:
    label: '$\partial\viz{weight},\ \partial\viz{x}$'
    title: 穿过 RMSNorm（已折叠）
    text: |
      $$\frac{\partial\ell}{\partial\viz{weight}}={{ weight.grad | matrix:3 }}$$

steps:
  - id: float
    show: xf
    label: '$\viz{xf}$'
    title: 转成 float32
    text: |
      <code>hidden_states.to(torch.float32)</code>：HF 先记下输入的 dtype，再把输入转成 float32，后面的平方、平均和 rsqrt 都在 float32 里算。
      $$\viz{xf}={{ xf | matrix:2 }}$$
    backward:
      label: '$\partial\viz{x}$'
      title: 传到输入
      text: |
        类型转换的局部导数是 1。平方这一路和归一化的直连那一路在 $\viz{xf}$ 上相加，再转回输入的 dtype 交给 $\viz{x}$。RMSNorm 交给输入的这部分梯度和这一行的输入垂直，因为 RMSNorm 对整行的缩放不敏感。
        $$\frac{\partial\ell}{\partial\viz{x}}={{ x.grad | matrix:3 }}$$
  - id: square
    show: sq
    label: '$\viz{sq}$'
    title: 逐元素平方
    text: |
      <code>hidden_states.pow(2)</code>：每个元素各自平方。
      $$\viz{sq}={{ sq | matrix:2 }}$$
    backward:
      label: '$\partial\viz{xf}$'
      title: 穿过平方
      text: |
        平方的局部导数是 $2x$。
        $$\frac{\partial\ell}{\partial\viz{xf}}={{ xf.grad | matrix:3 }}$$
  - id: mean
    show: ms
    label: '$\viz{ms}$'
    title: 平方的平均
    text: |
      每一行对平方取平均，得到 ms，对应 <code>.mean(-1, keepdim=True)</code>。每个位置各算各的，互不影响，所以 ms 是每行一个。
      $$\viz{ms}={{ ms | matrix:3 }}$$
    backward:
      label: '$\partial\viz{sq}$'
      title: 穿过平均
      text: |
        平均值的局部导数是 $1/n$，ms 的梯度除以 $n$ 均分给这一行的每个平方。
        $$\frac{\partial\ell}{\partial\viz{sq}}={{ sq.grad | matrix:3 }}$$
  - id: eps
    show: mse
    label: '$\viz{mse}$'
    title: 加上 $\epsilon$
    text: |
      加上 $\epsilon={{ eps }}$，对应 <code>variance + self.variance_epsilon</code>，保证下一步不会除以 0。
      $$\viz{mse}={{ mse | matrix:3 }}$$
    backward:
      label: '$\partial\viz{ms}$'
      title: 穿过加 $\epsilon$
      text: |
        加常数的局部导数是 1，梯度原样传下去。
        $$\frac{\partial\ell}{\partial\viz{ms}}={{ ms.grad | matrix:3 }}$$
  - id: rms
    show: r
    label: '$\viz{r}$'
    title: 平方根的倒数
    text: |
      取平方根的倒数，得到这一行的 $r=1/\sqrt{\mathrm{ms}+\epsilon}$，对应一次 <code>torch.rsqrt</code>。
      $$\viz{r}={{ r | matrix:3 }}$$
    backward:
      label: '$\partial\viz{mse}$'
      title: 穿过 rsqrt
      text: |
        $\frac{d}{dv}v^{-1/2}=-\frac{1}{2}v^{-3/2}$，所以局部导数是 $-r^{3}/2$。
        $$\frac{\partial\ell}{\partial\viz{mse}}={{ mse.grad | matrix:3 }}$$
  - id: normalize
    show: xh
    label: '$\viz{xh}$'
    title: 归一化
    text: |
      <code>hidden_states * torch.rsqrt(...)</code>：每个分量乘上自己那一行的 $r$。一个元素直接依赖它自己，又经过 $r$ 依赖同一行的其他元素，所以画了两组连线；不同的行之间没有连线。这里不减均值，也没有 bias。
      $$\viz{xh}={{ xh | matrix:2 }}$$
    backward:
      label: '$\partial\viz{r},\ \partial\viz{xf}$'
      title: 传到 r，以及输入的直连那条
      text: |
        $r_t$ 有 $d$ 条出边，局部导数各是这一行的输入分量，相加得到 $\partial\ell/\partial r_t=\mathbf{x}_t\cdot\mathbf{u}_t$。输入沿直连那条边拿到 $r_t u_{t,k}$。
        $$\frac{\partial\ell}{\partial\viz{r}}={{ r.grad | matrix:3 }}$$
  - id: cast
    show: xc
    label: '$\viz{xc}$'
    title: 转回输入的 dtype
    text: |
      <code>hidden_states.to(input_dtype)</code>：归一化的结果转回输入的 dtype，所以乘权重时两边都是输入的 dtype。
      $$\viz{xc}={{ xc | matrix:2 }}$$
    backward:
      label: '$\partial\viz{xh}$'
      title: 穿过类型转换
      text: 类型转换的局部导数是 1，梯度转回 float32。
  - id: scale
    show: [weight, out]
    label: '$\viz{out}$'
    title: 乘上权重 $\viz{weight}$
    text: |
      <code>self.weight * hidden_states</code>：$\viz{weight}$ 是长度为 $d$ 的向量，所有位置共用，所以它的每个分量连到每一行的同一列。
      $$\viz{out}=\viz{weight}\odot\viz{xc}={{ out | matrix:2 }}$$
    backward:
      label: '$\partial\viz{weight},\ \partial\viz{xc}$'
      title: 传到 $\viz{weight}$ 和 $\viz{xc}$
      text: |
        逐元素乘的两个输入互为对方的局部导数。$\viz{weight}$ 被所有位置共用，所以它的梯度要把各行加起来。
        $$\frac{\partial\ell}{\partial\viz{weight}}={{ weight.grad | matrix:3 }},\qquad \mathbf{u}=\frac{\partial\ell}{\partial\viz{out}}\odot\viz{weight}={{ xc.grad | matrix:3 }}$$
